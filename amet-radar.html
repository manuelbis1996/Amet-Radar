<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#12141a">
<meta name="description" content="Reportes comunitarios de retenes de tránsito en tiempo real en Santo Domingo.">
<meta property="og:type" content="website">
<meta property="og:title" content="AMET Radar">
<meta property="og:description" content="Reportes comunitarios de retenes de tránsito en tiempo real en Santo Domingo.">
<meta property="og:url" content="https://amet-radar.netlify.app/">
<meta property="og:image" content="https://amet-radar.netlify.app/icon-512.png">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="AMET Radar">
<meta name="twitter:description" content="Reportes comunitarios de retenes de tránsito en tiempo real en Santo Domingo.">
<meta name="twitter:image" content="https://amet-radar.netlify.app/icon-512.png">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>AMET Radar</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  /*
    Identidad: "instrumental de retén nocturno" — un tablero tipo HUD de
    auto, no un mapa turístico. Fondo frío casi negro (para no deslumbrar
    de noche) contra un ámbar de baliza como único acento cálido.
    Display: Big Shoulders (condensado/industrial, letrero de carretera).
    UI/cuerpo: IBM Plex Sans. Datos tabulares (hora, contador, votos):
    IBM Plex Mono — números de instrumento, no de blog.
  */
  :root{
    --ink: #12141a;
    --panel: #191d24;
    --panel-2: #20252e;
    --line: #2a303b;
    --amber: #ffb020;
    --amber-dim: #c98a1c;
    --signal: #f4f1ea;
    --muted: #8a92a1;
    --teal: #34c9a8;
    --alert: #ff5d3a;
    --blue: #4f9bf0;
    --font-display: 'Big Shoulders Display', sans-serif;
    --font-body: 'IBM Plex Sans', sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; height:100%; background:var(--ink); font-family:var(--font-body); color:var(--signal); overflow:hidden; }
  #app{ position:relative; width:100%; height:100vh; height:100dvh; display:flex; flex-direction:column; }
  ::selection{ background:var(--amber); color:var(--ink); }

  /* Header: barra HUD translúcida flotando sobre el mapa, con una franja
     de cinta de precaución (rayada) como remate en vez de un borde plano. */
  header{
    background: rgba(18,20,26,0.78);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    padding: 14px 16px 15px;
    display:flex; align-items:center; justify-content:space-between;
    z-index: 500; flex-shrink:0; position:relative;
  }
  header::after{
    content:''; position:absolute; left:0; right:0; bottom:0; height:3px;
    background: repeating-linear-gradient(135deg, var(--amber) 0 10px, transparent 10px 20px);
  }
  .brand{ display:flex; align-items:center; gap:11px; }
  .brand-mark{
    width:36px; height:36px; border-radius:9px; flex-shrink:0;
    background: var(--panel-2); border:1px solid var(--line);
    position:relative; overflow:hidden;
  }
  .brand-mark::before{
    content:''; position:absolute; inset:0;
    background: conic-gradient(from 0deg, transparent 0deg 270deg, var(--amber) 330deg, transparent 360deg);
    animation: radar-spin 2.4s linear infinite;
  }
  .brand-mark::after{
    content:''; position:absolute; top:50%; left:50%; width:5px; height:5px; margin:-2.5px 0 0 -2.5px;
    border-radius:50%; background:var(--amber); box-shadow:0 0 6px 1px rgba(255,176,32,0.85);
  }
  @keyframes radar-spin{ to{ transform: rotate(360deg); } }
  .brand h1{
    font-family:var(--font-display); font-weight:700; letter-spacing:0.2px;
    font-size:21px; margin:0; text-transform:uppercase; line-height:1;
  }
  .brand p{ margin:2px 0 0; font-size:11px; color:var(--muted); letter-spacing:0.2px; }
  .version-tag{ font-family:var(--font-mono); font-size:9px; opacity:.65; margin-left:4px; }
  .stat{
    font-family:var(--font-mono); text-align:right; font-size:9.5px; color:var(--muted);
    letter-spacing:0.5px; text-transform:uppercase;
  }
  .stat b{
    color:var(--amber); font-size:21px; display:block; line-height:1.15;
    font-variant-numeric:tabular-nums; font-weight:600;
  }
  .header-actions{ display:flex; align-items:center; gap:12px; }
  #push-toggle-btn{
    width:34px; height:34px; border-radius:50%; flex-shrink:0;
    background: rgba(32,37,46,0.85); border:1px solid var(--line); color:var(--muted);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; transition: transform 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }
  #push-toggle-btn svg{ width:16px; height:16px; }
  #push-toggle-btn:active{ transform:scale(0.9); }
  #push-toggle-btn[data-state="active"]{ color:var(--amber); border-color:var(--amber-dim); }
  #push-toggle-btn[data-state="loading"]{ opacity:.55; cursor:default; }
  #push-toggle-btn[hidden]{ display:none; }

  /* Filter chips */
  #filters{
    display:flex; gap:8px; padding:11px 16px; overflow-x:auto;
    background: linear-gradient(to bottom, rgba(18,20,26,0.6), rgba(18,20,26,0));
    flex-shrink:0; -webkit-overflow-scrolling:touch; position:relative; z-index:490;
  }
  #filters::-webkit-scrollbar{ display:none; }
  .chip{
    display:flex; align-items:center; gap:6px; white-space:nowrap;
    padding:8px 14px; border-radius:999px; border:1px solid var(--line);
    background:rgba(32,37,46,0.85); color:var(--muted);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    font-family:var(--font-display); font-weight:600; font-size:12.5px; letter-spacing:0.3px; text-transform:uppercase;
    cursor:pointer; user-select:none; transition:background .15s ease, color .15s ease, border-color .15s ease, transform .1s ease;
  }
  .chip:active{ transform:scale(0.96); }
  .chip[aria-pressed="true"]{ background:var(--chip-color,var(--amber)); color:var(--ink); border-color:var(--chip-color,var(--amber)); }

  /* Map */
  #map{ flex:1; background:#e8e6e1; position:relative; }
  .leaflet-container{ background:#e8e6e1; }

  #map-loader{
    position:absolute; inset:0; z-index:450;
    background: radial-gradient(circle at 50% 45%, rgba(24,27,34,0.4), rgba(12,14,18,0.9));
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px;
    font-family:var(--font-display); font-weight:600; font-size:12px; color:var(--muted); letter-spacing:0.4px; text-transform:uppercase;
  }
  #map-loader[hidden]{ display:none; }

  /* Radar sweep: reemplaza el spinner genérico; el mismo motivo se usa en
     el loader de pantalla completa y, en tamaño chico, dentro de las hojas
     (compresión de foto, publicación) para que todo el "esperar" de la app
     se sienta como una sola cosa reconocible. */
  .radar-sweep{
    width:64px; height:64px; border-radius:50%; position:relative; flex-shrink:0;
    border:1px solid rgba(255,176,32,0.22);
    background: radial-gradient(circle, rgba(255,176,32,0.07) 0%, transparent 72%);
  }
  .radar-sweep::before{
    content:''; position:absolute; inset:9px; border-radius:50%; border:1px solid rgba(255,176,32,0.18);
  }
  .radar-sweep::after{
    content:''; position:absolute; inset:0; border-radius:50%;
    background: conic-gradient(from 0deg, transparent 0deg, rgba(255,176,32,0.6) 40deg, transparent 95deg);
    animation: radar-spin 1.5s linear infinite;
  }
  .radar-sweep.small{ width:22px; height:22px; margin:4px 0 0; }
  .radar-sweep.small::before{ inset:3px; }

  /* Marcador: rombo de señal de precaución en vez de pin genérico —
     centrado sobre el punto, sin "cola" que apunte, como un ícono de
     instrumento más que un alfiler de mapa turístico. */
  .amet-pin{
    width:34px; height:34px;
    display:flex; align-items:center; justify-content:center;
    filter: drop-shadow(0 3px 7px rgba(0,0,0,0.55));
  }
  .amet-pin .badge{
    width:25px; height:25px; border-radius:6px;
    transform: rotate(45deg);
    background: var(--amber);
    border: 2px solid var(--ink);
    display:flex; align-items:center; justify-content:center;
  }
  .amet-pin .badge span{ transform: rotate(-45deg); font-size:13px; }
  .amet-pin.stale .badge{ background: var(--muted); }
  .amet-pin.pending .badge{ opacity:.55; border-style:dashed; }

  /* "Me" marker */
  .me-marker{ width:22px; height:22px; }
  .me-dot{
    width:16px; height:16px; border-radius:50%; background:var(--blue);
    border:3px solid #fff; box-shadow:0 0 0 4px rgba(79,155,240,0.35);
    animation: me-pulse 2s ease-out infinite;
  }
  @keyframes me-pulse{
    0%{ box-shadow:0 0 0 4px rgba(79,155,240,0.35); }
    70%{ box-shadow:0 0 0 12px rgba(79,155,240,0); }
    100%{ box-shadow:0 0 0 4px rgba(79,155,240,0); }
  }

  .leaflet-popup-content-wrapper{
    background: var(--panel-2); color: var(--signal); border-radius: 14px;
    box-shadow: 0 14px 32px rgba(0,0,0,0.5);
  }
  .leaflet-popup-tip{ background: var(--panel-2); }
  .popup-card{ font-family:var(--font-body); width:216px; }
  .popup-card img{ width:100%; border-radius:8px; display:block; margin-bottom:8px; aspect-ratio:4/3; object-fit:cover; }
  .popup-card .cat-label{
    display:inline-block; font-family:var(--font-display); font-weight:700; font-size:10.5px; letter-spacing:0.3px;
    text-transform:uppercase; padding:3px 9px; border-radius:999px; color:var(--ink);
    background:var(--amber); margin-bottom:8px;
  }
  .popup-card .time{
    font-size:11px; color:var(--amber); font-family:var(--font-mono); letter-spacing:0.2px;
    font-variant-numeric:tabular-nums;
  }
  .popup-card .note{ font-size:12.5px; color:var(--muted); margin-top:5px; line-height:1.4; }
  .popup-card .votes{ display:flex; gap:6px; margin-top:11px; }
  .vote-btn{
    flex:1; display:flex; align-items:center; justify-content:center; gap:5px;
    background:var(--panel); border:1px solid var(--line); color:var(--signal);
    border-radius:10px; padding:7px 4px; font-size:11.5px; font-weight:500; cursor:pointer; font-family:var(--font-body);
    transition: transform .1s ease;
  }
  .vote-btn:active{ transform:scale(0.95); }
  .vote-btn.deny{ color:#ffab8f; }
  .vote-btn.confirm{ color:#7fe4c9; }
  .popup-card .mini-actions{ display:flex; gap:6px; margin-top:8px; }
  .mini-btn{
    flex:1; background:transparent; border:1px solid var(--line); color:var(--muted);
    border-radius:10px; padding:7px 4px; font-size:10.5px; cursor:pointer; font-family:var(--font-display); font-weight:600;
    text-transform:uppercase; letter-spacing:0.3px;
  }
  .mini-btn.danger{ color:var(--alert); border-color:rgba(255,93,58,0.4); }

  /* FAB row: barra de vidrio flotante sobre el mapa */
  #fab-row{
    position:absolute; left:0; right:0; bottom:calc(20px + env(safe-area-inset-bottom, 0px));
    display:flex; align-items:center; justify-content:center; gap:12px;
    z-index:400; padding:0 16px;
  }
  #locate-btn{
    width:50px; height:50px; border-radius:50%; flex-shrink:0;
    background: rgba(25,29,36,0.85); border:1px solid var(--line); color:var(--signal);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; box-shadow:0 6px 18px rgba(0,0,0,0.45);
    transition: transform 0.15s ease;
  }
  #locate-btn svg{ width:20px; height:20px; }
  #locate-btn:active{ transform:scale(0.92); }
  #report-btn{
    background: linear-gradient(135deg, var(--amber), var(--amber-dim));
    color: var(--ink);
    border:none; border-radius: 999px;
    padding: 14px 26px;
    font-family:var(--font-display); font-weight:700; font-size:14.5px; letter-spacing:0.3px; text-transform:uppercase;
    display:flex; align-items:center; gap:9px;
    box-shadow: 0 8px 22px rgba(255,176,32,0.28), 0 2px 6px rgba(0,0,0,0.4);
    cursor:pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  #report-btn svg{ width:18px; height:18px; flex-shrink:0; }
  #report-btn:active{ transform: scale(0.96); }
  #report-btn:disabled{ background: var(--line); color: var(--muted); cursor:default; box-shadow:none; }

  /* Overlay flow */
  #flow-overlay{
    position:absolute; inset:0; background: rgba(10,12,16,0.78);
    display:flex; align-items:flex-end; justify-content:center;
    z-index:1000;
  }
  #flow-overlay[hidden]{ display:none; }
  .sheet{
    background: var(--panel-2); width:100%; max-width:480px;
    border-radius: 20px 20px 0 0;
    padding: 22px 20px calc(28px + env(safe-area-inset-bottom, 0px));
    position:relative; overflow:hidden;
    box-shadow: 0 -12px 40px rgba(0,0,0,0.5);
  }
  .sheet::before{
    content:''; position:absolute; top:0; left:0; right:0; height:4px;
    background: repeating-linear-gradient(135deg, var(--amber) 0 12px, var(--ink) 12px 24px);
  }
  .sheet h2{
    font-family:var(--font-display); font-weight:700; font-size:19px; margin:0 0 4px; text-transform:uppercase; letter-spacing:0.2px;
  }
  .sheet p.sub{ margin:0 0 16px; font-size:13px; color:var(--muted); line-height:1.45; }
  .row-center{ display:flex; align-items:center; gap:12px; }

  .cat-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px; }
  .cat-option{
    display:flex; flex-direction:column; align-items:center; gap:6px;
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:16px 8px; cursor:pointer; color:var(--signal); font-size:12.5px; font-weight:500;
    font-family:var(--font-body); text-align:center;
    transition: background .15s ease, transform .1s ease;
  }
  .cat-option span.emoji{ font-size:24px; }
  .cat-option:active{ transform:scale(0.96); background:var(--panel-2); }

  .preview-photo{ width:100%; border-radius:12px; margin-bottom:12px; aspect-ratio:4/3; object-fit:cover; }
  textarea{
    width:100%; background: var(--panel); border:1px solid var(--line); border-radius:10px;
    color: var(--signal); padding:11px; font-family:var(--font-body); font-size:13px; resize:none;
    margin-bottom:14px;
  }
  textarea::placeholder{ color: var(--muted); }
  .btn-row{ display:flex; gap:10px; }
  .btn{
    flex:1; border:none; border-radius:12px; padding:14px; font-family:var(--font-display);
    font-weight:700; font-size:13.5px; letter-spacing:0.3px; text-transform:uppercase; cursor:pointer;
    transition: transform .15s ease;
  }
  .btn-primary{ background: linear-gradient(135deg, var(--amber), var(--amber-dim)); color: var(--ink); box-shadow:0 6px 16px rgba(255,176,32,0.22); }
  .btn-primary:active{ transform:scale(0.97); }
  .btn-ghost{ background: transparent; color: var(--muted); border:1px solid var(--line); }
  .btn-ghost:active{ transform:scale(0.97); }
  .btn:disabled{ opacity:.4; cursor:default; }
  .error-box{
    background: rgba(255,93,58,0.12); border:1px solid var(--alert); color:#ffab8f;
    padding:10px 12px; border-radius:10px; font-size:12px; margin-bottom:14px;
  }
  .toast{
    position:absolute; top:78px; left:50%; transform:translateX(-50%);
    background: var(--teal); color:var(--ink); padding:11px 20px; border-radius:999px;
    font-family:var(--font-display); font-weight:700; font-size:12.5px; letter-spacing:0.2px; z-index:1100;
    box-shadow:0 8px 22px rgba(0,0,0,0.4);
    animation: toast-in 0.25s ease;
    max-width:80%; text-align:center;
  }
  .toast.warn{ background:var(--alert); color:#fff; }
  @keyframes toast-in{ from{ opacity:0; transform:translate(-50%,-8px);} to{opacity:1; transform:translate(-50%,0);} }

  #camera-input{ display:none; }

  @media (prefers-reduced-motion: reduce){
    .me-dot, .toast, .brand-mark::before, .radar-sweep::after{ animation:none; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <div class="brand-mark"></div>
      <div>
        <h1>AMET Radar</h1>
        <p>Reportes de la comunidad<span class="version-tag" id="app-version"></span></p>
      </div>
    </div>
    <div class="header-actions">
      <div class="stat"><b id="stat-count">0</b>en vista</div>
      <button id="push-toggle-btn" data-state="inactive" aria-label="Avisarme de retenes cerca" title="Avisarme de retenes cerca" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      </button>
    </div>
  </header>

  <div id="filters" role="group" aria-label="Filtrar por categoría"></div>

  <div id="map">
    <div id="map-loader"><div class="radar-sweep"></div><span>Buscando tu ubicación…</span></div>
  </div>

  <div id="fab-row">
    <button id="locate-btn" aria-label="Centrar mapa en mi ubicación" title="Centrar en mi ubicación">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>
    </button>
    <button id="report-btn" aria-label="Reportar ubicación de un retén">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M12 3 2 20h20L12 3z"/><path d="M12 10v4"/><circle cx="12" cy="17" r="0.6" fill="currentColor" stroke="none"/></svg>
      <span>Reportar ubicación</span>
    </button>
  </div>

  <input type="file" id="camera-input" accept="image/*" capture="environment">

  <div id="flow-overlay" hidden></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(function(){
  // Debe coincidir a mano con el sufijo de CACHE_NAME en sw.js (ver
  // CLAUDE.md): al subir uno, subir el otro. Se muestra en el header para
  // poder confirmar a simple vista que una PWA instalada ya tomó la
  // versión nueva del service worker, sin tener que abrir devtools.
  const APP_VERSION = 'v8.0';
  const DEFAULT_CENTER = [18.4861, -69.9312]; // Santo Domingo
  const STALE_MINUTES = 180;   // a partir de aqui se consideran "viejos"
  const MAX_AGE_MINUTES = 360; // se ocultan/borran pasado este tiempo
  const DENY_THRESHOLD = 2;    // (negaciones - confirmaciones) para retirar antes
  const REPORT_LIMIT = 3;      // reportes máximos por ventana
  const REPORT_WINDOW_MIN = 60;
  const APPROX_RADIUS_METERS = 150; // radio del círculo de zona aproximada (reporte rápido)

  const CATEGORIES = {
    reten_fijo:  { label:'Retén fijo',      emoji:'👮', color:'var(--amber)',      hex:'#f5c518' },
    reten_movil: { label:'Retén móvil',     emoji:'🚓', color:'var(--teal)',   hex:'#2fa089' },
    accidente:   { label:'Accidente',       emoji:'⚠️', color:'var(--alert)',        hex:'#e4572e' },
    control:     { label:'Control tránsito',emoji:'🚦', color:'var(--blue)', hex:'#4a90d9' }
  };
  const activeCategories = new Set(Object.keys(CATEGORIES));

  document.getElementById('app-version').textContent = APP_VERSION;

  // ---- Backend compartido (Supabase) ----
  // Los reportes viven en la tabla `reports` de un proyecto Supabase (no en
  // localStorage ni en un archivo del servidor), así que cualquier
  // dispositivo que entre a esta app ve los mismos reportes sin depender de
  // que una PC en particular esté prendida. La SUPABASE_ANON_KEY es una
  // publishable key: está pensada para vivir en el cliente, el control de
  // acceso real lo hacen las políticas RLS de la tabla. reportsCache es la
  // copia en memoria del cliente, refrescada al cargar y luego por sondeo
  // periódico (ver refreshReports).
  const SUPABASE_URL = 'https://nikexwjxxcxzhsuypsjn.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_p8U6gvvBwPVHdfmspjyCXA_g6clP58v';
  const REPORTS_URL = `${SUPABASE_URL}/rest/v1/reports`;
  const SUPABASE_HEADERS = {
    'apikey': SUPABASE_ANON_KEY,
    'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
    'Content-Type': 'application/json'
  };
  let reportsCache = {};

  // ---- Notificaciones push por cercanía ----
  // Avisa (aunque la app esté cerrada) cuando alguien publica un reporte
  // nuevo cerca de la última posición conocida de este dispositivo. La
  // suscripción vive en la tabla push_subscriptions de Supabase; el envío
  // real lo hace el Edge Function notify-nearby, disparado por un trigger
  // en cada INSERT sobre reports (ver CLAUDE.md).
  const VAPID_PUBLIC_KEY = 'BOg_VDCTXvRF0l9cLLFI_sGgWGkiyVb3SmIu93c8bcFatvEcxzSPfqUwvAfaO6X8nMdVH596vW0pIAdhaHe5nKY';
  const PUSH_SUBS_URL = `${SUPABASE_URL}/rest/v1/push_subscriptions`;
  const PUSH_ENDPOINT_KEY = 'amet_push_endpoint_v1';
  const PUSH_CATEGORIES_KEY = 'amet_push_categories_v1';
  const PUSH_POS_UPDATE_MIN_METERS = 400;
  const PUSH_POS_UPDATE_MIN_MS = 5 * 60 * 1000;

  // Como push_subscriptions no tiene política de SELECT (a propósito, ver
  // CLAUDE.md), el cliente nunca puede leer de vuelta su fila — la
  // preferencia de categorías vive solo acá. Ausencia de la clave = nunca
  // configurado (dispara la hoja de onboarding); presencia = ya se
  // preguntó, aunque el valor sea la lista completa.
  function getPushCategories(){
    try{ const raw = localStorage.getItem(PUSH_CATEGORIES_KEY); return raw ? JSON.parse(raw) : null; }
    catch(e){ return null; }
  }
  function savePushCategories(list){ localStorage.setItem(PUSH_CATEGORIES_KEY, JSON.stringify(list)); }

  async function fetchAllReports(){
    try{
      const res = await fetch(`${REPORTS_URL}?select=*`, { headers: SUPABASE_HEADERS });
      if(res.ok){
        const rows = await res.json();
        const next = {};
        for(const row of rows){
          const { id, created_at, ...record } = row;
          next[id] = record;
        }
        reportsCache = next;
      }
    }catch(e){ console.error('Error cargando reportes', e); }
    return reportsCache;
  }

  class NetworkError extends Error {}

  async function insertReport(id, record){
    let res;
    try{
      res = await fetch(REPORTS_URL, {
        method: 'POST',
        headers: { ...SUPABASE_HEADERS, 'Prefer': 'return=minimal' },
        body: JSON.stringify({ id, ...record })
      });
    }catch(e){
      throw new NetworkError('Sin conexión');
    }
    if(!res.ok) throw new Error('No se pudo publicar el reporte');
    reportsCache[id] = record;
  }

  async function updateReportVotes(id, confirms, denies){
    try{
      await fetch(`${REPORTS_URL}?id=eq.${encodeURIComponent(id)}`, {
        method: 'PATCH',
        headers: { ...SUPABASE_HEADERS, 'Prefer': 'return=minimal' },
        body: JSON.stringify({ confirms, denies })
      });
    }catch(e){ console.error('Error actualizando votos', e); }
    if(reportsCache[id]){ reportsCache[id].confirms = confirms; reportsCache[id].denies = denies; }
  }

  async function deleteReportRemote(id){
    try{
      await fetch(`${REPORTS_URL}?id=eq.${encodeURIComponent(id)}`, {
        method: 'DELETE',
        headers: SUPABASE_HEADERS
      });
    }catch(e){ console.error('Error eliminando reporte', e); }
    delete reportsCache[id];
  }

  // ---- Preferencias de este dispositivo (siguen siendo locales) ----
  const VOTED_KEY = 'amet_voted_v1';
  const MINE_KEY = 'amet_my_reports_v1';
  const TIMES_KEY = 'amet_report_times_v1';

  function getVoted(){ try{ return new Set(JSON.parse(localStorage.getItem(VOTED_KEY)||'[]')); }catch(e){ return new Set(); } }
  function saveVoted(set){ localStorage.setItem(VOTED_KEY, JSON.stringify([...set])); }
  function getMine(){ try{ return new Set(JSON.parse(localStorage.getItem(MINE_KEY)||'[]')); }catch(e){ return new Set(); } }
  function saveMine(set){ localStorage.setItem(MINE_KEY, JSON.stringify([...set])); }

  function canReport(){
    const times = JSON.parse(localStorage.getItem(TIMES_KEY)||'[]').filter(t => (Date.now()-t) < REPORT_WINDOW_MIN*60000);
    localStorage.setItem(TIMES_KEY, JSON.stringify(times));
    return times.length < REPORT_LIMIT;
  }
  function registerReportTime(){
    const times = JSON.parse(localStorage.getItem(TIMES_KEY)||'[]');
    times.push(Date.now());
    localStorage.setItem(TIMES_KEY, JSON.stringify(times));
  }

  // Cola de reportes ya creados que no se pudieron enviar por falta de red
  // (distinto de pendingLocation/pendingPhoto/pendingCategory, que son el
  // estado del flujo de creación en curso). Persistida para sobrevivir un
  // reload; pendingIds es un derivado en memoria para lookups O(1).
  const PENDING_KEY = 'amet_pending_queue_v1';
  function getPendingQueue(){ try{ return JSON.parse(localStorage.getItem(PENDING_KEY)||'[]'); }catch(e){ return []; } }
  function savePendingQueue(list){ localStorage.setItem(PENDING_KEY, JSON.stringify(list)); }

  let pendingQueue = getPendingQueue();
  let pendingIds = new Set(pendingQueue.map(p => p.id));

  function enqueuePending(id, record){
    pendingQueue.push({ id, record });
    savePendingQueue(pendingQueue);
    pendingIds.add(id);
  }
  function dequeuePending(id){
    pendingQueue = pendingQueue.filter(p => p.id !== id);
    savePendingQueue(pendingQueue);
    pendingIds.delete(id);
  }

  const map = L.map('map', { zoomControl:true, attributionControl:false }).setView(DEFAULT_CENTER, 13);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
    subdomains:'abcd', maxZoom:19
  }).addTo(map);

  const markersById = {};
  let pendingLocation = null;
  let pendingPhoto = null;
  let pendingCategory = null;

  function timeAgo(ts){
    const min = Math.floor((Date.now()-ts)/60000);
    if(min < 1) return 'justo ahora';
    if(min < 60) return `hace ${min} min`;
    const h = Math.floor(min/60);
    if(h < 24) return `hace ${h} h`;
    return `hace ${Math.floor(h/24)} d`;
  }

  // Desplaza un punto una distancia aleatoria (entre minMeters y maxMeters)
  // en una dirección aleatoria. El reporte rápido la usa solo para variar
  // el centro del círculo de zona; la imprecisión real la da el radio
  // (APPROX_RADIUS_METERS) que se dibuja alrededor, no este desplazamiento.
  // Distancia real entre dos puntos (Haversine) — usada para decidir si
  // vale la pena reportar la nueva posición de la suscripción push, no
  // para nada relacionado al jitter de abajo.
  function distanceMeters(lat1, lng1, lat2, lng2){
    const R = 6371000;
    const toRad = d => d * Math.PI / 180;
    const dLat = toRad(lat2 - lat1);
    const dLng = toRad(lng2 - lng1);
    const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng/2)**2;
    return 2 * R * Math.asin(Math.sqrt(a));
  }

  function jitterLocation(lat, lng, minMeters, maxMeters){
    const angle = Math.random() * Math.PI * 2;
    const dist = minMeters + Math.random() * (maxMeters - minMeters);
    const dLat = (dist * Math.cos(angle)) / 111320;
    const dLng = (dist * Math.sin(angle)) / (111320 * Math.cos(lat * Math.PI / 180));
    return { lat: lat + dLat, lng: lng + dLng };
  }

  function makeIcon(ageMinutes, category, pending){
    const cat = CATEGORIES[category] || CATEGORIES.reten_fijo;
    const stale = ageMinutes > STALE_MINUTES;
    return L.divIcon({
      className: '',
      html: `<div class="amet-pin ${pending?'pending':''}"><div class="badge ${stale?'stale':''}" style="background:${stale?'var(--muted)':cat.color}"><span>${cat.emoji}</span></div></div>`,
      iconSize:[34,34], iconAnchor:[17,17], popupAnchor:[0,-20]
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function popupHtml(id, r){
    const mine = getMine().has(id);
    const cat = CATEGORIES[r.category] || CATEGORIES.reten_fijo;
    const pending = pendingIds.has(id);
    const confirms = r.confirms || 0;
    const denies = r.denies || 0;
    return `
      <div class="popup-card" data-id="${id}">
        <span class="cat-label" style="background:${cat.color}">${cat.emoji} ${cat.label}</span>
        ${r.photo ? `<img src="${r.photo}" alt="Foto del reporte">` : ''}
        <div class="time">${pending ? 'Pendiente de sincronizar…' : timeAgo(r.ts)}${r.approx ? ` · Zona aproximada (~${APPROX_RADIUS_METERS} m)` : ''}</div>
        ${r.note ? `<div class="note">${escapeHtml(r.note)}</div>` : ''}
        ${pending ? `
        <div class="mini-actions">
          <button class="mini-btn danger" data-action="cancel-pending" data-id="${id}">Cancelar</button>
        </div>` : `
        <div class="votes">
          <button class="vote-btn confirm" data-action="confirm" data-id="${id}">👍 Sigue ahí (${confirms})</button>
          <button class="vote-btn deny" data-action="deny" data-id="${id}">👎 Ya no está (${denies})</button>
        </div>
        <div class="mini-actions">
          <button class="mini-btn" data-action="share" data-id="${id}">Compartir</button>
          ${mine ? `<button class="mini-btn danger" data-action="delete" data-id="${id}">Eliminar</button>` : ''}
        </div>`}
      </div>`;
  }

  // Reportes rápidos (r.approx) se dibujan como un círculo de zona en vez
  // de un pin: comunica que la ubicación real está en algún punto dentro de
  // ese radio, no marcada con precisión.
  function upsertApproxCircle(id, r){
    const ageMinutes = (Date.now()-r.ts)/60000;
    const pending = pendingIds.has(id);
    const cat = CATEGORIES[r.category] || CATEGORIES.reten_fijo;
    const stale = ageMinutes > STALE_MINUTES;
    const color = stale ? '#9a9a9e' : cat.hex;
    const style = {
      radius: APPROX_RADIUS_METERS, color, weight:2,
      fillColor: color, fillOpacity:0.18, dashArray: pending ? '2 6' : '6 6'
    };
    if(markersById[id]){
      markersById[id].setLatLng([r.lat, r.lng]);
      markersById[id].setStyle(style);
      markersById[id].setPopupContent(popupHtml(id, r));
    } else {
      const c = L.circle([r.lat, r.lng], style).addTo(map);
      c.bindPopup(popupHtml(id, r));
      markersById[id] = c;
    }
  }

  function upsertMarker(id, r){
    if(r.approx) return upsertApproxCircle(id, r);
    const ageMinutes = (Date.now()-r.ts)/60000;
    const pending = pendingIds.has(id);
    if(markersById[id]){
      markersById[id].setIcon(makeIcon(ageMinutes, r.category, pending));
      markersById[id].setPopupContent(popupHtml(id, r));
    } else {
      const m = L.marker([r.lat, r.lng], { icon: makeIcon(ageMinutes, r.category, pending) }).addTo(map);
      m.bindPopup(popupHtml(id, r));
      markersById[id] = m;
    }
  }

  function removeMarker(id){
    if(markersById[id]){ map.removeLayer(markersById[id]); delete markersById[id]; }
  }

  function updateCount(){
    document.getElementById('stat-count').textContent = Object.keys(markersById).length;
  }

  // ---- Filtros de categoría ----
  const filtersEl = document.getElementById('filters');
  Object.entries(CATEGORIES).forEach(([key, cat]) => {
    const chip = document.createElement('button');
    chip.className = 'chip';
    chip.type = 'button';
    chip.style.setProperty('--chip-color', cat.color);
    chip.setAttribute('aria-pressed', 'true');
    chip.textContent = `${cat.emoji} ${cat.label}`;
    chip.addEventListener('click', () => {
      if(activeCategories.has(key)){
        activeCategories.delete(key);
        chip.setAttribute('aria-pressed', 'false');
      } else {
        activeCategories.add(key);
        chip.setAttribute('aria-pressed', 'true');
      }
      renderVisibleMarkers();
    });
    filtersEl.appendChild(chip);
  });

  // ---- Renderizado por zona visible + limpieza de vencidos ----
  function renderVisibleMarkers(){
    const bounds = map.getBounds().pad(0.25);
    const now = Date.now();

    for(const id in reportsCache){
      const r = reportsCache[id];
      const ageMinutes = (now - r.ts) / 60000;
      if(ageMinutes > MAX_AGE_MINUTES){
        delete reportsCache[id];
        removeMarker(id);
        deleteReportRemote(id);
        continue;
      }
      const inView = bounds.contains(L.latLng(r.lat, r.lng));
      const catOn = activeCategories.has(r.category);
      if(inView && catOn){
        upsertMarker(id, r);
      } else {
        removeMarker(id);
      }
    }
    updateCount();
  }

  // ---- Publicación diferida de reportes pendientes (offline) ----
  function restorePendingMarkers(){
    pendingQueue.forEach(item => upsertMarker(item.id, item.record));
    updateCount();
  }

  let flushInFlight = false;
  async function flushPendingQueue(){
    if(flushInFlight || pendingQueue.length === 0) return;
    if(navigator.onLine === false) return;
    flushInFlight = true;
    let synced = 0;
    try{
      for(const item of [...pendingQueue]){
        if(!pendingIds.has(item.id)) continue; // se canceló mientras esperábamos
        const ageMinutes = (Date.now() - item.record.ts) / 60000;
        if(ageMinutes > MAX_AGE_MINUTES){
          dequeuePending(item.id);
          removeMarker(item.id);
          updateCount();
          continue;
        }
        try{
          await insertReport(item.id, item.record);
          dequeuePending(item.id);
          upsertMarker(item.id, item.record);
          updateCount();
          synced++;
        }catch(err){
          if(err instanceof NetworkError) break; // seguimos offline, se reintenta después
          dequeuePending(item.id);
          removeMarker(item.id);
          updateCount();
          showToast('No se pudo sincronizar un reporte pendiente.', true);
        }
      }
    } finally {
      flushInFlight = false;
    }
    if(synced > 0) showToast(synced === 1 ? 'Reporte pendiente publicado.' : `${synced} reportes pendientes publicados.`);
  }

  // Sondeo periódico: así se ven los reportes que publican otros usuarios
  // desde otro dispositivo, no solo los que crea este navegador. Se
  // reutiliza el mismo intervalo como respaldo para reintentar la cola.
  async function refreshReports(){
    await fetchAllReports();
    renderVisibleMarkers();
    await flushPendingQueue();
  }

  restorePendingMarkers();
  map.on('moveend zoomend', renderVisibleMarkers);
  const reportsReady = refreshReports();
  setInterval(refreshReports, 8000);
  window.addEventListener('online', flushPendingQueue);

  // ---- Deep link: abrir un reporte compartido ----
  // openReportById es la parte reutilizable (centrar mapa + abrir popup);
  // la usan tanto el link compartido como el click en una notificación
  // push mientras la app ya está abierta (ver listener de 'message' más abajo).
  function openReportById(id){
    const r = reportsCache[id];
    if(!r) return;
    map.setView([r.lat, r.lng], 16);
    setTimeout(() => {
      upsertMarker(id, r);
      markersById[id] && markersById[id].openPopup();
    }, 300);
  }

  // Los links nuevos usan ?r= (query param, visible al servidor — lo
  // necesita netlify/edge-functions/report-preview.ts para armar el
  // preview de WhatsApp/Twitter, algo que un #hash nunca podría lograr
  // porque el fragmento no se manda en la request). Se sigue leyendo
  // #r= también por si queda algún link viejo compartido con el esquema
  // anterior — no cuesta nada mantenerlo.
  async function openSharedReportFromUrl(){
    const id = new URLSearchParams(location.search).get('r')
      || (location.hash.match(/r=([^&]+)/) || [])[1];
    if(!id) return;
    await reportsReady;
    openReportById(decodeURIComponent(id));
  }

  // ---- Notificaciones push: suscripción y estado del botón ----
  function urlBase64ToUint8Array(base64String){
    const padding = '='.repeat((4 - base64String.length % 4) % 4);
    const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
    const raw = atob(base64);
    return Uint8Array.from([...raw].map(c => c.charCodeAt(0)));
  }

  const pushToggleBtn = document.getElementById('push-toggle-btn');
  function setPushButtonState(state){ pushToggleBtn.dataset.state = state; }

  async function subscribeToPush(){
    setPushButtonState('loading');
    try{
      const permission = await Notification.requestPermission();
      if(permission !== 'granted'){
        showToast('Necesitamos permiso de notificaciones para poder avisarte');
        setPushButtonState('inactive');
        return;
      }
      const reg = await navigator.serviceWorker.ready;
      const sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
      });
      const json = sub.toJSON();
      const latlng = lastKnownLatLng || [DEFAULT_CENTER[0], DEFAULT_CENTER[1]];
      // Sin política de SELECT en push_subscriptions a propósito (ver
      // CLAUDE.md), así que un upsert con on_conflict/return=representation
      // falla: PostgREST necesita "leer de vuelta" la fila para resolverlo,
      // y esa lectura choca con la ausencia deliberada de esa política.
      // Se resuelve con DELETE (no-op si no existía) + POST simple, ambos
      // con return=minimal, en vez de un upsert.
      await fetch(`${PUSH_SUBS_URL}?endpoint=eq.${encodeURIComponent(json.endpoint)}`, {
        method: 'DELETE', headers: SUPABASE_HEADERS
      });
      const res = await fetch(PUSH_SUBS_URL, {
        method: 'POST',
        headers: { ...SUPABASE_HEADERS, 'Prefer': 'return=minimal' },
        body: JSON.stringify({
          endpoint: json.endpoint,
          p256dh: json.keys.p256dh,
          auth: json.keys.auth,
          lat: latlng[0], lng: latlng[1],
          updated_at: new Date().toISOString()
        })
      });
      if(!res.ok) throw new Error('No se pudo guardar la suscripción');
      localStorage.setItem(PUSH_ENDPOINT_KEY, json.endpoint);
      lastPushPosUpdate = { latlng, ts: Date.now() };
      setPushButtonState('active');
      showToast('Listo, te vamos a avisar de retenes cerca');
      // subscribeToPush() borra y vuelve a crear la fila (DELETE+POST, no
      // upsert), así que un re-suscribe pierde las categorías que el
      // dispositivo ya tenía elegidas del lado del servidor — hay que
      // restaurarlas, no solo decidir "primera vez sí/no".
      const savedCategories = getPushCategories();
      if(savedCategories === null){
        openPushCategoriesSheet();
      } else if(savedCategories.length < Object.keys(CATEGORIES).length){
        updatePushCategories(savedCategories);
      }
    }catch(err){
      console.error('Error suscribiendo a push', err);
      showToast('No se pudo activar el aviso de retenes cerca');
      setPushButtonState('inactive');
    }
  }

  async function unsubscribeFromPush(){
    setPushButtonState('loading');
    try{
      const reg = await navigator.serviceWorker.ready;
      const sub = await reg.pushManager.getSubscription();
      if(sub){
        await fetch(`${PUSH_SUBS_URL}?endpoint=eq.${encodeURIComponent(sub.endpoint)}`, {
          method: 'DELETE', headers: SUPABASE_HEADERS
        });
        await sub.unsubscribe();
      }
    }catch(err){ console.error('Error cancelando suscripción push', err); }
    localStorage.removeItem(PUSH_ENDPOINT_KEY);
    setPushButtonState('inactive');
    showToast('Avisos de retenes cerca desactivados');
  }

  let lastPushPosUpdate = null;
  async function updatePushSubscriptionPosition(latlng){
    if(pushToggleBtn.dataset.state !== 'active') return;
    if(lastPushPosUpdate){
      const elapsed = Date.now() - lastPushPosUpdate.ts;
      const moved = distanceMeters(lastPushPosUpdate.latlng[0], lastPushPosUpdate.latlng[1], latlng[0], latlng[1]);
      if(elapsed < PUSH_POS_UPDATE_MIN_MS && moved < PUSH_POS_UPDATE_MIN_METERS) return;
    }
    try{
      const reg = await navigator.serviceWorker.ready;
      const sub = await reg.pushManager.getSubscription();
      if(!sub) return;
      await fetch(`${PUSH_SUBS_URL}?endpoint=eq.${encodeURIComponent(sub.endpoint)}`, {
        method: 'PATCH',
        headers: { ...SUPABASE_HEADERS, 'Prefer': 'return=minimal' },
        body: JSON.stringify({ lat: latlng[0], lng: latlng[1], updated_at: new Date().toISOString() })
      });
      lastPushPosUpdate = { latlng, ts: Date.now() };
    }catch(err){ console.error('Error actualizando posición de suscripción push', err); }
  }

  async function updatePushCategories(categories){
    try{
      const reg = await navigator.serviceWorker.ready;
      const sub = await reg.pushManager.getSubscription();
      if(!sub) return;
      const allSelected = categories.length === Object.keys(CATEGORIES).length;
      await fetch(`${PUSH_SUBS_URL}?endpoint=eq.${encodeURIComponent(sub.endpoint)}`, {
        method: 'PATCH',
        headers: { ...SUPABASE_HEADERS, 'Prefer': 'return=minimal' },
        body: JSON.stringify({ categories: allSelected ? null : categories, updated_at: new Date().toISOString() })
      });
      savePushCategories(categories);
    }catch(err){ console.error('Error actualizando categorías de suscripción push', err); }
  }

  function openPushCategoriesSheet(){
    const current = getPushCategories() || Object.keys(CATEGORIES);
    const selected = new Set(current);
    const chips = Object.entries(CATEGORIES).map(([key, cat]) => `
      <button type="button" class="chip" data-cat="${key}" aria-pressed="${selected.has(key)}" style="--chip-color:${cat.color}">${cat.emoji} ${cat.label}</button>
    `).join('');
    renderSheet(`
      <h2>Avisos de retenes</h2>
      <p class="sub">Elige de qué categorías querés que te avisemos.</p>
      <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;">${chips}</div>
      <div class="btn-row" style="margin-bottom:10px;">
        <button class="btn btn-ghost" id="push-cat-cancel">Cancelar</button>
        <button class="btn btn-primary" id="push-cat-save">Guardar</button>
      </div>
      <button class="mini-btn danger" style="width:100%;" id="push-cat-unsubscribe">Desactivar avisos</button>
    `);
    const saveBtn = document.getElementById('push-cat-save');
    function refreshSaveState(){ saveBtn.disabled = selected.size === 0; }
    overlay.querySelectorAll('.chip[data-cat]').forEach(chip => {
      chip.addEventListener('click', () => {
        const key = chip.dataset.cat;
        if(selected.has(key)){ selected.delete(key); chip.setAttribute('aria-pressed', 'false'); }
        else { selected.add(key); chip.setAttribute('aria-pressed', 'true'); }
        refreshSaveState();
      });
    });
    refreshSaveState();
    document.getElementById('push-cat-cancel').addEventListener('click', closeOverlay);
    saveBtn.addEventListener('click', () => {
      updatePushCategories(Object.keys(CATEGORIES).filter(k => selected.has(k)));
      closeOverlay();
      showToast('Preferencias de avisos actualizadas');
    });
    document.getElementById('push-cat-unsubscribe').addEventListener('click', () => {
      closeOverlay();
      unsubscribeFromPush();
    });
  }

  async function initPushUI(){
    if(!('serviceWorker' in navigator) || !('PushManager' in window) || !('Notification' in window)) return;
    pushToggleBtn.hidden = false;
    try{
      const reg = await navigator.serviceWorker.ready;
      const sub = await reg.pushManager.getSubscription();
      setPushButtonState(sub ? 'active' : 'inactive');
    }catch(err){ setPushButtonState('inactive'); }

    pushToggleBtn.addEventListener('click', () => {
      if(pushToggleBtn.dataset.state === 'loading') return;
      if(pushToggleBtn.dataset.state === 'active') openPushCategoriesSheet();
      else subscribeToPush();
    });
  }
  initPushUI();

  if('serviceWorker' in navigator){
    navigator.serviceWorker.addEventListener('message', event => {
      if(event.data && event.data.type === 'open-report' && event.data.id){
        openReportById(event.data.id);
      }
    });
  }

  // ---- Votos, compartir y borrado (delegación de eventos) ----
  document.addEventListener('click', async (e) => {
    const btn = e.target.closest('[data-action]');
    if(!btn) return;
    const action = btn.dataset.action;
    const id = btn.dataset.id;
    if(!id) return;

    if(action === 'cancel-pending'){
      dequeuePending(id);
      const mine = getMine(); mine.delete(id); saveMine(mine);
      removeMarker(id);
      updateCount();
      map.closePopup();
      showToast('Reporte pendiente cancelado');
      return;
    }

    const r = reportsCache[id];
    if(!r) return;

    if(action === 'confirm' || action === 'deny'){
      const voted = getVoted();
      if(voted.has(id)){ showToast('Ya votaste en este reporte'); return; }
      voted.add(id); saveVoted(voted);
      const confirms = (r.confirms||0) + (action === 'confirm' ? 1 : 0);
      const denies = (r.denies||0) + (action === 'deny' ? 1 : 0);

      if(denies - confirms >= DENY_THRESHOLD){
        await deleteReportRemote(id);
        removeMarker(id);
        updateCount();
        showToast('Reporte retirado por la comunidad');
        return;
      }
      await updateReportVotes(id, confirms, denies);
      if(markersById[id]) markersById[id].setPopupContent(popupHtml(id, reportsCache[id]));
      showToast(action === 'confirm' ? 'Gracias por confirmar' : 'Gracias por avisar');
    }

    if(action === 'share'){
      const url = `${location.origin}${location.pathname}?r=${encodeURIComponent(id)}`;
      const cat = CATEGORIES[r.category] || CATEGORIES.reten_fijo;
      const text = `${cat.emoji} ${cat.label} reportado en AMET Radar`;
      if(navigator.share){
        navigator.share({ title: 'AMET Radar', text, url }).catch(() => {});
      } else if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(url).then(
          () => showToast('Enlace copiado al portapapeles'),
          () => showToast(url)
        );
      } else {
        showToast(url);
      }
    }

    if(action === 'delete'){
      const mine = getMine();
      if(!mine.has(id)){ showToast('Solo puedes eliminar tus propios reportes'); return; }
      await deleteReportRemote(id);
      mine.delete(id); saveMine(mine);
      removeMarker(id);
      updateCount();
      map.closePopup();
      showToast('Reporte eliminado');
    }
  });

  // ---- Geolocalización continua ("mi ubicación") ----
  const mapLoader = document.getElementById('map-loader');
  const locateBtn = document.getElementById('locate-btn');
  let meMarker = null;
  // firstFix: solo pasa a false con un fix exitoso. Un timeout de GPS no lo
  // toca, porque watchPosition sigue corriendo y puede resolver segundos
  // después — cuando eso pase, igual queremos centrar el mapa en el
  // usuario, no dejarlo silenciosamente en Santo Domingo.
  let firstFix = true;
  // hashHandled evita abrir el deep link de un reporte compartido dos
  // veces (una vez al mostrar el error de "no ubicación" y otra al llegar
  // el fix tardío).
  let hashHandled = false;
  let lastKnownLatLng = null;

  const meIcon = L.divIcon({
    className: '',
    html: `<div class="me-marker"><div class="me-dot"></div></div>`,
    iconSize:[22,22], iconAnchor:[11,11]
  });

  function hideLoader(){ mapLoader.hidden = true; }
  function tryOpenHashOnce(){
    if(hashHandled) return;
    hashHandled = true;
    openSharedReportFromUrl();
  }

  function startLocationWatch(){
    if(!('geolocation' in navigator)){
      hideLoader();
      showToast('Este navegador no soporta geolocalización');
      return;
    }
    navigator.geolocation.watchPosition(
      pos => {
        const latlng = [pos.coords.latitude, pos.coords.longitude];
        lastKnownLatLng = latlng;
        updatePushSubscriptionPosition(latlng);
        if(!meMarker){
          meMarker = L.marker(latlng, { icon: meIcon, zIndexOffset: 1000, keyboard:false }).addTo(map);
        } else {
          meMarker.setLatLng(latlng);
        }
        if(firstFix){
          map.setView(latlng, 15);
          firstFix = false;
          hideLoader();
          tryOpenHashOnce();
        }
      },
      err => {
        // No marcamos firstFix = false aquí: si el GPS solo tardó más de
        // lo esperado (frecuente al abrir la PWA con GPS frío), el fix
        // puede llegar igual unos segundos después y sí queremos centrar
        // el mapa en ese momento en vez de dejarlo trabado en Santo Domingo.
        if(!mapLoader.hidden){
          hideLoader();
          showToast('Tu ubicación está tardando en llegar. Se centrará el mapa apenas la tengamos.', true);
        }
        tryOpenHashOnce();
      },
      { enableHighAccuracy:true, timeout:20000, maximumAge:5000 }
    );
    // Tope de seguridad: no dejar el loader visible más de 20s.
    setTimeout(() => {
      if(!mapLoader.hidden) hideLoader();
      tryOpenHashOnce();
    }, 20500);
  }

  locateBtn.addEventListener('click', () => {
    if(lastKnownLatLng){
      map.setView(lastKnownLatLng, 16);
    } else {
      showToast('Aún buscando tu ubicación…');
    }
  });

  startLocationWatch();

  // ---- Flujo de reporte ----
  const overlay = document.getElementById('flow-overlay');
  const reportBtn = document.getElementById('report-btn');
  const cameraInput = document.getElementById('camera-input');

  function showToast(msg, warn){
    const t = document.createElement('div');
    t.className = 'toast' + (warn ? ' warn' : '');
    t.textContent = msg;
    document.getElementById('app').appendChild(t);
    setTimeout(()=> t.remove(), 2600);
  }

  function renderSheet(html){
    overlay.innerHTML = `<div class="sheet">${html}</div>`;
    overlay.hidden = false;
  }
  function closeOverlay(){
    overlay.hidden = true;
    overlay.innerHTML = '';
    overlay.style.pointerEvents = '';
    overlay.style.background = '';
    pendingLocation = null;
    pendingPhoto = null;
    pendingCategory = null;
    reportBtn.disabled = false;
    if(manualPickHandler){
      map.off('click', manualPickHandler);
      map.getContainer().style.cursor = '';
      manualPickHandler = null;
    }
  }

  let manualPickHandler = null;

  reportBtn.addEventListener('click', () => {
    if(!canReport()){
      showToast('Límite de reportes por hora alcanzado. Intenta más tarde.', true);
      return;
    }
    reportBtn.disabled = true;
    askReportMode();
  });

  function askReportMode(){
    renderSheet(`
      <h2>¿Cómo quieres reportar?</h2>
      <p class="sub">Elige la opción que mejor se ajuste al momento.</p>
      <div style="display:flex;flex-direction:column;gap:10px;margin-bottom:14px;">
        <button class="btn btn-primary" id="quick-btn" style="width:100%;">⚡ Reporte rápido — voy manejando</button>
        <button class="btn btn-ghost" id="detailed-btn" style="width:100%;">📍 Marcar en el mapa + foto</button>
      </div>
      <div class="btn-row">
        <button class="btn btn-ghost" id="cancel-btn">Cancelar</button>
      </div>
    `);
    document.getElementById('cancel-btn').addEventListener('click', closeOverlay);
    document.getElementById('quick-btn').addEventListener('click', startQuickReport);
    document.getElementById('detailed-btn').addEventListener('click', startManualPick);
  }

  // ---- Reporte rápido: sin foto, ubicación aproximada a partir del GPS ----
  function startQuickReport(){
    if(!lastKnownLatLng){
      showToast('Buscando tu ubicación… intenta de nuevo en unos segundos.', true);
      closeOverlay();
      return;
    }
    pendingLocation = jitterLocation(lastKnownLatLng[0], lastKnownLatLng[1], 0, 30);
    askForCategoryQuick();
  }

  function askForCategoryQuick(){
    const options = Object.entries(CATEGORIES).map(([key, cat]) => `
      <button class="cat-option" data-cat="${key}">
        <span class="emoji">${cat.emoji}</span>
        <span>${cat.label}</span>
      </button>
    `).join('');
    renderSheet(`
      <h2>¿Qué estás reportando?</h2>
      <p class="sub">Toca una categoría para publicar al instante. Sin foto: se marca una zona aproximada, no el punto exacto.</p>
      <div class="cat-grid">${options}</div>
      <div class="btn-row">
        <button class="btn btn-ghost" id="cancel-btn">Cancelar</button>
      </div>
    `);
    document.getElementById('cancel-btn').addEventListener('click', closeOverlay);
    overlay.querySelectorAll('.cat-option').forEach(btn => {
      btn.addEventListener('click', () => {
        pendingCategory = btn.dataset.cat;
        publishQuickReport();
      });
    });
  }

  async function publishQuickReport(){
    renderSheet(`
      <h2>Publicando…</h2>
      <div class="row-center"><div class="radar-sweep small"></div><span style="font-size:13px;color:var(--muted)">Enviando reporte rápido…</span></div>
    `);
    const id = `report_${Date.now()}_${Math.random().toString(36).slice(2,8)}`;
    const record = {
      lat: pendingLocation.lat, lng: pendingLocation.lng,
      photo: null, note: '', ts: Date.now(),
      category: pendingCategory || 'reten_fijo',
      confirms: 0, denies: 0, approx: true
    };
    try{
      await insertReport(id, record);
      const mine = getMine(); mine.add(id); saveMine(mine);
      upsertMarker(id, record);
      updateCount();
      closeOverlay();
      registerReportTime();
      showToast('Reporte rápido publicado. Gracias por avisar.');
    }catch(err){
      if(err instanceof NetworkError){
        enqueuePending(id, record);
        const mine = getMine(); mine.add(id); saveMine(mine);
        upsertMarker(id, record);
        updateCount();
        closeOverlay();
        registerReportTime();
        showToast('Sin conexión: se publicará cuando vuelvas a tener internet.', true);
        return;
      }
      renderSheet(`
        <h2>No se pudo publicar</h2>
        <div class="error-box">Hubo un problema guardando el reporte. Intenta de nuevo.</div>
        <div class="btn-row">
          <button class="btn btn-ghost" id="cancel-btn">Cerrar</button>
          <button class="btn btn-primary" id="retry-btn">Reintentar</button>
        </div>
      `);
      document.getElementById('cancel-btn').addEventListener('click', closeOverlay);
      document.getElementById('retry-btn').addEventListener('click', publishQuickReport);
    }
  }

  const PICK_ZOOM = 18;

  function startManualPick(){
    renderSheet(`
      <h2>Marca el lugar</h2>
      <p class="sub">Toca el punto exacto en el mapa donde está el agente.</p>
      <div class="btn-row">
        <button class="btn btn-ghost" id="cancel-btn">Cancelar</button>
      </div>
    `);
    document.getElementById('cancel-btn').addEventListener('click', closeOverlay);
    overlay.style.pointerEvents = 'none';
    overlay.style.background = 'transparent';
    overlay.querySelector('.sheet').style.pointerEvents = 'auto';
    map.getContainer().style.cursor = 'crosshair';
    if(map.getZoom() < PICK_ZOOM){
      map.flyTo(lastKnownLatLng || map.getCenter(), PICK_ZOOM, { duration: 0.5 });
    }
    manualPickHandler = (e) => {
      pendingLocation = { lat: e.latlng.lat, lng: e.latlng.lng };
      map.getContainer().style.cursor = '';
      map.off('click', manualPickHandler);
      manualPickHandler = null;
      overlay.style.pointerEvents = '';
      askForCategory();
    };
    map.on('click', manualPickHandler);
  }

  function askForCategory(){
    overlay.style.background = '';
    const options = Object.entries(CATEGORIES).map(([key, cat]) => `
      <button class="cat-option" data-cat="${key}">
        <span class="emoji">${cat.emoji}</span>
        <span>${cat.label}</span>
      </button>
    `).join('');
    renderSheet(`
      <h2>¿Qué estás reportando?</h2>
      <p class="sub">Elige la categoría que mejor describe la situación.</p>
      <div class="cat-grid">${options}</div>
      <div class="btn-row">
        <button class="btn btn-ghost" id="cancel-btn">Cancelar</button>
      </div>
    `);
    document.getElementById('cancel-btn').addEventListener('click', closeOverlay);
    overlay.querySelectorAll('.cat-option').forEach(btn => {
      btn.addEventListener('click', () => {
        pendingCategory = btn.dataset.cat;
        askForPhoto();
      });
    });
  }

  function askForPhoto(){
    renderSheet(`
      <h2>Foto obligatoria</h2>
      <p class="sub">Toma una foto en el lugar. Cada reporte necesita una imagen como comprobante.</p>
      <div class="btn-row">
        <button class="btn btn-ghost" id="cancel-btn">Cancelar</button>
        <button class="btn btn-primary" id="open-camera-btn">Abrir cámara</button>
      </div>
    `);
    document.getElementById('cancel-btn').addEventListener('click', closeOverlay);
    document.getElementById('open-camera-btn').addEventListener('click', () => cameraInput.click());
  }

  cameraInput.addEventListener('change', async (e) => {
    const file = e.target.files[0];
    cameraInput.value = '';
    if(!file) return;
    renderSheet(`
      <h2>Procesando foto</h2>
      <div class="row-center"><div class="radar-sweep small"></div><span style="font-size:13px;color:var(--muted)">Comprimiendo imagen…</span></div>
    `);
    try{
      pendingPhoto = await compressImage(file);
      askForConfirmation();
    }catch(err){
      renderSheet(`
        <h2>Error con la foto</h2>
        <div class="error-box">No se pudo procesar la imagen. Intenta de nuevo.</div>
        <div class="btn-row"><button class="btn btn-ghost" id="cancel-btn">Cerrar</button></div>
      `);
      document.getElementById('cancel-btn').addEventListener('click', closeOverlay);
    }
  });

  function compressImage(file){
    return new Promise((resolve, reject) => {
      const img = new Image();
      const reader = new FileReader();
      reader.onload = e => { img.src = e.target.result; };
      reader.onerror = reject;
      img.onload = () => {
        const maxW = 480;
        const scale = Math.min(1, maxW / img.width);
        const w = Math.round(img.width * scale);
        const h = Math.round(img.height * scale);
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.6));
      };
      img.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  function askForConfirmation(){
    const cat = CATEGORIES[pendingCategory] || CATEGORIES.reten_fijo;
    renderSheet(`
      <h2>Confirmar reporte</h2>
      <span class="cat-label" style="background:${cat.color}">${cat.emoji} ${cat.label}</span>
      <img class="preview-photo" src="${pendingPhoto}" alt="Vista previa" style="margin-top:8px;">
      <textarea id="note-input" rows="2" placeholder="Nota opcional (ej: sentido, esquina, hora pico)"></textarea>
      <div class="btn-row">
        <button class="btn btn-ghost" id="cancel-btn">Descartar</button>
        <button class="btn btn-primary" id="publish-btn">Publicar</button>
      </div>
    `);
    document.getElementById('cancel-btn').addEventListener('click', closeOverlay);
    document.getElementById('publish-btn').addEventListener('click', publishReport);
  }

  async function publishReport(){
    const publishBtn = document.getElementById('publish-btn');
    publishBtn.disabled = true;
    publishBtn.textContent = 'Publicando…';
    const note = document.getElementById('note-input').value.trim().slice(0, 140);
    const id = `report_${Date.now()}_${Math.random().toString(36).slice(2,8)}`;
    const record = {
      lat: pendingLocation.lat, lng: pendingLocation.lng,
      photo: pendingPhoto, note, ts: Date.now(),
      category: pendingCategory || 'reten_fijo',
      confirms: 0, denies: 0
    };
    try{
      await insertReport(id, record);
      const mine = getMine(); mine.add(id); saveMine(mine);
      upsertMarker(id, record);
      updateCount();
      map.setView([record.lat, record.lng], 15);
      closeOverlay();
      registerReportTime();
      showToast('Reporte publicado. Gracias por avisar.');
    }catch(err){
      if(err instanceof NetworkError){
        enqueuePending(id, record); // antes de upsertMarker, para que ya se vea "pending"
        const mine = getMine(); mine.add(id); saveMine(mine);
        upsertMarker(id, record);
        updateCount();
        map.setView([record.lat, record.lng], 15);
        closeOverlay();
        registerReportTime();
        showToast('Sin conexión: el reporte se publicará solo cuando vuelvas a tener internet.', true);
        return;
      }
      renderSheet(`
        <h2>No se pudo publicar</h2>
        <div class="error-box">Hubo un problema guardando el reporte. Intenta de nuevo.</div>
        <div class="btn-row">
          <button class="btn btn-ghost" id="cancel-btn">Cerrar</button>
          <button class="btn btn-primary" id="retry-btn">Reintentar</button>
        </div>
      `);
      document.getElementById('cancel-btn').addEventListener('click', closeOverlay);
      document.getElementById('retry-btn').addEventListener('click', publishReport);
    }
  }

  // ---- PWA: service worker (requiere servir por http/https, no file://) ----
  if('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')){
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
})();
</script>
</body>
</html>
