      locateBtn.removeAttribute('data-state');
    }
  });

  startLocationWatch();

  // ---- Flujo de reporte ----
  const overlay = document.getElementById('flow-overlay');
  const reportBtn = document.getElementById('report-btn');
  const cameraInput = document.getElementById('camera-input');

  function showToast(msg, warn){
    const t = document.createElement('div');
    const detailEl2 = document.getElementById('detail');
    const overlayEl2 = document.getElementById('flow-overlay');
    const hojaAbierta = (detailEl2 && !detailEl2.hidden) || (overlayEl2 && !overlayEl2.hidden);
    t.className = 'toast' + (warn ? ' warn' : '') + (hojaAbierta ? ' top' : '');
    t.textContent = msg;
    document.getElementById('app').appendChild(t);
    setTimeout(()=> t.remove(), 2600);
  }

  // dismissible:false para las hojas que están procesando algo (publicando,
  // comprimiendo la foto): ahí no hay nada que cancelar y cerrarlas dejaría
  // la operación corriendo por detrás con la UI ya cerrada.
  function renderSheet(html, opts){
    // Con una hoja abierta el cartel de estado vacío estorba: en el modo
    // "Marca el lugar" (donde el overlay deja pasar los toques al mapa) la
    // tarjeta se comía el toque justo en el centro de la pantalla, que es
    // donde uno naturalmente marca. En el resto de las hojas quedaría
    // tapado por el scrim igual.
    hideEmptyState();
    const dismissible = !opts || opts.dismissible !== false;
    overlay.innerHTML = `<div class="sheet">${html}</div>`;
    overlay.dataset.dismissible = dismissible ? 'true' : 'false';
    overlay.hidden = false;
  }

  // Tocar fuera de la hoja (sobre el mapa oscurecido) la cierra, igual que
  // el botón Cancelar. e.target === overlay significa que el toque cayó en
  // el fondo y no dentro de la hoja. En modo "Marca el lugar" el overlay
  // tiene pointer-events:none, así que el toque va al mapa y no llega acá
  // — que es justo lo que se quiere ahí.
  overlay.addEventListener('click', (e) => {
    if(e.target !== overlay) return;
    if(overlay.dataset.dismissible === 'false') return;
    closeOverlay();
  });
  function closeOverlay(){
    overlay.hidden = true;
    overlay.innerHTML = '';
    overlay.style.pointerEvents = '';
    overlay.classList.remove('picking');
    pendingLocation = null;
    pendingPhoto = null;
    pendingCategory = null;
    reportBtn.disabled = false;
    if(manualPickHandler){
      map.off('click', manualPickHandler);
      map.getContainer().style.cursor = '';
      manualPickHandler = null;
    }
    removePickMarker();
    // Reevaluar el estado vacío ahora que no hay una hoja tapando: mientras
    // el overlay está abierto se difiere (ver maybeShowEmptyState), y sin
    // esto habría que esperar hasta 8s al próximo sondeo para verlo.
    updateCount();
  }

  let manualPickHandler = null;
  let pickMarker = null;
  function removePickMarker(){
    if(pickMarker){ pickMarker.remove(); pickMarker = null; }
  }

  reportBtn.addEventListener('click', () => {
    if(!canReport()){
      showToast('Límite de reportes por hora alcanzado. Intenta más tarde.', true);
      return;
    }
    reportBtn.disabled = true;
    askReportMode();
  });

  function askReportMode(){
    renderSheet(`
      <h2>¿Cómo quieres reportar?</h2>
      <p class="sub">Elige la opción que mejor se ajuste al momento.</p>
      <div style="display:flex;flex-direction:column;gap:10px;margin-bottom:14px;">
        <button class="btn btn-primary" id="quick-btn" style="width:100%;">⚡ Reporte rápido — voy manejando</button>
        <button class="btn btn-ghost" id="detailed-btn" style="width:100%;">📸 Foto + marcar en el mapa</button>
      </div>
      <div class="btn-row">
        <button class="btn btn-ghost" id="cancel-btn">Cancelar</button>
      </div>
    `);
    document.getElementById('cancel-btn').addEventListener('click', closeOverlay);
    document.getElementById('quick-btn').addEventListener('click', startQuickReport);
    // La foto va PRIMERO: es lo urgente (el retén está ahí en ese momento y
    // hay que capturarlo ya). Marcar el lugar y elegir la categoría se
    // pueden hacer después, con el vehículo detenido y sin apuro.
    document.getElementById('detailed-btn').addEventListener('click', askForPhoto);
  }

  // ---- Reporte rápido: sin foto, ubicación aproximada a partir del GPS ----
  function startQuickReport(){
    if(!lastKnownLatLng){
      showToast('Buscando tu ubicación… intenta de nuevo en unos segundos.', true);
      closeOverlay();
      return;
    }
    pendingLocation = jitterLocation(lastKnownLatLng[0], lastKnownLatLng[1], 0, 30);
    askForCategoryQuick();
  }

  function askForCategoryQuick(){
    const options = Object.entries(CATEGORIES).map(([key, cat]) => `
      <button class="cat-option" data-cat="${key}" style="--cat-color:${cat.hex};--cat-tint:${hexTint(cat.hex, 0.14)}">
        <span class="emoji">${cat.emoji}</span>
        <span>${cat.label}</span>
      </button>
    `).join('');
    renderSheet(`
      <h2>¿Qué estás reportando?</h2>
      <p class="sub">Toca una categoría para publicar al instante. Sin foto: se marca una zona aproximada, no el punto exacto.</p>
      <div class="cat-grid">${options}</div>
      <div class="btn-row">
        <button class="btn btn-ghost" id="cancel-btn">Cancelar</button>
      </div>
    `);
    document.getElementById('cancel-btn').addEventListener('click', closeOverlay);
    overlay.querySelectorAll('.cat-option').forEach(btn => {
      btn.addEventListener('click', () => {
        pendingCategory = btn.dataset.cat;
        publishQuickReport();
      });
    });
  }

  async function publishQuickReport(){
    renderSheet(`
      <h2>Publicando…</h2>
      <div class="row-center"><div class="radar-sweep small"></div><span style="font-size:13px;color:var(--muted)">Enviando reporte rápido…</span></div>
    `, { dismissible: false });
    const id = `report_${Date.now()}_${Math.random().toString(36).slice(2,8)}`;
    const record = {
      lat: pendingLocation.lat, lng: pendingLocation.lng,
      photo: null, note: '', ts: Date.now(),
      category: pendingCategory || 'reten_fijo',
      confirms: 0, denies: 0, approx: true
    };
    await stampOwnership(id, record);
    try{
      await insertReport(id, record);
      const mine = getMine(); mine.add(id); saveMine(mine);
      upsertMarker(id, record);
      updateCount();
      closeOverlay();
      registerReportTime();
      showToast('Reporte rápido publicado. Gracias por avisar.');
    }catch(err){
      if(err instanceof NetworkError){
        enqueuePending(id, record);
        const mine = getMine(); mine.add(id); saveMine(mine);
        upsertMarker(id, record);
        updateCount();
        closeOverlay();
        registerReportTime();
        showToast('Sin conexión: se publicará cuando vuelvas a tener internet.', true);
        return;
      }
      // El reintento genera un id (y un token) nuevo, así que este queda
      // huérfano en localStorage si no se lo saca acá.
      dropToken(id);
      renderSheet(`
        <h2>No se pudo publicar</h2>
        <div class="error-box">Hubo un problema guardando el reporte. Intenta de nuevo.</div>
        <div class="btn-row">
          <button class="btn btn-ghost" id="cancel-btn">Cerrar</button>
          <button class="btn btn-primary" id="retry-btn">Reintentar</button>
        </div>
      `);
      document.getElementById('cancel-btn').addEventListener('click', closeOverlay);
      document.getElementById('retry-btn').addEventListener('click', publishQuickReport);
    }
  }

  const PICK_ZOOM = 18;

  function startManualPick(){
    // Arranca donde está el usuario (o en el centro del mapa si todavía no
    // hay GPS), no en un punto vacío: casi siempre el retén está cerca.
    // Si ya hay un punto elegido (el del GPS, o uno ajustado antes), el pin
    // arranca ahí: al venir de "Ajustar ubicación" sería raro que volviera
    // al GPS y perdiera la corrección.
    const inicio = pendingLocation
      ? { lng: pendingLocation.lng, lat: pendingLocation.lat }
      : (lastKnownLatLng
          ? { lng: lastKnownLatLng[1], lat: lastKnownLatLng[0] }
          : map.getCenter());

    renderSheet(`
      <h2>Ahora marca el lugar</h2>
      <p class="sub">Arrastra el pin al punto exacto, o toca el mapa para moverlo ahí.</p>
      <div class="btn-row">
        <button class="btn btn-ghost" id="cancel-btn">Cancelar</button>
        <button class="btn btn-primary" id="pick-confirm">Confirmar lugar</button>
      </div>
    `);
    document.getElementById('cancel-btn').addEventListener('click', closeOverlay);
    overlay.style.pointerEvents = 'none';
    overlay.classList.add('picking');
    overlay.querySelector('.sheet').style.pointerEvents = 'auto';
    if(map.getZoom() < zoomFromLeaflet(PICK_ZOOM)){
      // Ojo: la duración de flyTo en MapLibre va en milisegundos, en
      // Leaflet iba en segundos.
      map.flyTo({
        center: [inicio.lng, inicio.lat],
        zoom: zoomFromLeaflet(PICK_ZOOM),
        duration: 500
      });
    }

    // Pin arrastrable en vez de "acertá de un toque": antes había que
    // clavar el punto exacto con el dedo tapando justo el lugar que se
    // quería marcar, y no se podía corregir. `anchor:'bottom'` hace que la
    // punta del pin sea el punto real, así el dedo nunca lo tapa.
    removePickMarker();
    const el = document.createElement('div');
    el.className = 'pick-marker';
    el.innerHTML = `<div class="pick-inner"><svg viewBox="0 0 24 34" aria-hidden="true"><path d="M12 0C5.37 0 0 5.37 0 12c0 9 12 22 12 22s12-13 12-22c0-6.63-5.37-12-12-12z" fill="currentColor"/><circle cx="12" cy="12" r="4.6" fill="#fff"/></svg></div>`;
    pickMarker = new maplibregl.Marker({ element: el, draggable: true, anchor: 'bottom' })
      .setLngLat([inicio.lng, inicio.lat])
      .addTo(map);

    // Tocar el mapa también mueve el pin: para saltos grandes es más rápido
    // que arrastrarlo.
    manualPickHandler = (e) => { if(pickMarker) pickMarker.setLngLat(e.lngLat); };
    map.on('click', manualPickHandler);

    document.getElementById('pick-confirm').addEventListener('click', () => {
      if(!pickMarker) return;
      const ll = pickMarker.getLngLat();
      pendingLocation = { lat: ll.lat, lng: ll.lng };
      map.off('click', manualPickHandler);
      manualPickHandler = null;
      removePickMarker();
      overlay.style.pointerEvents = '';
      askForCategory();
    });
  }

  function askForCategory(){
    overlay.classList.remove('picking');
    const options = Object.entries(CATEGORIES).map(([key, cat]) => `
      <button class="cat-option" data-cat="${key}" style="--cat-color:${cat.hex};--cat-tint:${hexTint(cat.hex, 0.14)}">
        <span class="emoji">${cat.emoji}</span>
        <span>${cat.label}</span>
      </button>
    `).join('');
    renderSheet(`
      <h2>¿Qué estás reportando?</h2>
      <p class="sub">Elige la categoría que mejor describe la situación.</p>
      <div class="cat-grid">${options}</div>
      <button type="button" class="link-btn" id="adjust-loc">📍 Ajustar ubicación en el mapa</button>
      <div class="btn-row">
        <button class="btn btn-ghost" id="cancel-btn">Cancelar</button>
      </div>
    `);
    document.getElementById('cancel-btn').addEventListener('click', closeOverlay);
    // Escape hatch del atajo por GPS: si el punto automático no es exacto,
    // desde acá se abre el pin arrastrable. Al confirmarlo se vuelve a esta
    // misma hoja. Va solo en el flujo detallado: el rápido usa zona
    // aproximada a propósito (ver "Reporte rápido"), ahí no aplica.
    document.getElementById('adjust-loc').addEventListener('click', startManualPick);
    overlay.querySelectorAll('.cat-option').forEach(btn => {
      btn.addEventListener('click', () => {
        pendingCategory = btn.dataset.cat;
        // Último paso del flujo detallado: publica de una, sin pantalla de
        // confirmación (ver el historial de decisiones). La red de
        // seguridad si algo salió mal es el "Deshacer" del toast.
        publishReport();
      });
    });
  }

  function askForPhoto(){
    renderSheet(`
      <h2>Primero la foto</h2>
      <p class="sub">Sácala ahora que estás en el lugar. Después marcas el punto en el mapa y eliges la categoría.</p>
      <div class="btn-row">
        <button class="btn btn-ghost" id="cancel-btn">Cancelar</button>
        <button class="btn btn-primary" id="open-camera-btn">Abrir cámara</button>
      </div>
    `);
    document.getElementById('cancel-btn').addEventListener('click', closeOverlay);
    document.getElementById('open-camera-btn').addEventListener('click', () => cameraInput.click());
  }

  cameraInput.addEventListener('change', async (e) => {
    const file = e.target.files[0];
    cameraInput.value = '';
    if(!file) return;
    renderSheet(`
      <h2>Procesando foto</h2>
      <div class="row-center"><div class="radar-sweep small"></div><span style="font-size:13px;color:var(--muted)">Comprimiendo imagen…</span></div>
    `, { dismissible: false });
    try{
      pendingPhoto = await compressImage(file);
      // Con GPS disponible se usa esa ubicación y se salta el paso de
      // marcar: es lo rápido por defecto. El ajuste fino sigue disponible
      // desde el enlace "Ajustar ubicación" de la hoja de categoría.
      // Sin GPS no hay alternativa: hay que marcarlo a mano.
      if(lastKnownLatLng){
        pendingLocation = { lat: lastKnownLatLng[0], lng: lastKnownLatLng[1] };
        askForCategory();
      } else {
        startManualPick();
      }
    }catch(err){
      renderSheet(`
        <h2>Error con la foto</h2>
        <div class="error-box">No se pudo procesar la imagen. Intenta de nuevo.</div>
        <div class="btn-row"><button class="btn btn-ghost" id="cancel-btn">Cerrar</button></div>
      `);
      document.getElementById('cancel-btn').addEventListener('click', closeOverlay);
    }
  });

  function compressImage(file){
    return new Promise((resolve, reject) => {
      const img = new Image();
      const reader = new FileReader();
      reader.onload = e => { img.src = e.target.result; };
      reader.onerror = reject;
      img.onload = () => {
        const maxW = 480;
        const scale = Math.min(1, maxW / img.width);
        const w = Math.round(img.width * scale);
        const h = Math.round(img.height * scale);
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.6));
      };
      img.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  // Toast con acción "Deshacer". Como el reporte se publica apenas se saca
  // la foto, sin pantalla de confirmación, esta es la única oportunidad de
  // arrepentirse si la foto salió movida o del piso. Dura más que un toast
  // normal (2.6s) porque acá hay que darle tiempo real a reaccionar.
  const UNDO_MS = 6000;
  function showUndoToast(id){
    const t = document.createElement('div');
    t.className = 'toast toast-action';
    t.innerHTML = `<span>Reporte publicado</span><button type="button" class="toast-btn">Deshacer</button>`;
    document.getElementById('app').appendChild(t);
    const quitar = () => t.remove();
    const timer = setTimeout(quitar, UNDO_MS);
    t.querySelector('.toast-btn').addEventListener('click', async () => {
      clearTimeout(timer);
      quitar();
      removeMarker(id);
      delete reportsCache[id];
      const mine = getMine(); mine.delete(id); saveMine(mine);
      // El intento no debería gastarle un cupo del anti-spam a alguien que
      // solo quiere repetir la foto.
      unregisterLastReportTime();
      updateCount();
      const ok = await deleteReportRemote(id);
      showToast(ok ? 'Reporte deshecho' : 'No se pudo deshacer el reporte.', !ok);
    });
  }

  async function publishReport(){
    renderSheet(`
      <h2>Publicando…</h2>
      <div class="row-center"><div class="radar-sweep small"></div><span style="font-size:13px;color:var(--muted)">Enviando reporte…</span></div>
    `, { dismissible: false });
    // Sin pantalla de confirmación ya no hay dónde escribir una nota: el
    // reporte detallado se apoya en la foto, que es lo que de verdad
    // comunica el retén.
    const note = '';
    const id = `report_${Date.now()}_${Math.random().toString(36).slice(2,8)}`;
    const record = {
      lat: pendingLocation.lat, lng: pendingLocation.lng,
      photo: pendingPhoto, note, ts: Date.now(),
      category: pendingCategory || 'reten_fijo',
      confirms: 0, denies: 0
    };
    // Sella la propiedad ANTES de cualquier envío: si se cae la red y el
    // record se va a la cola offline, el owner_hash tiene que viajar con él.
    await stampOwnership(id, record);
    try{
      record.photo = await uploadPhoto(id, record.photo);
      await insertReport(id, record);
      const mine = getMine(); mine.add(id); saveMine(mine);
      upsertMarker(id, record);
      updateCount();
      map.easeTo({ center: [record.lng, record.lat], zoom: zoomFromLeaflet(15), duration: 400 });
      closeOverlay();
      registerReportTime();
      showUndoToast(id);
    }catch(err){
      if(err instanceof NetworkError){
        // Si uploadPhoto falló antes de terminar, record.photo sigue
        // siendo el data: URL original — flushPendingQueue lo sube
        // recién cuando vuelva la red (ver ahí el chequeo por prefijo).
        enqueuePending(id, record); // antes de upsertMarker, para que ya se vea "pending"
        const mine = getMine(); mine.add(id); saveMine(mine);
        upsertMarker(id, record);
        updateCount();
        map.easeTo({ center: [record.lng, record.lat], zoom: zoomFromLeaflet(15), duration: 400 });
        closeOverlay();
        registerReportTime();
        showToast('Sin conexión: el reporte se publicará solo cuando vuelvas a tener internet.', true);
        return;
      }
      // El reintento genera un id (y un token) nuevo, así que este queda
      // huérfano en localStorage si no se lo saca acá.
      dropToken(id);
      renderSheet(`
        <h2>No se pudo publicar</h2>
        <div class="error-box">Hubo un problema guardando el reporte. Intenta de nuevo.</div>
        <div class="btn-row">
          <button class="btn btn-ghost" id="cancel-btn">Cerrar</button>
          <button class="btn btn-primary" id="retry-btn">Reintentar</button>
        </div>
      `);
      document.getElementById('cancel-btn').addEventListener('click', closeOverlay);
      document.getElementById('retry-btn').addEventListener('click', publishReport);
    }
  }

  // ---- Bienvenida, una sola vez ----
  // Al abrir la app por primera vez no había nada que explicara para qué
  // sirve: solo un mapa y dos botones. Va acá abajo del todo a propósito,
  // porque necesita `overlay`/`renderSheet`/`closeOverlay` ya definidos.
  const ONBOARDED_KEY = 'amet_onboarded_v1';
  function maybeShowWelcome(){
    let seen = false;
    try{ seen = !!localStorage.getItem(ONBOARDED_KEY); }catch(e){}
    if(seen) return;
    // Si viene de un link compartido (?r=), ese reporte es el contexto y no
    // hay que taparlo con la bienvenida.
    const deepLink = new URLSearchParams(location.search).get('r')
      || (location.hash.match(/r=([^&]+)/) || [])[1];
    if(deepLink) return;
    try{ localStorage.setItem(ONBOARDED_KEY, '1'); }catch(e){}
    renderSheet(`
      <h2>Bienvenido a AMET Radar</h2>
      <p class="sub">Reportes de retenes de tránsito en La Vega, hechos por la comunidad.</p>
      <ul class="welcome-list">
        <li><b>👀 Mira el mapa</b> — cada punto es un reporte activo de otra persona.</li>
        <li><b>📣 Reporta</b> — si ves un retén, avisa con un toque. Hay un modo rápido para cuando vas manejando.</li>
        <li><b>👍 Confirma</b> — toca un reporte para decir si sigue ahí o si ya no está.</li>
      </ul>
      <div class="btn-row">
        <button class="btn btn-primary" id="welcome-ok" style="width:100%;">Entendido</button>
      </div>
    `);
    document.getElementById('welcome-ok').addEventListener('click', closeOverlay);
  }
  maybeShowWelcome();

  // ---- PWA: service worker (requiere servir por http/https, no file://) ----
  if('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')){
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
})();
</script>
</body>
</html>
