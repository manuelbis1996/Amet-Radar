<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="Reportes comunitarios de retenes de tránsito en tiempo real en La Vega.">
<meta property="og:type" content="website">
<meta property="og:title" content="AMET Radar">
<meta property="og:description" content="Reportes comunitarios de retenes de tránsito en tiempo real en La Vega.">
<meta property="og:url" content="https://amet-radar.lavega.workers.dev/">
<meta property="og:image" content="https://amet-radar.lavega.workers.dev/icon-512.png">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="AMET Radar">
<meta name="twitter:description" content="Reportes comunitarios de retenes de tránsito en tiempo real en La Vega.">
<meta name="twitter:image" content="https://amet-radar.lavega.workers.dev/icon-512.png">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>AMET Radar</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /*
    Diseño: el mapa ES la app. Todo lo demás flota encima en superficies
    limpias, para no robarle alto a la pantalla en un teléfono — que es
    donde se va a usar casi siempre, muchas veces con una sola mano y de
    reojo mientras se maneja.

    Tema SIEMPRE CLARO, a pedido. Había un tema oscuro automático por
    prefers-color-scheme y se quitó: el mapa ya usaba tiles claros de día y
    de noche, así que de noche la interfaz quedaba oscura flotando sobre un
    mapa blanco — dos lenguajes distintos en la misma pantalla. Ahora hay
    uno solo. Si algún día vuelve el modo oscuro, tiene que volver junto con
    un estilo de mapa oscuro, no por separado.

    Reglas que se respetan en todo el archivo:
    - Ningún control primario mide menos de var(--tap) = 44px de alto.
    - Todo lo que flota respeta las safe areas (muesca y barra de gestos).
    - Un solo acento (--brand) para la acción principal; el resto del
      color lo aportan las categorías de reporte, nunca la decoración.
  */
  :root{
    /* Violeta, y NO ámbar como antes. El ámbar era exactamente el mismo
       #f59e0b de la categoría "retén fijo", así que el botón de Reportar y
       el marcador más común del mapa eran del mismo color: el acento de la
       acción competía con el dato. El violeta no se parece a ninguna de las
       cuatro categorías. */
    --brand:#7c3aed;   --on-brand:#ffffff;
    /* Variante clara para cuando el acento va como TEXTO sobre una
       superficie oscura — hoy solo los botones del toast, que se dibuja
       sobre var(--text). El violeta pleno ahí da 3.2:1 contra el fondo
       (por debajo del mínimo legible); este da 6.7:1. No usarla sobre
       blanco: al revés, no contrasta. */
    --brand-soft:#a78bfa;
    --bg:#e9ecef;
    --surface:#ffffff;
    --surface-2:#f2f4f7;
    --text:#15171c;
    --muted:#6b7280;
    --line:#e3e6ea;
    --danger:#d92d20;
    --info:#2563eb;
    --scrim:rgba(15,17,22,.45);
    --shadow-1:0 1px 2px rgba(16,18,25,.07), 0 4px 14px rgba(16,18,25,.11);
    --shadow-2:0 10px 34px rgba(16,18,25,.20);
    --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    --r-md:14px; --r-lg:20px; --r-xl:26px;
    --tap:44px;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{
    margin:0; padding:0; height:100%; background:var(--bg);
    font-family:var(--font); color:var(--text); overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  #app{ position:fixed; inset:0; }
  ::selection{ background:var(--brand); color:var(--on-brand); }
  button{ font-family:inherit; }

  /* ---- Mapa: capa base, ocupa todo ---- */
  #map{ position:absolute; inset:0; z-index:0; background:var(--bg); }
  .maplibregl-map{ background:var(--bg); font-family:var(--font); }
  .maplibregl-canvas{ outline:none; }
  /* Atribución de OpenStreetMap (la licencia ODbL de los datos la exige).
     Se la sube por encima de #fab-row y del safe-area para que no quede
     tapada por el botón de reportar, y con z-index por debajo de #fab-row
     (400) para no robarle toques a los controles principales. */
  .maplibregl-ctrl-bottom-right{
    bottom: calc(env(safe-area-inset-bottom, 0px) + 84px);
    z-index:390;
  }
  .maplibregl-ctrl-attrib{ font-size:10px; opacity:.72; border-radius:6px; }
  .maplibregl-ctrl-attrib a{ color:var(--muted); }

  #map-loader{
    position:absolute; inset:0; z-index:450; background:var(--bg);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px;
    font-size:13.5px; font-weight:500; color:var(--muted);
  }
  #map-loader[hidden]{ display:none; }

  .radar-sweep{
    width:40px; height:40px; border-radius:50%; flex-shrink:0;
    border:3px solid var(--line); border-top-color:var(--brand);
    animation: spin .9s linear infinite;
  }
  .radar-sweep.small{ width:22px; height:22px; border-width:2.5px; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* ---- Barra superior flotante ----
     El contenedor no intercepta toques (pointer-events:none) para que se
     pueda arrastrar el mapa por los huecos entre las píldoras; solo los
     controles reales reciben el toque. */
  #top{
    position:absolute; top:0; left:0; right:0; z-index:500;
    padding: calc(env(safe-area-inset-top, 0px) + 10px) 12px 0;
    display:flex; flex-direction:column; gap:9px;
    pointer-events:none;
  }
  .topbar{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .brand{
    pointer-events:auto;
    display:flex; align-items:center; gap:9px; min-height:var(--tap);
    background:var(--surface); border-radius:999px; padding:0 15px 0 11px;
    box-shadow:var(--shadow-1);
  }
  .brand-dot{
    width:9px; height:9px; border-radius:50%; background:var(--brand); flex-shrink:0;
    /* Halo derivado de --brand: quedó ámbar al pasar el acento a violeta
       (v16.0) y el punto se veía de otro color que su propio halo. */
    box-shadow:0 0 0 4px rgba(124,58,237,.18);
  }
  .brand-name{ font-size:15px; font-weight:700; letter-spacing:-.2px; white-space:nowrap; }
  .brand-count{
    display:inline-flex; align-items:center; gap:4px; margin-left:2px;
    padding-left:10px; border-left:1px solid var(--line);
    font-size:12px; color:var(--muted); white-space:nowrap;
  }
  .brand-count b{ font-size:14px; font-weight:700; color:var(--text); font-variant-numeric:tabular-nums; }

  .topbar-actions{ display:flex; align-items:center; gap:8px; }
  /* Estilo compartido por los botones de la topbar. Era #push-toggle-btn
     cuando la campana estaba sola; al sumarse el de compartir se generalizó
     a una clase para no duplicar la regla. Los selectores por id de abajo
     (data-state) se mantienen: son solo de la campana. */
  .topbar-btn{
    pointer-events:auto; flex-shrink:0; position:relative;
    width:var(--tap); height:var(--tap); border-radius:50%;
    background:var(--surface); border:none; color:var(--muted);
    box-shadow:var(--shadow-1);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; transition:transform .14s ease, color .14s ease;
  }
  .topbar-btn svg{ width:19px; height:19px; }
  .topbar-btn:active{ transform:scale(.9); }
  #push-toggle-btn[data-state="active"]{ color:var(--brand); }
  /* El encendido NO puede comunicarse solo por color: el ícono es el mismo en
     los dos estados, así que la única diferencia era un tinte violeta en algo
     de 19px. El punto agrega una diferencia de FORMA, que se ve igual sin
     distinguir bien los colores. Mismo recurso que el botón de filtros. */
  #push-toggle-btn[data-state="active"]::after{
    content:''; position:absolute; top:9px; right:9px;
    width:8px; height:8px; border-radius:50%;
    background:var(--brand); border:2px solid var(--surface);
  }
  #push-toggle-btn[data-state="loading"],
  #push-toggle-btn[data-state="checking"]{ opacity:.5; cursor:default; }
  #locate-btn[data-state="active"]{ color:var(--brand); }
  #push-toggle-btn[hidden]{ display:none; }

  /* ---- Pin FIJO para elegir el lugar del reporte ---- */
  /* No es un marcador de MapLibre: está clavado al centro de la pantalla y lo
     que se mueve es el mapa por debajo (patrón Uber/Google Maps). Por eso
     `pointer-events:none` — si interceptara toques, bloquearía justo el gesto
     de arrastrar el mapa, que es la única forma de mover el punto.
     La punta del pin cae EXACTAMENTE en el centro (translate -50%,-100%), que
     es lo que devuelve map.getCenter() al confirmar. */
  .pick-fijo{
    position:absolute; left:50%; top:50%;
    pointer-events:none; z-index:420;
  }
  .pick-fijo .pick-inner{
    position:absolute; left:0; top:0;
    transform:translate(-50%,-100%);
    color:var(--brand);
    filter: drop-shadow(0 5px 8px rgba(0,0,0,.4));
    animation: pick-drop .3s cubic-bezier(.2,.9,.3,1.2) both;
    transition: translate .18s ease;
  }
  .pick-fijo svg{ width:34px; height:47px; display:block; }
  /* Mientras el mapa se mueve, el pin se levanta y la sombra se achica: es la
     señal de que lo que se está moviendo es el mapa, no el pin. */
  .pick-fijo.moviendo .pick-inner{ translate:0 -7px; }
  .pick-sombra{
    position:absolute; left:0; top:0;
    width:12px; height:5px; margin:-2px 0 0 -6px;
    border-radius:50%; background:rgba(0,0,0,.34);
    transition: width .18s ease, opacity .18s ease;
  }
  .pick-fijo.moviendo .pick-sombra{ width:8px; margin-left:-4px; opacity:.5; }
  @keyframes pick-drop{ from{ opacity:0; transform:translate(-50%,-100%) translateY(-14px); } to{ opacity:1; } }

  /* ---- Marcadores ---- */
  .amet-pin{
    width:38px; height:38px; display:flex; align-items:center; justify-content:center;
    filter: drop-shadow(0 3px 6px rgba(0,0,0,.32));
  }
  .amet-pin .badge{
    width:36px; height:36px; border-radius:50%;
    border:3px solid var(--surface);
    display:flex; align-items:center; justify-content:center; font-size:16px;
  }
  .amet-pin.stale .badge{ filter:grayscale(1); opacity:.7; }
  .amet-pin.pending .badge{ opacity:.6; border-style:dashed; }
  /* Cámara sobre el marcador: distingue de un vistazo el reporte que tiene
     evidencia real del que es solo un aviso.

     Va con un SVG y NO con el emoji 📷: a 9px un emoji queda como una mancha
     borrosa y encima se dibuja distinto en cada sistema. Un trazo hereda el
     color, escala nítido y combina con los otros íconos de la app. El
     contenedor del marcador es position:relative para colgarla de la esquina. */
  .amet-pin .badge{ position:relative; }
  .pin-cam{
    position:absolute; right:-5px; bottom:-5px;
    width:17px; height:17px; border-radius:50%;
    background:var(--surface); color:var(--text);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 1px 4px rgba(0,0,0,.4);
  }
  .pin-cam svg{ width:10px; height:10px; display:block; }

  /* Contenedor común de los íconos que reemplazaron a los emojis. Se alinea
     con el texto y toma su color, que es justo lo que un emoji no hace. El
     tamaño por defecto sirve para botones y listas; el mapa lo pisa abajo. */
  .ico{ display:inline-flex; align-items:center; justify-content:center; vertical-align:-.22em; }
  .ico svg{ width:1.15em; height:1.15em; display:block; }
  /* Dentro del marcador el tamaño es fijo en píxeles, no relativo: el
     marcador no tiene un font-size del que colgarse y tiene que verse igual
     en el pin y en el núcleo del círculo de zona. */
  .ico-marcador svg{ width:19px; height:19px; }
  .approx-core .ico-marcador svg{ width:18px; height:18px; }
  /* En los chips de elegir categoría el ícono es el elemento principal. */
  .cat-option span.emoji .ico svg{ width:27px; height:27px; }

  /* Zona aproximada de un reporte rápido (approx:true). Antes era un
     L.circle de Leaflet (SVG con radio en metros); MapLibre no tiene un
     equivalente con radio en metros, así que es un div al que el JS le
     calcula el diámetro en píxeles según el zoom (ver sizeApproxCircle). */
  .amet-approx{
    border-radius:50%; box-sizing:border-box;
    border:2px dashed var(--approx-color, #f59e0b);
    background:var(--approx-fill, rgba(245,158,11,.18));
    position:relative;
  }
  .amet-approx.pending{ border-style:dotted; }
  /* Alejando el mapa el anillo dejaría de representar los 150 m reales, así
     que directamente no se dibuja: queda solo el núcleo. El elemento sigue
     ocupando el mínimo táctil, invisible, para que el marcador se pueda
     tocar igual. */
  .amet-approx.solo-nucleo{ border-color:transparent; background:transparent; }
  /* El núcleo del reporte de zona: MISMA insignia que el pin, con el emoji de
     la categoría, y de TAMAÑO FIJO en píxeles.

     Es lo que hace que el reporte se vea alejando el mapa. El círculo de
     alrededor mide 150 m reales, así que su tamaño en pantalla se desploma al
     alejar (a zoom 10 son ~4 px: invisible), y justo los reportes de un toque
     —que son la mayoría— desaparecían del mapa. El anillo sigue comunicando
     "está en algún punto de esta zona"; el núcleo comunica "acá hay algo". */
  .approx-core{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width:34px; height:34px; border-radius:50%;
    border:3px solid var(--surface);
    display:flex; align-items:center; justify-content:center;
    font-size:15px; line-height:1;
    box-shadow:0 2px 6px rgba(0,0,0,.3);
  }
  .amet-approx.pending .approx-core{ opacity:.6; border-style:dashed; }

  .me-marker{ width:22px; height:22px; }
  .me-dot{
    width:16px; height:16px; border-radius:50%; background:var(--info);
    border:3px solid #fff; box-shadow:0 0 0 4px rgba(37,99,235,.30);
    animation: me-pulse 2s ease-out infinite;
  }
  @keyframes me-pulse{
    0%{ box-shadow:0 0 0 4px rgba(37,99,235,.30); }
    70%{ box-shadow:0 0 0 13px rgba(37,99,235,0); }
    100%{ box-shadow:0 0 0 4px rgba(37,99,235,0); }
  }

  /* ---- Botones flotantes inferiores ---- */
  #fab-row{
    position:absolute; left:0; right:0; z-index:400;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 18px);
    display:flex; align-items:center; justify-content:center; gap:12px; padding:0 16px;
  }
  /* Los dos botones redondos del mapa comparten forma: centrar en mi
     ubicación y elegir un punto a mano. */
  #locate-btn, #pick-btn{
    width:52px; height:52px; border-radius:50%; flex-shrink:0; border:none;
    background:var(--surface); color:var(--text); box-shadow:var(--shadow-1);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; transition:transform .14s ease;
  }
  #locate-btn svg, #pick-btn svg{ width:21px; height:21px; }
  #locate-btn:active, #pick-btn:active{ transform:scale(.92); }
  /* La etiqueta pasó de "Reportar ubicación" a "Reportar aquí" al sumarse el
     botón de marcar en el mapa: con tres controles en la fila, la anterior se
     partía en dos líneas hasta en 390px. Y "aquí" ahora dice algo, porque hay
     un camino que NO es aquí. `nowrap` para que no vuelva a pasar. */
  #report-btn{
    min-height:56px; padding:0 22px; border:none; border-radius:999px;
    white-space:nowrap;
    background:var(--brand); color:var(--on-brand);
    font-size:15.5px; font-weight:700; letter-spacing:-.1px;
    display:flex; align-items:center; gap:9px;
    box-shadow:var(--shadow-2); cursor:pointer;
    transition:transform .14s ease;
  }
  #report-btn svg{ width:19px; height:19px; flex-shrink:0; }
  #report-btn:active{ transform:scale(.96); }
  #report-btn:disabled{ background:var(--surface-2); color:var(--muted); box-shadow:none; cursor:default; }

  /* ---- Hojas inferiores (detalle de reporte y flujo de publicación) ---- */
  #detail, #flow-overlay{
    position:absolute; inset:0; z-index:1000;
    display:flex; align-items:flex-end; justify-content:center;
    background:var(--scrim);
    -webkit-backdrop-filter:blur(2px); backdrop-filter:blur(2px);
  }
  #detail[hidden], #flow-overlay[hidden]{ display:none; }
  /* Mientras se elige el punto en el mapa ("Marca el lugar") el overlay
     tiene que dejar ver Y tocar el mapa: sin scrim ni desenfoque, solo la
     hoja de instrucciones abajo. */
  #flow-overlay.picking{ background:transparent; -webkit-backdrop-filter:none; backdrop-filter:none; }
  .detail-backdrop{ position:absolute; inset:0; }

  .sheet, .detail-panel{
    position:relative; background:var(--surface);
    width:100%; max-width:520px;
    border-radius:var(--r-xl) var(--r-xl) 0 0;
    padding:9px 18px calc(env(safe-area-inset-bottom, 0px) + 18px);
    max-height:86dvh; overflow-y:auto; -webkit-overflow-scrolling:touch;
    box-shadow:var(--shadow-2);
    animation: sheet-up .24s cubic-bezier(.22,1,.36,1);
  }
  @keyframes sheet-up{ from{ transform:translateY(18px); opacity:.5; } to{ transform:none; opacity:1; } }
  .grabber{ width:38px; height:4px; border-radius:999px; background:var(--line); margin:2px auto 14px; }

  .sheet h2{ font-size:19px; font-weight:700; letter-spacing:-.3px; margin:0 0 5px; }
  .sheet p.sub{ margin:0 0 16px; font-size:14px; color:var(--muted); line-height:1.45; }
  .row-center{ display:flex; align-items:center; gap:12px; }

  /* ---- Detalle del reporte ---- */
  .detail-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px; }
  .cat-label{
    display:inline-flex; align-items:center; gap:6px;
    padding:7px 13px; border-radius:999px;
    font-size:13px; font-weight:700; letter-spacing:-.1px;
  }
  .detail-close{
    width:36px; height:36px; flex-shrink:0; border:none; border-radius:50%;
    background:var(--surface-2); color:var(--muted);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .detail-close svg{ width:17px; height:17px; }
  .detail-photo{
    width:100%; display:block; margin-bottom:13px;
    border-radius:var(--r-md); aspect-ratio:4/3; object-fit:cover; background:var(--surface-2);
  }
  .detail-meta{ font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .detail-note{ font-size:15.5px; line-height:1.45; margin-top:7px; }

  .votes{ display:flex; gap:10px; margin-top:17px; }
  .vote-btn{
    flex:1; min-height:56px; border-radius:var(--r-md);
    border:1px solid var(--line); background:var(--surface-2); color:var(--text);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;
    font-size:12.5px; font-weight:600; cursor:pointer; transition:transform .12s ease;
  }
  .vote-btn b{ font-size:16px; font-weight:700; font-variant-numeric:tabular-nums; }
  .vote-btn:active{ transform:scale(.96); }
  /* Ya votaste: los dos botones quedan deshabilitados y el que elegiste se
     marca con el color de marca. Antes se veían idénticos hubieras votado o
     no, y solo te enterabas al tocarlos y recibir un "ya votaste" — el
     estado existía en localStorage pero era invisible en pantalla. */
  .vote-btn:disabled{ cursor:default; }
  .vote-btn:disabled:not(.chosen){ opacity:.42; }
  .vote-btn.chosen{ background:var(--surface); box-shadow: inset 0 0 0 2px var(--brand); }
  .vote-btn.chosen span{ color:var(--brand); font-weight:700; }
  .mini-actions{ display:flex; gap:10px; margin-top:10px; }
  .mini-btn{
    flex:1; min-height:var(--tap); border-radius:var(--r-md);
    border:1px solid var(--line); background:transparent; color:var(--muted);
    font-size:13.5px; font-weight:600; cursor:pointer; transition:transform .12s ease;
  }
  .mini-btn:active{ transform:scale(.97); }
  .mini-btn.danger{ color:var(--danger); border-color:rgba(217,45,32,.32); }
  /* Compartir es la palanca de crecimiento del proyecto (ver CLAUDE.md):
     se destaca con el color de marca en vez de verse igual que Eliminar. */
  .mini-btn.primary{
    background:var(--brand); color:var(--on-brand); border-color:transparent;
    display:inline-flex; align-items:center; justify-content:center; gap:7px;
  }
  .mini-btn.primary svg{ width:16px; height:16px; flex-shrink:0; }

  /* Denunciar una foto va como enlace discreto y no como botón: es una
     acción rara y destructiva para el reporte de otro, no algo que haya que
     invitar a tocar. Igual respeta el mínimo de 44px de alto táctil. */
  .link-btn{
    display:block; width:100%; min-height:var(--tap); margin-top:4px;
    background:none; border:0; color:var(--muted); font-size:12.5px;
    text-decoration:underline; cursor:pointer;
  }
  .link-btn:disabled{ text-decoration:none; opacity:.55; cursor:default; }

  /* ---- Estado vacío (ningún reporte en la zona visible) ---- */
  /* Sin esto el usuario ve un mapa mudo y no sabe si la app falló, si no
     cargó, o si de verdad no hay nada. Al lanzar en una ciudad nueva ese
     es literalmente el primer estado que ve todo el mundo. pointer-events
     en none para que el mapa se siga pudiendo arrastrar por debajo. */
  /* Píldora discreta debajo del header, NO una tarjeta en el medio del
     mapa: aun autoocultándose a los 7s, un cartel grande y centrado
     tapaba justo lo que el usuario vino a mirar y molestaba (reportado).
     Acá informa sin robar el centro de la pantalla ni el mapa. */
  #empty-state{
    position:absolute; left:0; right:0; z-index:300; pointer-events:none;
    top: calc(env(safe-area-inset-top, 0px) + 74px);
    display:flex; justify-content:center; padding:0 16px;
  }
  #empty-state[hidden]{ display:none; }
  /* La píldora sí recibe toques (el contenedor no), para poder cerrarla
     antes de que se vaya sola a los 7s. */
  .empty-card{
    pointer-events:auto; cursor:pointer;
    background:var(--surface); border-radius:999px;
    box-shadow:var(--shadow-1); padding:9px 16px;
    font-size:12.5px; font-weight:600; color:var(--muted);
    text-align:center; max-width:100%;
    animation: empty-in .28s ease both;
  }
  @keyframes empty-in{ from{ opacity:0; transform:translateY(-6px); } to{ opacity:1; transform:none; } }

  /* ---- Hoja de bienvenida (primera vez) ---- */
  .welcome-list{ list-style:none; margin:0 0 16px; padding:0; display:flex; flex-direction:column; gap:11px; }
  .welcome-list li{ font-size:13.5px; line-height:1.5; color:var(--muted); }
  .welcome-list b{ color:var(--text); font-weight:700; }
  /* Enlace de texto dentro de una hoja. Va como <button> y no como <a>
     porque no navega a ningún lado: abre otra hoja. */
  .sheet-link{
    display:block; width:100%; margin-top:14px; padding:6px 0;
    background:none; border:none; cursor:pointer;
    font:inherit; font-size:12.5px; color:var(--muted); text-decoration:underline;
    text-underline-offset:3px;
  }

  /* ---- Hoja "Acerca de" ---- */
  /* Hace tres trabajos en una sola pantalla: decir quién hizo la app y cómo
     escribirle, decir qué se guarda (la app pide GPS y notificaciones: no
     explicarlo es lo que hace que la gente los rechace) y dejar por escrito
     que los reportes son de la comunidad y no están verificados. */
  .about-sec{ margin-bottom:16px; }
  .about-sec:last-of-type{ margin-bottom:0; }
  .about-h{
    display:flex; align-items:center; gap:7px; margin:0 0 7px;
    font-size:12px; font-weight:700; letter-spacing:.4px; text-transform:uppercase;
    color:var(--text);
  }
  .about-h .ico{ width:15px; height:15px; color:var(--brand); flex-shrink:0; }
  .about-sec p{ margin:0; font-size:13px; line-height:1.55; color:var(--muted); }
  .about-sec p + p{ margin-top:7px; }
  .about-sec b{ color:var(--text); font-weight:600; }
  /* La lista de privacidad: lo que SÍ y lo que NO, que es la parte que
     construye confianza. El guion va como pseudo-elemento para que copiar el
     texto no se lo lleve. */
  .about-list{ list-style:none; margin:7px 0 0; padding:0; display:flex; flex-direction:column; gap:5px; }
  .about-list li{ position:relative; padding-left:14px; font-size:12.5px; line-height:1.5; color:var(--muted); }
  .about-list li::before{ content:'·'; position:absolute; left:4px; color:var(--brand); font-weight:700; }
  /* Aviso: no es un error, así que no va en rojo; es el tono de "leelo una
     vez". El borde de la izquierda alcanza para separarlo del resto. */
  .about-nota{
    border-left:3px solid var(--brand); padding:2px 0 2px 11px;
  }
  .about-contacto{
    display:flex; flex-direction:column; gap:8px; margin-top:10px;
  }
  .about-contacto a{
    display:flex; align-items:center; gap:9px; min-height:var(--tap);
    padding:0 13px; border-radius:12px;
    background:var(--surface-2); color:var(--text); text-decoration:none;
    font-size:13.5px; font-weight:600; word-break:break-all;
  }
  .about-contacto a .ico{ width:17px; height:17px; color:var(--brand); flex-shrink:0; }
  .about-ver{ margin-top:14px; text-align:center; font-size:11.5px; color:var(--muted); }

  /* ---- Flujo de publicación ---- */
  .cat-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px; }
  /* Cada opción lleva el color de su categoría: el mismo que ya usa en el
     marcador del mapa, en el chip de filtro y en la etiqueta del detalle.
     Antes las 4 eran cajas grises idénticas — el usuario aprendía los
     colores en el mapa y al reportar no tenía ninguna pista visual, justo
     en el momento en que más apura (a veces manejando). */
  .cat-option{
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:7px;
    min-height:96px; background:var(--cat-tint, var(--surface-2));
    border:1.5px solid var(--cat-color, var(--line));
    border-radius:var(--r-lg); padding:14px 8px; cursor:pointer;
    color:var(--text); font-size:13.5px; font-weight:600; text-align:center;
    transition:transform .12s ease;
  }
  .cat-option span.emoji{ display:flex; color:var(--cat-color, var(--text)); }
  .cat-option:active{ transform:scale(.96); }
  .link-btn{
    display:block; width:100%; margin-top:10px; padding:10px;
    border:none; background:transparent; color:var(--muted);
    font:inherit; font-size:13px; font-weight:600; cursor:pointer;
    text-decoration:underline; text-underline-offset:3px;
  }
  .link-btn:active{ opacity:.55; }

  textarea{
    width:100%; background:var(--surface-2); border:1px solid var(--line);
    border-radius:var(--r-md); color:var(--text); padding:13px;
    font-family:var(--font); font-size:15px; resize:none; margin-bottom:14px;
  }
  textarea::placeholder{ color:var(--muted); }
  textarea:focus{ outline:2px solid var(--brand); outline-offset:-1px; }

  .btn-row{ display:flex; gap:10px; }
  .btn{
    flex:1; min-height:52px; border:none; border-radius:var(--r-md);
    font-family:var(--font); font-size:15px; font-weight:700; letter-spacing:-.1px;
    cursor:pointer; transition:transform .14s ease;
  }
  .btn-primary{ background:var(--brand); color:var(--on-brand); }
  .btn-ghost{ background:var(--surface-2); color:var(--text); border:1px solid var(--line); }
  .btn:active{ transform:scale(.97); }
  .btn:disabled{ opacity:.45; cursor:default; }

  .error-box{
    background:rgba(217,45,32,.10); border:1px solid rgba(217,45,32,.35); color:var(--danger);
    padding:12px 13px; border-radius:var(--r-md); font-size:13.5px; margin-bottom:14px; line-height:1.4;
  }

  /* ---- Toast: abajo, cerca del pulgar ---- */
  .toast{
    position:absolute; left:50%; transform:translateX(-50%);
    bottom: calc(env(safe-area-inset-bottom, 0px) + 88px);
    background:var(--text); color:var(--surface);
    padding:12px 20px; border-radius:999px;
    font-size:13.5px; font-weight:600; text-align:center; max-width:86%;
    box-shadow:var(--shadow-2); z-index:1100;
    animation: toast-in .22s ease;
  }
  .toast.warn{ background:var(--danger); color:#fff; }
  /* Con dos acciones (Foto y Deshacer) el ancho quedaba justo: el texto
     empujaba a los botones y se veía apretado en pantallas de 390px. El texto
     pasa a ser el que cede (flex:1 + min-width:0) y los botones nunca se
     encogen; el gap baja de 12 a 8 y el toast puede usar un poco más de ancho
     que uno normal. */
  .toast-action{
    display:flex; align-items:center; gap:8px;
    padding:8px 10px 8px 16px; max-width:94%;
    /* `width:max-content` NO es decorativo. El toast es position:absolute con
       left:50%, así que el ancho disponible para el "shrink-to-fit" es solo lo
       que queda a la derecha del 50% — la mitad de la pantalla. Con dos
       acciones eso alcanzaba para que "Reporte publicado" se partiera en dos
       líneas y el aviso quedara alto y torcido. Con max-content el ancho lo
       decide el contenido y max-width sigue poniendo el techo. */
    width:max-content;
  }
  .toast-action > span{ flex:0 1 auto; text-align:left; }
  .toast-btn{
    flex:0 0 auto;
    border:none; background:transparent; color:var(--brand-soft);
    font:inherit; font-size:13.5px; font-weight:700; cursor:pointer;
    padding:8px 11px; border-radius:999px; white-space:nowrap;
  }
  .toast-btn:active{ opacity:.6; }
  /* El de la foto lleva el mismo ícono que el marcador, no el emoji: así se
     lee como la misma acción en los dos lados. */
  .toast-btn.con-icono{ display:inline-flex; align-items:center; gap:5px; }
  .toast-btn.con-icono svg{ width:15px; height:15px; flex-shrink:0; }
  /* Con una hoja abierta, el toast en su posición normal cae justo encima
     del contenido de la hoja — al votar tapaba los propios botones de
     votar, que es exactamente lo que acababa de cambiar. En ese caso se
     muestra arriba, despejado. */
  .toast.top{
    bottom:auto; top: calc(env(safe-area-inset-top, 0px) + 92px);
    animation: toast-in-top .22s ease;
  }
  @keyframes toast-in{ from{ opacity:0; transform:translate(-50%, 8px); } to{ opacity:1; transform:translate(-50%, 0); } }
  @keyframes toast-in-top{ from{ opacity:0; transform:translate(-50%, -8px); } to{ opacity:1; transform:translate(-50%, 0); } }

  #camera-input{ display:none; }

  /* Pantallas muy angostas: que el botón principal no empuje al de ubicación */
  @media (max-width: 359px){
    #report-btn{ padding:0 18px; font-size:14.5px; }
    .brand-count{ display:none; }
  }

  @media (prefers-reduced-motion: reduce){
    .me-dot, .toast, .radar-sweep, .sheet, .detail-panel, .empty-card{ animation:none; }
    *{ transition:none !important; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="map">
    <!-- Ya no dice "Buscando tu ubicación": desde v17.0 el loader se va con
         el mapa, no con el GPS, así que prometer eso sería mentir. -->
    <div id="map-loader"><div class="radar-sweep"></div><span>Cargando el mapa…</span></div>
  </div>

  <div id="empty-state" hidden>
    <div class="empty-card"><i class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 3L5 21"/><path d="M15.5 3L19 21"/><path d="M12 4.5v2.8"/><path d="M12 11v2.8"/><path d="M12 17.5v2.8"/></svg></i> Todo tranquilo por aquí</div>
  </div>

  <div id="top">
    <div class="topbar">
      <div class="brand">
        <span class="brand-dot"></span>
        <span class="brand-name">AMET Radar</span>
        <span class="brand-count"><b id="stat-count">0</b>en vista</span>
      </div>
      <div class="topbar-actions">
        <button id="share-app-btn" class="topbar-btn" aria-label="Compartir AMET Radar" title="Compartir AMET Radar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.59 13.51l6.83 3.98M15.41 6.51L8.59 10.49"/></svg>
        </button>
        <button id="about-btn" class="topbar-btn" aria-label="Acerca de AMET Radar" title="Acerca de AMET Radar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11.4v4.8"/><path d="M12 8h.01"/></svg>
        </button>
        <button id="push-toggle-btn" class="topbar-btn" data-state="inactive" aria-label="Avisarme de retenes cerca" title="Avisarme de retenes cerca" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        </button>
      </div>
    </div>
  </div>

  <div id="fab-row">
    <button id="locate-btn" aria-label="Centrar mapa en mi ubicación" title="Centrar en mi ubicación">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>
    </button>
    <button id="pick-btn" aria-label="Reportar en otro punto del mapa" title="Reportar en otro punto del mapa">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21.2s7-6.3 7-11.2a7 7 0 1 0-14 0c0 4.9 7 11.2 7 11.2z"/><circle cx="12" cy="10" r="2.6"/></svg>
    </button>
    <button id="report-btn" aria-label="Reportar ubicación de un retén">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M12 3 2 20h20L12 3z"/><path d="M12 10v4"/><circle cx="12" cy="17" r="0.6" fill="currentColor" stroke="none"/></svg>
      <span>Reportar aquí</span>
    </button>
  </div>

  <input type="file" id="camera-input" accept="image/*" capture="environment">

  <!-- Detalle de un reporte: hoja inferior en vez del popup del mapa.
       En un teléfono un globito de ~216px es incómodo (foto chica, botones
       apretados); la hoja da lugar real y queda al alcance del pulgar. -->
  <div id="detail" hidden>
    <div class="detail-backdrop"></div>
    <div class="detail-panel"></div>
  </div>

  <div id="flow-overlay" hidden></div>
</div>

<script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<script>
(function(){
  // Debe coincidir a mano con el sufijo de CACHE_NAME en sw.js (ver
  // CLAUDE.md): al subir uno, subir el otro. Se muestra en el header para
  // poder confirmar a simple vista que una PWA instalada ya tomó la
  // versión nueva del service worker, sin tener que abrir devtools.
  const APP_VERSION = 'v17.9';
  // [lat, lng] — ojo que el orden es al revés del que usa MapLibre.
  // Es solo el punto de arranque mientras no hay señal de GPS: apenas
  // llega el primer fix, el mapa se centra en el usuario (ver firstFix).
  const DEFAULT_CENTER = [19.2214, -70.5295]; // La Vega
  // Caja que cubre República Dominicana entera (de la frontera con Haití
  // hasta Punta Cana, y de la costa sur a la norte) con algo de margen.
  // El mapa no deja arrastrar fuera de acá: la app es solo para RD, y así
  // nadie termina perdido en el Atlántico sin entender qué pasó.
  const RD_BOUNDS = [[-72.10, 17.30], [-68.20, 20.10]]; // [[oeste,sur],[este,norte]]
  const APPROX_RADIUS_METERS = 150; // radio del círculo de zona aproximada (reporte rápido)

  // Parámetros del sistema: valores por defecto, sobreescritos al arrancar
  // por la fila única de public.app_config en Supabase (editable desde el
  // panel admin en admin.html). Se leen en tiempo de ejecución, no se
  // capturan, así que ajustar CONFIG acá adentro alcanza para que todo el
  // código de abajo los use.
  const CONFIG = {
    staleMinutes: 180,    // a partir de aqui se consideran "viejos"
    maxAgeMinutes: 360,   // se ocultan/borran pasado este tiempo
    denyThreshold: 2,     // (negaciones - confirmaciones) para retirar antes
    reportLimit: 3,       // reportes máximos por ventana
    reportWindowMin: 60
  };

  // hex: color plano de la categoría — se usa igual en tema claro y oscuro
  // (el marcador y el círculo de zona lo aplican inline, necesitan un
  // color literal, no var()).
  // ink: color de texto legible ENCIMA de ese hex, para los chips activos
  // y la etiqueta de categoría; elegido para que el contraste aguante en
  // ambos temas sin tener dos paletas de categorías.
  const CATEGORIES = {
    // `icon` es la clave dentro de ICO y es lo que se dibuja en la interfaz.
    // `emoji` NO se borra: lo siguen usando el texto de compartir por WhatsApp
    // y el de las notificaciones push, donde no se puede meter un SVG.
    reten_fijo:  { label:'Retén fijo',      emoji:'👮', icon:'reten_fijo',  hex:'#f59e0b', ink:'#1b1206' },
    reten_movil: { label:'Retén móvil',     emoji:'🚓', icon:'reten_movil', hex:'#0f766e', ink:'#ffffff' },
    accidente:   { label:'Accidente',       emoji:'⚠️', icon:'accidente',   hex:'#d92d20', ink:'#ffffff' },
    control:     { label:'Control tránsito',emoji:'🚦', icon:'control',     hex:'#2563eb', ink:'#ffffff' }
  };
  const activeCategories = new Set(Object.keys(CATEGORIES));

  // La versión ya no se muestra fija en el header: al usuario final no le
  // dice nada. Sigue siendo consultable manteniendo presionado el logo, que
  // es como se confirma a simple vista (sin devtools) que una PWA instalada
  // ya tomó la versión nueva.
  (function enableVersionPeek(){
    const brand = document.querySelector('.brand');
    if(!brand) return;
    let timer = null;
    const cancel = () => { if(timer){ clearTimeout(timer); timer = null; } };
    brand.addEventListener('pointerdown', () => {
      cancel();
      timer = setTimeout(() => showToast(`AMET Radar ${APP_VERSION}`), 600);
    });
    ['pointerup','pointerleave','pointercancel'].forEach(ev => brand.addEventListener(ev, cancel));
  })();

  // ---- Backend compartido (Supabase) ----
  // Los reportes viven en la tabla `reports` de un proyecto Supabase (no en
  // localStorage ni en un archivo del servidor), así que cualquier
  // dispositivo que entre a esta app ve los mismos reportes sin depender de
  // que una PC en particular esté prendida. La SUPABASE_ANON_KEY es una
  // publishable key: está pensada para vivir en el cliente, el control de
  // acceso real lo hacen las políticas RLS de la tabla. reportsCache es la
  // copia en memoria del cliente, refrescada al cargar y luego por sondeo
  // periódico (ver refreshReports).
  const SUPABASE_URL = 'https://nikexwjxxcxzhsuypsjn.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_p8U6gvvBwPVHdfmspjyCXA_g6clP58v';
  const REPORTS_URL = `${SUPABASE_URL}/rest/v1/reports`;
  const CONFIG_URL = `${SUPABASE_URL}/rest/v1/app_config`;
  const PHOTOS_BUCKET_URL = `${SUPABASE_URL}/storage/v1/object/report-photos`;
  const PHOTOS_PUBLIC_URL = `${SUPABASE_URL}/storage/v1/object/public/report-photos`;
  // Las operaciones destructivas (borrar, votar) ya no van por REST directo:
  // pasan por funciones de Postgres con reglas adentro, porque la anon key es
  // pública y con RLS abierta cualquiera podía vaciar la tabla. Ver la
  // migración 20260801120000_lock_down_writes.sql.
  const RPC_URL = `${SUPABASE_URL}/rest/v1/rpc`;
  // Adjuntar una foto tampoco va directo a Storage: el bucket no tiene
  // ninguna política (v14.1) y NO se reabrió al volver las fotos. La subida
  // pasa por este Edge Function, que valida la propiedad con el token y
  // escribe con la service_role key. Ver "Fotos opcionales" en CLAUDE.md.
  const ATTACH_PHOTO_URL = `${SUPABASE_URL}/functions/v1/attach-photo`;
  const SUPABASE_HEADERS = {
    'apikey': SUPABASE_ANON_KEY,
    'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
    'Content-Type': 'application/json'
  };
  let reportsCache = {};

  // Fila única de public.app_config (editable desde admin.html); si el
  // fetch falla o la tabla está vacía, CONFIG se queda con los defaults.
  async function loadConfig(){
    try{
      const res = await fetch(`${CONFIG_URL}?select=*&limit=1`, { headers: SUPABASE_HEADERS });
      if(res.ok){
        const rows = await res.json();
        const row = rows[0];
        if(row){
          CONFIG.staleMinutes = row.stale_minutes;
          CONFIG.maxAgeMinutes = row.max_age_minutes;
          CONFIG.denyThreshold = row.deny_threshold;
          CONFIG.reportLimit = row.report_limit;
          CONFIG.reportWindowMin = row.report_window_min;
        }
      }
    }catch(e){ console.error('Error cargando config', e); }
  }

  // ---- Notificaciones push por cercanía ----
  // Avisa (aunque la app esté cerrada) cuando alguien publica un reporte
  // nuevo cerca de la última posición conocida de este dispositivo. La
  // suscripción vive en la tabla push_subscriptions de Supabase; el envío
  // real lo hace el Edge Function notify-nearby, disparado por un trigger
  // en cada INSERT sobre reports (ver CLAUDE.md).
  const VAPID_PUBLIC_KEY = 'BOg_VDCTXvRF0l9cLLFI_sGgWGkiyVb3SmIu93c8bcFatvEcxzSPfqUwvAfaO6X8nMdVH596vW0pIAdhaHe5nKY';
  // Ya no hay URL de la tabla: alta, baja y actualización de posición pasan
  // por rpc/subscribe_push, rpc/unsubscribe_push y rpc/update_push_position.
  // La tabla no acepta escritura directa desde v14.2.
  const PUSH_ENDPOINT_KEY = 'amet_push_endpoint_v1';
  const PUSH_POS_UPDATE_MIN_METERS = 400;
  const PUSH_POS_UPDATE_MIN_MS = 5 * 60 * 1000;
  // Tope para esperar a que el service worker se active. NO es una
  // optimización: `navigator.serviceWorker.ready` no rechaza nunca — si el
  // service worker no llega a activarse (registro fallido, o la app servida
  // por http desde una IP de la red, donde ni se registra) la promesa queda
  // pendiente PARA SIEMPRE. Sin este tope, todo lo que la espere se cuelga en
  // silencio. Ver `esperarServiceWorker`.
  const PUSH_SW_TIMEOUT_MS = 8000;

  // Columnas explícitas, no `select=*`: esto se pide cada 8 segundos y trae
  // TODOS los reportes en cada sondeo, así que es de lejos lo que más egreso
  // consume del proyecto. `created_at` y `owner_hash` no los usa nadie del
  // lado del cliente (el primero se descartaba al recibirlo; la propiedad se
  // valida con el token de localStorage, el hash solo viaja al publicar) y
  // entre los dos eran ~125 de los ~408 bytes de cada fila. Si se agrega una
  // columna que el cliente necesite, hay que sumarla acá.
  const REPORT_FIELDS = 'id,lat,lng,photo,note,ts,category,confirms,denies,approx,photo_flags';

  // Margen sobre el área visible: se piden reportes un poco más allá del
  // borde para que ya estén dibujados justo antes de entrar en pantalla.
  // Es más grande que el 25% que usa renderVisibleMarkers a propósito —
  // así un paneo corto no dispara un fetch nuevo.
  const FETCH_PAD = 0.5;
  let lastFetchBox = null;

  function currentBox(pad){
    const b = map.getBounds();
    const padLat = (b.getNorth() - b.getSouth()) * pad;
    const padLng = (b.getEast() - b.getWest()) * pad;
    return {
      south: b.getSouth() - padLat, north: b.getNorth() + padLat,
      west:  b.getWest()  - padLng, east:  b.getEast()  + padLng
    };
  }

  function boxContains(fuera, dentro){
    return !!fuera && fuera.south <= dentro.south && fuera.north >= dentro.north
                   && fuera.west  <= dentro.west  && fuera.east  >= dentro.east;
  }

  // Un reporte suelto por id: lo necesitan los links compartidos y las
  // notificaciones push, porque ese reporte puede estar fuera del área que
  // se está mirando y entonces no vino en el sondeo.
  async function fetchReportById(id){
    try{
      const res = await fetch(
        `${REPORTS_URL}?id=eq.${encodeURIComponent(id)}&select=${REPORT_FIELDS}`,
        { headers: SUPABASE_HEADERS });
      if(!res.ok) return null;
      const rows = await res.json();
      if(!rows[0]) return null;
      const { id: _id, ...record } = rows[0];
      return record;
    }catch(e){ return null; }
  }

  async function fetchAllReports(){
    try{
      const box = currentBox(FETCH_PAD);
      const res = await fetch(
        `${REPORTS_URL}?select=${REPORT_FIELDS}` +
        `&lat=gte.${box.south}&lat=lte.${box.north}` +
        `&lng=gte.${box.west}&lng=lte.${box.east}`,
        { headers: SUPABASE_HEADERS });
      if(res.ok){
        const rows = await res.json();
        const next = {};
        for(const row of rows){
          const { id, ...record } = row;
          next[id] = record;
        }
        reportsCache = next;
        reportsLoadedOnce = true;
        lastFetchBox = box;
        lastFetchFailed = false;
      } else {
        // Esta rama NO HACÍA NADA hasta v17.0, ni siquiera loguear: si
        // Supabase respondía 500, reportsLoadedOnce quedaba en false y el
        // estado vacío ni siquiera llegaba a mostrarse. El usuario veía un
        // mapa mudo, indistinguible de "no hay retenes" — que es justamente
        // el estado normal del día 1.
        console.error('Error cargando reportes: HTTP', res.status);
        lastFetchFailed = true;
      }
    }catch(e){
      console.error('Error cargando reportes', e);
      lastFetchFailed = true;
    }
    return reportsCache;
  }

  class NetworkError extends Error {}

  // Sube la foto comprimida (data: URL de compressImage) a Supabase
  // Storage y devuelve la URL pública — reemplaza guardar el base64
  // completo en reports.photo (ver "Datos y escalabilidad" en
  // plan-mejora-amet-radar.md). El nombre del archivo es <id>.jpg, así
  // _delete_report() (en la base) puede borrar la foto por el mismo id.
  async function uploadPhoto(id, dataUrl){
    const blob = await (await fetch(dataUrl)).blob();
    let res;
    try{
      res = await fetch(`${PHOTOS_BUCKET_URL}/${id}.jpg`, {
        method: 'POST',
        headers: {
          'apikey': SUPABASE_ANON_KEY,
          'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
          'Content-Type': 'image/jpeg'
        },
        body: blob
      });
    }catch(e){
      throw new NetworkError('Sin conexión');
    }
    if(!res.ok) throw new Error('No se pudo subir la foto');
    return `${PHOTOS_PUBLIC_URL}/${id}.jpg`;
  }

  // La foto ya no se borra desde el cliente: lo hace _delete_report() del
  // lado de la base, junto con la fila. anon perdió el delete sobre el
  // bucket en la migración 20260801120000 — si no, cualquiera con la anon
  // key (que es pública) podía vaciar el bucket entero.

  // ---- Foto opcional, adjunta DESPUÉS de publicar --------------------------
  //
  // El orden es la decisión de diseño central, no un detalle: reportar es UN
  // toque y la gente lo hace manejando. Cualquier paso antes de publicar
  // retrasa el aviso a los demás justo cuando más urge, y encima empuja a
  // sacar una foto en movimiento. Publicando primero, el reporte ya sirve
  // desde el segundo cero y la foto se agrega cuando se puede — en el
  // semáforo, o parado dos cuadras después.
  //
  // Efecto lateral que vale la pena: `create_report` no se tocó (sigue
  // rechazando fotos) y el bucket sigue sin políticas. Ver CLAUDE.md.
  async function attachPhotoRemote(id, dataUrl){
    const token = getTokens()[id];
    // Sin token no hay forma de demostrar que es suyo. Pasa con los reportes
    // publicados antes de v12.0 y con los de otro dispositivo.
    if(!token) return { ok:false, reason:'no_token' };
    let res;
    try{
      res = await fetch(ATTACH_PHOTO_URL, {
        method: 'POST',
        headers: SUPABASE_HEADERS,
        body: JSON.stringify({ id, token, photo: dataUrl })
      });
    }catch(e){
      // A diferencia de publicar, esto NO se encola: la foto es opcional y
      // el reporte ya está publicado. Reintentarlo a mano es más simple que
      // arrastrar imágenes en localStorage esperando red.
      return { ok:false, reason:'network' };
    }
    let data = {};
    try{ data = await res.json(); }catch(e){}
    if(res.ok && data.ok) return { ok:true, photo: data.photo };
    return { ok:false, reason: data.reason || 'error' };
  }

  const PHOTO_FLAGS_KEY = 'amet_photo_flagged_v1';
  function getFlagged(){ try{ return new Set(JSON.parse(localStorage.getItem(PHOTO_FLAGS_KEY)||'[]')); }catch(e){ return new Set(); } }
  function saveFlagged(s){ try{ localStorage.setItem(PHOTO_FLAGS_KEY, JSON.stringify([...s])); }catch(e){} }

  // El servidor rechazó el reporte por una regla del anti-spam (no es un
  // problema de red). Se distingue de NetworkError porque acá NO hay que
  // encolar el reporte: reintentarlo más tarde daría exactamente el mismo
  // resultado.
  class ReportRejected extends Error {
    constructor(reason){ super(reason); this.reason = reason; }
  }

  const RECHAZO_MENSAJE = {
    duplicate:  'Ya hay un reporte de esto aquí cerca. Ábrelo y confírmalo en vez de publicar otro.',
    rate_limit: 'Demasiados reportes desde esta conexión. Intenta de nuevo más tarde.',
    invalid:    'No se pudo publicar el reporte.'
  };

  // Publicar ya NO es un POST directo a /rest/v1/reports: esa política de
  // insert se cerró (migración 20260803130000) porque con la anon key —que es
  // pública— cualquiera podía insertar en un bucle y llenar el mapa de pines
  // falsos, disparando de paso una notificación push por cada uno. Ahora pasa
  // por create_report, que aplica el dedupe por proximidad y el tope por IP
  // del lado del servidor. Ver "Anti-spam del lado del servidor" en CLAUDE.md.
  async function insertReport(id, record){
    let res;
    try{
      res = await fetch(`${RPC_URL}/create_report`, {
        method: 'POST',
        headers: SUPABASE_HEADERS,
        body: JSON.stringify({
          p_id: id,
          p_lat: record.lat,
          p_lng: record.lng,
          p_photo: record.photo || null,
          p_note: record.note || '',
          p_ts: record.ts,
          p_category: record.category,
          p_approx: !!record.approx,
          p_owner_hash: record.owner_hash || null
        })
      });
    }catch(e){
      // Igual que antes: solo la caída de red va a la cola offline.
      throw new NetworkError('Sin conexión');
    }
    if(!res.ok) throw new Error('No se pudo publicar el reporte');
    const out = JSON.parse((await res.text()) || 'null');
    // ok:true incluye reason:'already_exists' — el reintento de la cola manda
    // el MISMO id, y si el insert ya había entrado eso es un éxito, no un
    // error (si no, un reporte publicado se le mostraría al autor como fallo).
    if(!out || out.ok !== true) throw new ReportRejected((out && out.reason) || 'invalid');
    reportsCache[id] = record;
  }

  // El voto ya no es un PATCH con los totales calculados en el cliente (así,
  // cualquiera podía mandar confirms:99999): la RPC suma de a 1 y decide
  // ella misma si el reporte se retira por la comunidad. Devuelve
  // { confirms, denies, removed } — hay que obedecer eso, no recalcularlo.
  async function voteReport(id, dir){
    let out = null;
    try{
      const rows = await callRpc('vote_report', { p_id: id, p_dir: dir });
      out = Array.isArray(rows) ? rows[0] : rows;
    }catch(e){ console.error('Error votando', e); }
    if(!out) return null;
    if(out.removed){
      delete reportsCache[id];
      dropToken(id);
    } else if(reportsCache[id]){
      reportsCache[id].confirms = out.confirms;
      reportsCache[id].denies = out.denies;
    }
    return out;
  }

  // Borrar el propio reporte exige presentar el token guardado en este
  // dispositivo (la base solo tiene su hash). Devuelve false si el servidor
  // no lo aceptó — ahí el reporte sigue existiendo y no hay que sacarlo de
  // la vista, o volvería en el próximo sondeo de 8s como un fantasma.
  async function deleteReportRemote(id){
    const token = getTokens()[id];
    if(!token) return false;
    let ok = false;
    try{
      ok = await callRpc('delete_own_report', { p_id: id, p_token: token }) === true;
    }catch(e){ console.error('Error eliminando reporte', e); }
    if(ok){ delete reportsCache[id]; dropToken(id); }
    return ok;
  }

  // Limpieza de vencidos: antes el cliente mandaba un DELETE por cada
  // reporte viejo que veía (o sea, cualquiera podía borrar cualquier cosa).
  // Ahora se lo pide a la base, que solo borra lo que ya pasó
  // max_age_minutes. Throttleado: no tiene sentido pedirlo en cada
  // renderVisibleMarkers (se dispara en cada paneo del mapa).
  const PURGE_EVERY_MS = 10 * 60 * 1000;
  let lastPurge = 0;
  function purgeExpiredRemote(){
    const now = Date.now();
    if(now - lastPurge < PURGE_EVERY_MS) return;
    lastPurge = now;
    callRpc('purge_expired_reports').catch(e => console.error('Error limpiando vencidos', e));
  }

  // ---- Preferencias de este dispositivo (siguen siendo locales) ----
  const VOTED_KEY = 'amet_voted_v1';
  const MINE_KEY = 'amet_my_reports_v1';
  const TIMES_KEY = 'amet_report_times_v1';

  function getVoted(){ try{ return new Set(JSON.parse(localStorage.getItem(VOTED_KEY)||'[]')); }catch(e){ return new Set(); } }
  function saveVoted(set){ localStorage.setItem(VOTED_KEY, JSON.stringify([...set])); }
  // Además de "ya votó" (VOTED_KEY), se guarda EN QUÉ sentido, para poder
  // mostrarlo en la hoja de detalle. Clave aparte y no un cambio de formato
  // de VOTED_KEY, para no romper los votos ya guardados en los teléfonos
  // que vienen usando la app (esos quedan sin dirección conocida, y ahí
  // solo se deshabilitan los botones).
  const VOTE_DIR_KEY = 'amet_vote_dir_v1';

  // Token de propiedad por reporte. Sin cuentas de usuario, esta es la forma
  // de que el servidor pueda verificar quién puede borrar qué: el texto
  // plano vive solo en este dispositivo y la base guarda únicamente su hash
  // SHA-256, que no sirve para borrar. Antes "es mío" se validaba solo con
  // MINE_KEY del lado del cliente, o sea que no validaba nada.
  const TOKENS_KEY = 'amet_report_tokens_v1';
  function getTokens(){ try{ return JSON.parse(localStorage.getItem(TOKENS_KEY)||'{}'); }catch(e){ return {}; } }
  function saveToken(id, token){
    try{ const m = getTokens(); m[id] = token; localStorage.setItem(TOKENS_KEY, JSON.stringify(m)); }catch(e){}
  }
  function dropToken(id){
    try{ const m = getTokens(); delete m[id]; localStorage.setItem(TOKENS_KEY, JSON.stringify(m)); }catch(e){}
  }
  function newOwnerToken(){
    const b = new Uint8Array(16);
    crypto.getRandomValues(b);
    return [...b].map(x => x.toString(16).padStart(2,'0')).join('');
  }
  async function sha256Hex(text){
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
    return [...new Uint8Array(buf)].map(x => x.toString(16).padStart(2,'0')).join('');
  }
  // Devuelve el record con owner_hash puesto y deja el token guardado. Se
  // llama al crear el reporte, antes de encolarlo o publicarlo, para que el
  // hash viaje solo también por la cola offline.
  async function stampOwnership(id, record){
    const token = newOwnerToken();
    saveToken(id, token);
    record.owner_hash = await sha256Hex(token);
    return record;
  }
  async function callRpc(fn, args){
    const res = await fetch(`${RPC_URL}/${fn}`, {
      method: 'POST', headers: SUPABASE_HEADERS, body: JSON.stringify(args || {})
    });
    if(!res.ok) throw new Error(`RPC ${fn} falló (${res.status})`);
    const txt = await res.text();
    return txt ? JSON.parse(txt) : null;
  }
  function getVoteDirs(){ try{ return JSON.parse(localStorage.getItem(VOTE_DIR_KEY)||'{}'); }catch(e){ return {}; } }
  function saveVoteDir(id, dir){
    const m = getVoteDirs(); m[id] = dir;
    try{ localStorage.setItem(VOTE_DIR_KEY, JSON.stringify(m)); }catch(e){}
  }
  function getMine(){ try{ return new Set(JSON.parse(localStorage.getItem(MINE_KEY)||'[]')); }catch(e){ return new Set(); } }
  function saveMine(set){ localStorage.setItem(MINE_KEY, JSON.stringify([...set])); }

  // Freno local, para dar respuesta inmediata sin una ida y vuelta a la red.
  // YA NO ES LA DEFENSA: se resetea borrando los datos del sitio, y publicar
  // ni siquiera necesita pasar por acá (se puede llamar a la API a mano). El
  // límite que cuenta lo aplica create_report en el servidor — ver "Anti-spam
  // del lado del servidor" en CLAUDE.md. Esto queda como comodidad de UX.
  function canReport(){
    const times = JSON.parse(localStorage.getItem(TIMES_KEY)||'[]').filter(t => (Date.now()-t) < CONFIG.reportWindowMin*60000);
    localStorage.setItem(TIMES_KEY, JSON.stringify(times));
    return times.length < CONFIG.reportLimit;
  }
  function unregisterLastReportTime(){
    try{
      const times = JSON.parse(localStorage.getItem(TIMES_KEY)||'[]');
      times.pop();
      localStorage.setItem(TIMES_KEY, JSON.stringify(times));
    }catch(e){}
  }
  function registerReportTime(){
    const times = JSON.parse(localStorage.getItem(TIMES_KEY)||'[]');
    times.push(Date.now());
    localStorage.setItem(TIMES_KEY, JSON.stringify(times));
  }

  // Cola de reportes ya creados que no se pudieron enviar por falta de red
  // (distinto de pendingLocation/pendingPhoto/pendingCategory, que son el
  // estado del flujo de creación en curso). Persistida para sobrevivir un
  // reload; pendingIds es un derivado en memoria para lookups O(1).
  const PENDING_KEY = 'amet_pending_queue_v1';
  function getPendingQueue(){ try{ return JSON.parse(localStorage.getItem(PENDING_KEY)||'[]'); }catch(e){ return []; } }
  function savePendingQueue(list){ localStorage.setItem(PENDING_KEY, JSON.stringify(list)); }

  let pendingQueue = getPendingQueue();
  let pendingIds = new Set(pendingQueue.map(p => p.id));

  function enqueuePending(id, record){
    pendingQueue.push({ id, record });
    savePendingQueue(pendingQueue);
    pendingIds.add(id);
  }
  function dequeuePending(id){
    pendingQueue = pendingQueue.filter(p => p.id !== id);
    savePendingQueue(pendingQueue);
    pendingIds.delete(id);
  }

  // MapLibre GL usa tiles de 512px, Leaflet usaba de 256px — para la misma
  // escala visual el zoom de MapLibre es UNO MENOS que el de Leaflet. Todos
  // los números de zoom del archivo pasan por acá para que la conversión
  // quede en un solo lugar y no haya que acordarse del offset cada vez.
  const zoomFromLeaflet = z => z - 1;

  // El mapa en sí siempre usa un estilo claro, a pedido — el resto de la UI
  // (header, chips, hojas) sigue el tema automático del sistema, pero el
  // mapa se queda claro de día y de noche. 'bright' de OpenFreeMap: tiles
  // vectoriales de OpenStreetMap, gratis y sin API key, con calles,
  // nombres de lugares y comercios. Vectorial (en vez del raster de CartoDB
  // que había antes) = texto nítido en cualquier zoom.
  const map = new maplibregl.Map({
    container: 'map',
    style: 'https://tiles.openfreemap.org/styles/bright',
    center: [DEFAULT_CENTER[1], DEFAULT_CENTER[0]], // MapLibre usa [lng, lat]
    zoom: zoomFromLeaflet(13),
    maxZoom: zoomFromLeaflet(19),
    // La app es solo para República Dominicana: no tiene sentido dejar
    // arrastrar el mapa hasta Miami.
    maxBounds: RD_BOUNDS,
    // minZoom NO es cosmético, va de la mano de maxBounds: cuando el
    // viewport se hace más grande que la caja, MapLibre deja de respetar
    // el centro y lo clava en el medio de la caja — o sea, el mapa se te
    // escapa solo al centro del país (zona La Vega/Bonao) al alejar. Con 8
    // el alto de pantalla de un teléfono siempre entra dentro de RD, así
    // que eso no llega a pasar. Si algún día se agranda RD_BOUNDS o se baja
    // este número, revisar que el efecto no vuelva.
    minZoom: 8,
    // Sin controles de zoom: en un teléfono los botones +/- sobran (se hace
    // pinch) y ocupan una esquina que preferimos dejar al mapa. Y sin
    // rotación ni inclinación: el mapa siempre al norte y plano, como con
    // Leaflet — girarlo sin querer con dos dedos desorienta más de lo que
    // aporta en una app de reportes.
    attributionControl: false,
    dragRotate: false,
    pitchWithRotate: false,
    touchPitch: false
  });
  map.touchZoomRotate.disableRotation();

  // Atribución de OpenStreetMap: la licencia ODbL de los datos la exige.
  // Va como control aparte (y no con attributionControl:true de arriba)
  // para poder pedirla `compact`: así es un ⓘ chiquito que solo se
  // despliega al tocarlo, en vez de una línea de texto fija comiéndose
  // pantalla en un teléfono.
  map.addControl(new maplibregl.AttributionControl({ compact: true }), 'bottom-right');

  const markersById = {};
  let pendingLocation = null;
  let pendingPhoto = null;
  let pendingCategory = null;

  function timeAgo(ts){
    const min = Math.floor((Date.now()-ts)/60000);
    if(min < 1) return 'justo ahora';
    if(min < 60) return `hace ${min} min`;
    const h = Math.floor(min/60);
    if(h < 24) return `hace ${h} h`;
    return `hace ${Math.floor(h/24)} d`;
  }

  // Desplaza un punto una distancia aleatoria (entre minMeters y maxMeters)
  // en una dirección aleatoria. El reporte rápido la usa solo para variar
  // el centro del círculo de zona; la imprecisión real la da el radio
  // (APPROX_RADIUS_METERS) que se dibuja alrededor, no este desplazamiento.
  // Distancia real entre dos puntos (Haversine) — usada para decidir si
  // vale la pena reportar la nueva posición de la suscripción push, no
  // para nada relacionado al jitter de abajo.
  function distanceMeters(lat1, lng1, lat2, lng2){
    const R = 6371000;
    const toRad = d => d * Math.PI / 180;
    const dLat = toRad(lat2 - lat1);
    const dLng = toRad(lng2 - lng1);
    const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng/2)**2;
    return 2 * R * Math.asin(Math.sqrt(a));
  }

  function jitterLocation(lat, lng, minMeters, maxMeters){
    const angle = Math.random() * Math.PI * 2;
    const dist = minMeters + Math.random() * (maxMeters - minMeters);
    const dLat = (dist * Math.cos(angle)) / 111320;
    const dLng = (dist * Math.sin(angle)) / (111320 * Math.cos(lat * Math.PI / 180));
    return { lat: lat + dLat, lng: lng + dLng };
  }

  // MapLibre no tiene setIcon (un marcador ES un elemento del DOM), así que
  // en vez de fabricar un ícono nuevo se repinta el elemento existente.
  // `sig` evita reescribir el innerHTML en cada refresco de 8s cuando nada
  // cambió visualmente — sin eso, cada marcador parpadearía cada 8 segundos.
  // Ícono de cámara compartido por el pin y por el círculo de zona. Es un SVG
  // de trazo (mismo estilo que el resto de los íconos de la app) y no el emoji
  // 📷: a este tamaño un emoji queda borroso y cambia de dibujo según el
  // sistema.
  // ---- Set de íconos ----
  // Reemplazan a los emojis en TODA la interfaz. El argumento es el mismo que
  // ya justificaba CAM_SVG en v15.1 y acá se generaliza: un emoji se dibuja
  // distinto en cada sistema operativo (y en algunos Android viejos ni
  // aparece), no hereda el color, y a tamaño chico queda como una mancha.
  // Un trazo escala nítido, toma el color del contexto y hace que todo se vea
  // como una sola app en vez de un collage.
  //
  // OJO: los emojis NO desaparecen del proyecto, y no es un olvido. Siguen en
  // tres lugares donde el medio es TEXTO PLANO y un SVG es imposible: el
  // título de las notificaciones push (notify-nearby), el texto que se manda
  // al compartir por WhatsApp, y las meta tags del preview (_worker.js). Ahí
  // el emoji es justamente lo que hace que el mensaje se vea vivo.
  const TRAZO = 'fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"';
  const ICO = {
    // Escudo: es la forma que se lee como "autoridad" incluso a 20px, que es
    // el tamaño al que va dentro del marcador del mapa.
    reten_fijo:  '<path d="M12 2.6l7.4 2.7v5.5c0 4.6-3.1 8-7.4 10.2-4.3-2.2-7.4-5.6-7.4-10.2V5.3z"/>',
    reten_movil: '<path d="M3.5 16.5v-2.2l1.6-4A2 2 0 0 1 7 9h10a2 2 0 0 1 1.9 1.3l1.6 4v2.2z"/><path d="M6.5 9.2l.9-2.3A2 2 0 0 1 9.3 5.6h5.4a2 2 0 0 1 1.9 1.3l.9 2.3"/><circle cx="7.3" cy="18.4" r="1.5"/><circle cx="16.7" cy="18.4" r="1.5"/>',
    accidente:   '<path d="M12 3.4l9 15.6H3z"/><path d="M12 9.6v3.9"/><path d="M12 16.8h.01"/>',
    control:     '<path d="M4 7h2M4 12h2M18 7h2M18 12h2"/><rect x="7.5" y="2.6" width="9" height="18.8" rx="4"/><circle cx="12" cy="7.2" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="16.8" r="1.5"/>',
    pulgarArriba:'<path d="M7 21V10l4.5-8A2.5 2.5 0 0 1 14 4.6L13 9h5.6a2 2 0 0 1 2 2.5l-1.8 7A2 2 0 0 1 16.8 20H7z"/><path d="M7 10H3v11h4z"/>',
    pulgarAbajo: '<path d="M17 3v11l-4.5 8A2.5 2.5 0 0 1 10 19.4L11 15H5.4a2 2 0 0 1-2-2.5l1.8-7A2 2 0 0 1 7.2 4H17z"/><path d="M17 14h4V3h-4z"/>',
    ojo:         '<path d="M2 12s3.6-6.6 10-6.6S22 12 22 12s-3.6 6.6-10 6.6S2 12 2 12z"/><circle cx="12" cy="12" r="2.8"/>',
    megafono:    '<path d="M3.5 10.5v3a1.4 1.4 0 0 0 1.4 1.4h1.9l5.2 4.2V4.9L6.8 9.1H4.9a1.4 1.4 0 0 0-1.4 1.4z"/><path d="M16.5 8.6a4.6 4.6 0 0 1 0 6.8"/><path d="M19.4 6a8.4 8.4 0 0 1 0 12"/>',
    campana:     '<path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>',
    pin:         '<path d="M12 21.2s7-6.3 7-11.2a7 7 0 1 0-14 0c0 4.9 7 11.2 7 11.2z"/><circle cx="12" cy="10" r="2.6"/>',
    ruta:        '<path d="M8.5 3L5 21"/><path d="M15.5 3L19 21"/><path d="M12 4.5v2.8"/><path d="M12 11v2.8"/><path d="M12 17.5v2.8"/>',
    alerta:      '<circle cx="12" cy="12" r="9"/><path d="M12 7.6v5"/><path d="M12 16.2h.01"/>',
    rayo:        '<path d="M13.5 2.5L4.8 13.6h6L9.9 21.5l9.3-11.9h-6.4z"/>',
    // Info: es `alerta` dado vuelta (punto arriba, trazo abajo). Conviene que
    // se distingan, porque los dos son un círculo a primera vista.
    info:        '<circle cx="12" cy="12" r="9"/><path d="M12 11.4v4.8"/><path d="M12 8h.01"/>',
    correo:      '<rect x="2.5" y="4.8" width="19" height="14.4" rx="2.4"/><path d="M3.2 6.2l8.8 6.4 8.8-6.4"/>',
    codigo:      '<path d="M8.6 8.2L4 12l4.6 3.8"/><path d="M15.4 8.2L20 12l-4.6 3.8"/><path d="M13.4 4.6l-2.8 14.8"/>',
    escudoOk:    '<path d="M12 2.6l7.4 2.7v5.5c0 4.6-3.1 8-7.4 10.2-4.3-2.2-7.4-5.6-7.4-10.2V5.3z"/><path d="M9.2 11.9l1.9 1.9 3.7-3.8"/>',
    // Es el mismo trazo que CAM_SVG, que existe aparte porque va colgado del
    // marcador con su propio contenedor y tamaño.
    camara:      '<path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/>'
  };
  // `extra` es la clase del contenedor; el tamaño lo pone el CSS.
  const ico = (nombre, extra) =>
    `<i class="ico${extra ? ' ' + extra : ''}" aria-hidden="true"><svg viewBox="0 0 24 24" ${TRAZO}>${ICO[nombre] || ''}</svg></i>`;

  const CAM_SVG =
    '<i class="pin-cam" aria-hidden="true">' +
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">' +
    '<path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>' +
    '<circle cx="12" cy="13" r="4"/></svg></i>';

  // `hasPhoto` va en la firma (dataset.sig) además de dibujarse: sin eso, un
  // reporte al que se le acaba de adjuntar una foto no repintaría el pin, y
  // la cámara no aparecería hasta el próximo cambio de estado.
  function paintPin(el, ageMinutes, category, pending, hasPhoto){
    const cat = CATEGORIES[category] || CATEGORIES.reten_fijo;
    const stale = ageMinutes > CONFIG.staleMinutes;
    const sig = `${category}|${stale}|${pending}|${hasPhoto?1:0}`;
    if(el.dataset.sig === sig) return el;
    el.dataset.sig = sig;
    el.className = `amet-pin${pending?' pending':''}${stale?' stale':''}`;
    // La cámara distingue de un vistazo el reporte que tiene evidencia real
    // del que es solo un aviso — que es justo lo que el mapa no comunicaba
    // cuando todos los pines eran el mismo emoji.
    el.innerHTML = `<div class="badge" style="background:${cat.hex};color:${cat.ink}">${ico(cat.icon,'ico-marcador')}${hasPhoto?CAM_SVG:''}</div>`;
    return el;
  }

  // El núcleo del círculo de zona. Misma insignia que el pin (emoji de la
  // categoría), de tamaño fijo, para que el reporte se vea aunque el círculo
  // de 150 m quede diminuto al alejar el mapa. Con firma, igual que paintPin:
  // sin eso se reescribiría el innerHTML en cada sondeo de 8s y parpadearía.
  function paintApproxCore(el, cat, color, hasPhoto){
    const sig = `${cat.icon}|${color}|${hasPhoto?1:0}`;
    if(el.dataset.sig === sig) return;
    el.dataset.sig = sig;
    el.innerHTML = `<div class="approx-core" style="background:${color};color:${cat.ink}">${ico(cat.icon,'ico-marcador')}${hasPhoto?CAM_SVG:''}</div>`;
  }

  // Radio en píxeles de pantalla que le corresponde a una distancia en
  // metros, para el zoom y la latitud actuales (MapLibre: tiles de 512px).
  // Lo necesita el círculo de zona aproximada, que es un div y no un
  // L.circle con radio en metros como tenía Leaflet.
  function metersToPixels(meters, lat, zoom){
    const metersPerPixel = 40075016.686 * Math.cos(lat * Math.PI/180) / (512 * Math.pow(2, zoom));
    return meters / metersPerPixel;
  }

  // A partir de qué tamaño en pantalla vale la pena dibujar el anillo de zona.
  //
  // EL ANILLO MIENTE SI SE LE PONE UN PISO. Su única razón de ser es decir
  // "el retén está en algún punto de estos 150 m": si se lo estira para que no
  // desaparezca, deja de corresponder a 150 m reales y pasa a exagerar el área
  // — o sea que comunica algo falso. Por eso, cuando el círculo real queda más
  // chico que esto, NO se achica: se deja de dibujar y queda solo el núcleo
  // con el emoji, que no afirma ninguna distancia.
  //
  // 54px es donde el anillo todavía rodea al núcleo de 34px con aire (10px por
  // lado). Por debajo quedaría estrangulándolo, que es justo cuando se veía
  // mal.
  const APPROX_RING_MIN_PX = 54;
  // El elemento nunca baja del mínimo táctil aunque el anillo no se dibuje:
  // el marcador entero es el área de click, y sin esto a zoom bajo quedaba en
  // unos pocos píxeles, imposible de tocar.
  const APPROX_TAP_MIN_PX = 44;

  function sizeApproxCircle(entry){
    const real = 2 * metersToPixels(APPROX_RADIUS_METERS, entry.lat, map.getZoom());
    // `solo-nucleo` apaga el borde y el relleno; el núcleo sigue visible.
    entry.el.classList.toggle('solo-nucleo', real < APPROX_RING_MIN_PX);
    const d = Math.max(APPROX_TAP_MIN_PX, real);
    entry.el.style.width = `${d}px`;
    entry.el.style.height = `${d}px`;
  }

  // Tinte translúcido a partir del hex de la categoría, para el fondo de
  // los chips activos (CSS no puede derivarlo sin color-mix()).
  function hexTint(hex, alpha){
    const n = parseInt(hex.slice(1), 16);
    return `rgba(${(n>>16)&255}, ${(n>>8)&255}, ${n&255}, ${alpha})`;
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // ---- Hoja de detalle de un reporte (reemplaza el popup de Leaflet) ----
  // Un reporte pendiente todavía no está en reportsCache (vive solo en la
  // cola offline), así que se busca en los dos lados.
  const detailEl = document.getElementById('detail');
  const detailPanel = detailEl.querySelector('.detail-panel');
  let detailId = null;
  // Votos con la llamada en vuelo, para que un doble toque no mande dos.
  const votando = new Set();

  function findReport(id){
    if(reportsCache[id]) return reportsCache[id];
    const queued = pendingQueue.find(p => p.id === id);
    return queued ? queued.record : null;
  }

  function detailHtml(id, r){
    const mine = getMine().has(id);
    const cat = CATEGORIES[r.category] || CATEGORIES.reten_fijo;
    const pending = pendingIds.has(id);
    const confirms = r.confirms || 0;
    const denies = r.denies || 0;
    const yaVoto = getVoted().has(id);
    const miVoto = getVoteDirs()[id] || null;
    const yaDenuncio = getFlagged().has(id);
    // Solo el autor puede adjuntar, y solo si todavía no hay foto: el
    // servidor lo exige igual (`photo is null` en el WHERE de _attach_photo),
    // acá se oculta el botón para no ofrecer algo que va a fallar. Sin token
    // guardado tampoco se puede demostrar la propiedad — pasa con reportes de
    // antes de v12.0.
    const puedeAdjuntar = mine && !r.photo && !pending && !!getTokens()[id];
    return `
      <div class="grabber"></div>
      <div class="detail-head">
        <span class="cat-label" style="background:${cat.hex};color:${cat.ink}">${ico(cat.icon)} ${cat.label}</span>
        <button class="detail-close" aria-label="Cerrar detalle del reporte">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      ${r.photo ? `<img class="detail-photo" src="${r.photo}" alt="Foto del reporte">` : ''}
      <div class="detail-meta">${pending ? 'Pendiente de sincronizar…' : timeAgo(r.ts)}${r.approx ? ` · Zona aproximada (~${APPROX_RADIUS_METERS} m)` : ''}</div>
      ${r.note ? `<div class="detail-note">${escapeHtml(r.note)}</div>` : ''}
      ${pending ? `
      <div class="mini-actions">
        <button class="mini-btn danger" data-action="cancel-pending" data-id="${id}">Cancelar reporte</button>
      </div>` : `
      <div class="votes">
        <button class="vote-btn${miVoto === 'confirm' ? ' chosen' : ''}" data-action="confirm" data-id="${id}"${yaVoto ? ' disabled' : ''}>
          <b>${ico('pulgarArriba')} ${confirms}</b><span>${miVoto === 'confirm' ? 'Tu voto' : 'Sigue ahí'}</span>
        </button>
        <button class="vote-btn${miVoto === 'deny' ? ' chosen' : ''}" data-action="deny" data-id="${id}"${yaVoto ? ' disabled' : ''}>
          <b>${ico('pulgarAbajo')} ${denies}</b><span>${miVoto === 'deny' ? 'Tu voto' : 'Ya no está'}</span>
        </button>
      </div>
      <div class="mini-actions">
        <button class="mini-btn primary" data-action="share" data-id="${id}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"/><path d="M16 6l-4-4-4 4"/><path d="M12 2v13"/></svg>Compartir</button>
        ${mine ? `<button class="mini-btn danger" data-action="delete" data-id="${id}">Eliminar</button>` : ''}
      </div>
      ${puedeAdjuntar ? `
      <div class="mini-actions">
        <button class="mini-btn" data-action="add-photo" data-id="${id}">${ico('camara')} Agregar foto</button>
      </div>` : ''}
      ${(r.photo && !mine) ? `
      <button class="link-btn" data-action="flag-photo" data-id="${id}"${yaDenuncio ? ' disabled' : ''}>${yaDenuncio ? 'Foto denunciada' : 'Denunciar foto'}</button>` : ''}`}`;
  }

  function openDetail(id){
    const r = findReport(id);
    if(!r) return;
    detailId = id;
    detailPanel.innerHTML = detailHtml(id, r);
    detailEl.hidden = false;
  }
  function closeDetail(){
    detailEl.hidden = true;
    detailPanel.innerHTML = '';
    detailId = null;
  }
  // Vuelve a dibujar la hoja si está abierta para ese reporte (ej. después
  // de votar). No se llama desde el sondeo de 8s a propósito: re-renderizar
  // bajo el dedo del usuario cortaría el scroll de la hoja.
  function refreshDetail(id){
    if(detailId === id && findReport(id)) openDetail(id);
  }

  detailEl.querySelector('.detail-backdrop').addEventListener('click', closeDetail);
  detailPanel.addEventListener('click', (e) => {
    if(e.target.closest('.detail-close')) closeDetail();
  });

  // Reportes rápidos (r.approx) se dibujan como un círculo de zona en vez
  // de un pin: comunica que la ubicación real está en algún punto dentro de
  // ese radio, no marcada con precisión.
  // markersById[id] guarda ahora un objeto { kind, el, marker, lat } en vez
  // del layer de Leaflet directo: MapLibre necesita que nos quedemos con el
  // elemento del DOM (para repintarlo) y con la latitud (para recalcular el
  // radio en píxeles del círculo cuando cambia el zoom).
  function upsertApproxCircle(id, r){
    const ageMinutes = (Date.now()-r.ts)/60000;
    const pending = pendingIds.has(id);
    const cat = CATEGORIES[r.category] || CATEGORIES.reten_fijo;
    const stale = ageMinutes > CONFIG.staleMinutes;
    const color = stale ? '#9a9a9e' : cat.hex;

    let entry = markersById[id];
    if(entry){
      entry.marker.setLngLat([r.lng, r.lat]);
      entry.lat = r.lat;
    } else {
      const el = document.createElement('div');
      el.className = 'amet-approx';
      el.addEventListener('click', () => openDetail(id));
      entry = {
        kind: 'approx', el, lat: r.lat,
        marker: new maplibregl.Marker({ element: el }).setLngLat([r.lng, r.lat]).addTo(map)
      };
      markersById[id] = entry;
    }
    entry.el.classList.toggle('pending', pending);
    entry.el.style.setProperty('--approx-color', color);
    entry.el.style.setProperty('--approx-fill', hexTint(color, 0.18));
    // El núcleo lleva el emoji de la categoría (👮 para un retén fijo) y, si
    // hay, la cámara. La cámara tiene que estar acá y no solo en paintPin: el
    // reporte de un toque es approx:true, o sea EL tipo más común de la app.
    paintApproxCore(entry.el, cat, color, !!r.photo);
    sizeApproxCircle(entry);
  }

  function upsertMarker(id, r){
    const kind = r.approx ? 'approx' : 'pin';
    // Si por lo que sea cambió el tipo de un reporte ya dibujado, hay que
    // rehacer el marcador: un div de círculo y un pin no son intercambiables.
    if(markersById[id] && markersById[id].kind !== kind) removeMarker(id);
    if(r.approx) return upsertApproxCircle(id, r);

    const ageMinutes = (Date.now()-r.ts)/60000;
    const pending = pendingIds.has(id);
    const entry = markersById[id];
    if(entry){
      entry.marker.setLngLat([r.lng, r.lat]);
      paintPin(entry.el, ageMinutes, r.category, pending, !!r.photo);
    } else {
      const el = document.createElement('div');
      el.addEventListener('click', () => openDetail(id));
      paintPin(el, ageMinutes, r.category, pending, !!r.photo);
      markersById[id] = {
        kind: 'pin', el,
        marker: new maplibregl.Marker({ element: el }).setLngLat([r.lng, r.lat]).addTo(map)
      };
    }
  }

  function removeMarker(id){
    if(markersById[id]){ markersById[id].marker.remove(); delete markersById[id]; }
  }

  // Solo se marca en true tras el primer fetch que responde: si no, el
  // cartel de "no hay nada" aparecería durante el arranque, cuando todavía
  // no se sabe si hay reportes o no.
  let reportsLoadedOnce = false;
  // El último sondeo no llegó (excepción de red o respuesta no-2xx). Es lo
  // que permite distinguir "no hay retenes" de "no pude preguntar".
  let lastFetchFailed = false;
  const emptyStateEl = document.getElementById('empty-state');

  // El cartel de "no hay reportes" se muestra UNA sola vez por sesión y se
  // va solo a los 7s. Si se dejara fijo mientras no haya reportes, con la
  // app recién lanzada (donde puede no haber ninguno en horas) quedaría
  // pegado en el medio de la pantalla para siempre, tapando el mapa: pasa
  // de ser informativo a ser un estorbo. Tampoco reaparece al pasar por
  // otra zona vacía, para no perseguir al usuario.
  let emptyStateShown = false;
  let emptyStateTimer = null;
  // Aviso de "no pude conectarme": se muestra una vez por RACHA de fallos y se
  // re-arma solo cuando un sondeo vuelve a responder. Sin eso, una red
  // intermitente lo repetiría cada 8 s.
  let errorStateShown = false;

  function hideEmptyState(){
    clearTimeout(emptyStateTimer);
    emptyStateTimer = null;
    emptyStateEl.hidden = true;
  }
  emptyStateEl.addEventListener('click', hideEmptyState);

  // Misma píldora, mismo tamaño y mismo auto-ocultado a los 7 s para los dos
  // estados. Que la de error NO sea una tarjeta grande y central es a
  // propósito: esa forma ya se probó y molestó, ver CLAUDE.md.
  // innerHTML y no textContent: desde que los emojis son íconos, el contenido
