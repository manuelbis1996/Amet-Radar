  // lleva un <svg>. Con textContent el marcado se mostraba como texto literal
  // y la píldora pasaba de una línea a 183px de alto — lo agarró check-vacio,
  // que mide cuánto ocupa. Las dos cadenas son constantes de la app, no entra
  // nada del usuario acá.
  function mostrarPildora(html){
    const card = emptyStateEl.querySelector('.empty-card');
    if(card) card.innerHTML = html;
    emptyStateEl.hidden = false;
    clearTimeout(emptyStateTimer);
    emptyStateTimer = setTimeout(hideEmptyState, 7000);
  }

  function maybeShowEmptyState(n){
    if(n > 0){ hideEmptyState(); return; }
    // No mostrar nada debajo de una hoja abierta (bienvenida, flujo de
    // reporte): quedaría tapado por el scrim y se auto-ocultaría sin que
    // nadie lo llegue a leer. Se reintenta en el próximo sondeo de 8s.
    const ov = document.getElementById('flow-overlay');
    if(ov && !ov.hidden) return;

    // "No hay retenes" y "el servidor no responde" se veían EXACTAMENTE
    // igual: un mapa vacío. Es la ambigüedad más cara del día 1, porque el
    // mapa vacío es el estado normal al lanzar y no había forma de saber si
    // la app andaba. Solo se avisa si además no hay nada dibujado: con
    // marcadores en pantalla, un sondeo fallido no molesta a nadie.
    if(lastFetchFailed){
      if(errorStateShown) return;
      errorStateShown = true;
      mostrarPildora(ico('alerta') + ' Sin conexión con el servidor');
      return;
    }
    errorStateShown = false;

    if(!reportsLoadedOnce || emptyStateShown) return;
    emptyStateShown = true;
    mostrarPildora(ico('ruta') + ' Todo tranquilo por aquí');
  }

  function updateCount(){
    const n = Object.keys(markersById).length;
    document.getElementById('stat-count').textContent = n;
    maybeShowEmptyState(n);
  }

  // ---- Filtros de categoría ----
  // El filtro por categoría se quitó en v13.0: con una sola categoría
  // reportable no hay nada que filtrar. `activeCategories` se queda con
  // todas las categorías y nunca cambia — sigue existiendo porque
  // renderVisibleMarkers la consulta, y porque en la base puede haber
  // reportes viejos de las otras tres que igual hay que dibujar.

  // ---- Renderizado por zona visible + limpieza de vencidos ----
  function renderVisibleMarkers(){
    // Leaflet tenía bounds.pad(0.25); MapLibre no lo trae, así que el
    // margen del 25% a cada lado se calcula a mano (sirve para que un
    // marcador ya esté dibujado justo antes de entrar en pantalla).
    const b = map.getBounds();
    const padLat = (b.getNorth() - b.getSouth()) * 0.25;
    const padLng = (b.getEast() - b.getWest()) * 0.25;
    const south = b.getSouth() - padLat, north = b.getNorth() + padLat;
    const west = b.getWest() - padLng, east = b.getEast() + padLng;
    const now = Date.now();

    // BARRIDO DE HUÉRFANOS. El bucle de abajo recorre reportsCache, así que
    // solo puede sacar del mapa lo que TODAVÍA está en la caché: un reporte
    // que desapareció del servidor (lo borró su autor desde otro teléfono, lo
    // retiró la comunidad, o lo quitó el panel) sale de la caché en el
    // siguiente fetch y con eso el bucle deja de visitar su id — su marcador
    // se quedaba dibujado para siempre, y el contador del header contándolo.
    // Por eso hay que barrer al revés: de los marcadores hacia la caché.
    //
    // Los pendientes de la cola offline se saltean: existen como marcador a
    // propósito sin estar en reportsCache (todavía no llegaron al servidor).
    for(const id in markersById){
      if(reportsCache[id] || pendingIds.has(id)) continue;
      removeMarker(id);
      // El token NO se borra acá, a diferencia del vencimiento: un reporte
      // también "desaparece" al quedar fuera del área que trae el sondeo, y
      // ahí sigue existiendo — tirar el token dejaría a su autor sin poder
      // borrarlo nunca más solo por haber paneado el mapa.
      if(detailId === id){
        closeDetail();
        showToast('Ese reporte ya no está.');
      }
    }

    for(const id in reportsCache){
      const r = reportsCache[id];
      const ageMinutes = (now - r.ts) / 60000;
      if(ageMinutes > CONFIG.maxAgeMinutes){
        delete reportsCache[id];
        dropToken(id);
        removeMarker(id);
        purgeExpiredRemote();
        // Si el usuario tenía abierta la hoja de este reporte, cerrarla:
        // acaba de dejar de existir. (Solo pasa por expiración; el filtro
        // por categoría o el paneo no llegan acá, y con la hoja abierta el
        // scrim tapa el mapa igual.)
        if(detailId === id) closeDetail();
        continue;
      }
      const inView = r.lat >= south && r.lat <= north && r.lng >= west && r.lng <= east;
      const catOn = activeCategories.has(r.category);
      if(inView && catOn){
        upsertMarker(id, r);
      } else {
        removeMarker(id);
      }
    }
    updateCount();
  }

  // ---- Publicación diferida de reportes pendientes (offline) ----
  function restorePendingMarkers(){
    pendingQueue.forEach(item => upsertMarker(item.id, item.record));
    updateCount();
  }

  let flushInFlight = false;
  async function flushPendingQueue(){
    if(flushInFlight || pendingQueue.length === 0) return;
    if(navigator.onLine === false) return;
    flushInFlight = true;
    let synced = 0;
    try{
      for(const item of [...pendingQueue]){
        if(!pendingIds.has(item.id)) continue; // se canceló mientras esperábamos
        const ageMinutes = (Date.now() - item.record.ts) / 60000;
        if(ageMinutes > CONFIG.maxAgeMinutes){
          dequeuePending(item.id);
          removeMarker(item.id);
          updateCount();
          continue;
        }
        try{
          // record.photo sigue en base64 si uploadPhoto no llegó a correr
          // (offline desde el momento de publicar); si ya se subió en un
          // intento previo, ya es una URL de Storage y no hace falta
          // volver a subirla.
          if(item.record.photo && item.record.photo.startsWith('data:')){
            item.record.photo = await uploadPhoto(item.id, item.record.photo);
            savePendingQueue(pendingQueue);
          }
          await insertReport(item.id, item.record);
          dequeuePending(item.id);
          upsertMarker(item.id, item.record);
          updateCount();
          synced++;
        }catch(err){
          if(err instanceof NetworkError) break; // seguimos offline, se reintenta después
          dequeuePending(item.id);
          removeMarker(item.id);
          updateCount();
          showToast('No se pudo sincronizar un reporte pendiente.', true);
        }
      }
    } finally {
      flushInFlight = false;
    }
    if(synced > 0) showToast(synced === 1 ? 'Reporte pendiente publicado.' : `${synced} reportes pendientes publicados.`);
  }

  // Sondeo periódico: así se ven los reportes que publican otros usuarios
  // desde otro dispositivo, no solo los que crea este navegador. Se
  // reutiliza el mismo intervalo como respaldo para reintentar la cola.
  async function refreshReports(){
    await fetchAllReports();
    renderVisibleMarkers();
    await flushPendingQueue();
  }

  loadConfig();
  restorePendingMarkers();
  // En MapLibre 'moveend' ya cubre el fin de un zoom, así que alcanza con
  // ese (Leaflet necesitaba 'moveend zoomend'; MapLibre además no acepta
  // varios eventos separados por espacio en un solo on()).
  map.on('moveend', () => {
    renderVisibleMarkers();
    // Si el usuario se fue del área que se trajo en el último fetch, hay
    // que pedir la nueva ya: esperar hasta 8s al próximo sondeo dejaría el
    // mapa vacío justo después de panear, que se lee como que no hay nada.
    if(!boxContains(lastFetchBox, currentBox(0.25))) refreshReports();
  });

  // El círculo de zona aproximada tiene radio en metros pero se dibuja con
  // un tamaño en píxeles, así que hay que recalcularlo mientras se hace
  // zoom ('zoom' es continuo, no solo al final, para que no "salte").
  map.on('zoom', () => {
    for(const id in markersById){
      if(markersById[id].kind === 'approx') sizeApproxCircle(markersById[id]);
    }
  });
  const reportsReady = refreshReports();
  setInterval(refreshReports, 8000);
  window.addEventListener('online', flushPendingQueue);

  // ---- Compartir ----
  // LA URL SE ARMA SIEMPRE DESDE LA RAÍZ, NO DESDE location.pathname, y no es
  // un detalle cosmético: el preview dinámico de WhatsApp lo genera el Worker
  // de Cloudflare (_worker.js), pero el Worker SOLO corre en `/`. La ruta
  // `/amet-radar.html` la sirve el asset router sin invocarlo nunca — el mismo
  // mecanismo del bug del 307 documentado en CLAUDE.md.
  //
  // Con location.pathname, quien tiene la PWA instalada (start_url es
  // "./amet-radar.html") compartía siempre la URL que NO genera preview: la
  // tarjeta linda le fallaba justo a los usuarios más comprometidos, que son
  // los que más comparten. Verificado contra producción con un User-Agent de
  // WhatsApp y una sonda real.
  //
  // Se prefirió esto antes que `run_worker_first` en wrangler.jsonc porque no
  // toca la configuración de despliegue (que en este proyecto ya mordió una
  // vez) y no convierte cada apertura de la PWA en una invocación del Worker.
  // En local sigue andando: server.js ya resuelve `/` -> amet-radar.html.
  function urlBase(){ return `${location.origin}/`; }

  // Un solo camino para compartir, con los mismos dos respaldos que ya tenía
  // el botón de la ficha: hoja nativa -> portapapeles -> el enlace en un toast.
  function compartir(text, url){
    if(navigator.share){
      navigator.share({ title: 'AMET Radar', text, url }).catch(() => {});
    } else if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(url).then(
        () => showToast('Enlace copiado al portapapeles'),
        () => showToast(url)
      );
    } else {
      showToast(url);
    }
  }

  // Compartir LA APP, no un reporte. Hasta v16.4 solo se podía compartir un
  // reporte puntual desde su ficha, o sea que el día del lanzamiento —sin
  // ningún reporte todavía— la app era literalmente incompartible, el único
  // día en que compartirla es todo.
  function compartirApp(){
    compartir('Mira dónde hay retenes de tránsito en La Vega, en tiempo real 👮', urlBase());
  }
  document.getElementById('share-app-btn').addEventListener('click', compartirApp);

  // REPORTAR EN OTRO PUNTO, con o sin GPS. Hasta v17.2 el pin manual solo
  // aparecía cuando NO había GPS, así que con la ubicación andando no había
  // ninguna forma de avisar de un retén que no fuera donde uno está parado —
  // y eso es la mitad de los casos reales: te lo cuentan, o lo pasaste hace
  // diez cuadras y recién ahora podés sacar el teléfono.
  //
  // Va como botón APARTE y no como una pregunta dentro de "Reportar": esa
  // pantalla intermedia se sacó en v13.0 justamente porque le agregaba un
  // toque a TODOS los reportes, incluidos los que se hacen manejando. Así el
  // camino rápido no cambia en nada y este queda a la vista para quien lo
  // necesite.
  document.getElementById('pick-btn').addEventListener('click', () => {
    if(reportBtn.disabled) return;
    if(!canReport()){
      showToast('Límite de reportes por hora alcanzado. Intenta más tarde.', true);
      return;
    }
    pendingLocation = null; // que el mapa arranque donde el usuario está mirando
    startManualPick(publicarPunteado);
  });

  // ---- Deep link: abrir un reporte compartido ----
  // openReportById es la parte reutilizable (centrar mapa + abrir popup);
  // la usan tanto el link compartido como el click en una notificación
  // push mientras la app ya está abierta (ver listener de 'message' más abajo).
  async function openReportById(id){
    // Puede no estar en la caché: desde v13.2 el sondeo solo trae el área
    // visible, y un link compartido o una notificación push apuntan
    // justamente a un reporte que suele estar en otra parte del mapa.
    let r = reportsCache[id];
    if(!r){
      r = await fetchReportById(id);
      // Antes esto era un `return` mudo: quien tocaba un link de WhatsApp de
      // un reporte ya vencido caía en un mapa cualquiera sin ninguna
      // explicación, y eso se lee como "la app está rota" — justo en el
      // vector por el que llega la gente nueva.
      if(!r){ showToast('Ese reporte ya no está activo.'); return; }
      reportsCache[id] = r;
    }
    // OJO: map.setView es de Leaflet y NO existe en MapLibre — tenerlo acá
    // hacía que abrir un reporte por link compartido o por notificación
    // lanzara excepción. Además el orden es [lng, lat], al revés que Leaflet.
    map.easeTo({ center: [r.lng, r.lat], zoom: zoomFromLeaflet(16), duration: 300 });
    setTimeout(() => {
      upsertMarker(id, r);
      openDetail(id);
    }, 300);
  }

  // Los links nuevos usan ?r= (query param, visible al servidor — lo
  // necesita netlify/edge-functions/report-preview.ts para armar el
  // preview de WhatsApp/Twitter, algo que un #hash nunca podría lograr
  // porque el fragmento no se manda en la request). Se sigue leyendo
  // #r= también por si queda algún link viejo compartido con el esquema
  // anterior — no cuesta nada mantenerlo.
  async function openSharedReportFromUrl(){
    const id = new URLSearchParams(location.search).get('r')
      || (location.hash.match(/r=([^&]+)/) || [])[1];
    if(!id) return;
    await reportsReady;
    openReportById(decodeURIComponent(id));
  }

  // ---- Notificaciones push: suscripción y estado del botón ----
  function urlBase64ToUint8Array(base64String){
    const padding = '='.repeat((4 - base64String.length % 4) % 4);
    const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
    const raw = atob(base64);
    return Uint8Array.from([...raw].map(c => c.charCodeAt(0)));
  }

  const pushToggleBtn = document.getElementById('push-toggle-btn');

  // Qué dice la campana en cada estado. Antes el `aria-label` y el `title`
  // eran fijos ("Avisarme de retenes cerca") y no cambiaban nunca: con los
  // avisos YA activos el botón anuncia una acción que no hace —ahí abre la
  // hoja de gestión— así que a un lector de pantalla le mentía. Y el único
  // indicio de encendido/apagado era el tinte violeta: mismo ícono, mismo
  // tamaño. Ahora además va un punto (`::after` en el CSS), que es una
  // diferencia de forma y no de color — mismo patrón que ya usaba el botón
  // de filtros con su punto naranja.
  const PUSH_BTN_LABEL = {
    checking:  'Preparando los avisos de retenes',
    loading:   'Cambiando los avisos de retenes',
    inactive:  'Avisarme de retenes cerca',
    active:    'Avisos de retenes activados. Tocar para gestionarlos'
  };
  function setPushButtonState(state){
    pushToggleBtn.dataset.state = state;
    const label = PUSH_BTN_LABEL[state] || PUSH_BTN_LABEL.inactive;
    pushToggleBtn.setAttribute('aria-label', label);
    pushToggleBtn.setAttribute('title', label);
    pushToggleBtn.setAttribute('aria-pressed', state === 'active' ? 'true' : 'false');
  }

  // `navigator.serviceWorker.ready` que no se puede colgar. Todo lo que toca
  // push pasa por acá: sin el tope, un service worker que nunca se activa
  // dejaba la campana esperando indefinidamente y sin decir nada.
  function esperarServiceWorker(){
    return Promise.race([
      navigator.serviceWorker.ready,
      new Promise((_, rechazar) => setTimeout(
        () => rechazar(new Error('service worker no disponible')), PUSH_SW_TIMEOUT_MS))
    ]);
  }

  async function subscribeToPush(){
    setPushButtonState('loading');
    try{
      const permission = await Notification.requestPermission();
      if(permission !== 'granted'){
        showToast('Necesitamos permiso de notificaciones para poder avisarte');
        setPushButtonState('inactive');
        return;
      }
      const reg = await esperarServiceWorker();
      const sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
      });
      const json = sub.toJSON();
      const latlng = lastKnownLatLng || [DEFAULT_CENTER[0], DEFAULT_CENTER[1]];
      // Antes esto era DELETE + POST directos contra la tabla, porque un
      // upsert por la REST API falla sin política de SELECT (PostgREST
      // necesita leer de vuelta la fila). Ese rodeo ya no hace falta: la RPC
      // es SECURITY DEFINER y hace un upsert de verdad.
      //
      // El motivo del cambio no es la comodidad sino la seguridad: con las
      // políticas abiertas, cualquiera con la anon key podía mandar un
      // DELETE con filtro arbitrario y llevarse TODAS las suscripciones de
      // todos los dispositivos. La RPC recibe el endpoint exacto y toca una
      // sola fila. Ver CLAUDE.md.
      const guardada = await callRpc('subscribe_push', {
        p_endpoint: json.endpoint,
        p_p256dh: json.keys.p256dh,
        p_auth: json.keys.auth,
        p_lat: latlng[0],
        p_lng: latlng[1]
      });
      if(guardada !== true) throw new Error('No se pudo guardar la suscripción');
      localStorage.setItem(PUSH_ENDPOINT_KEY, json.endpoint);
      lastPushPosUpdate = { latlng, ts: Date.now() };
      setPushButtonState('active');
      showToast('Listo, te vamos a avisar de retenes cerca');
      // Ya no se pregunta por categorías (v13.0): con una sola reportable no
      // hay nada que elegir. La fila queda con `categories` en NULL, que el
      // Edge Function interpreta como "todas" — que es justo lo que
      // corresponde, y lo correcto también si algún día vuelven las otras.
    }catch(err){
      console.error('Error suscribiendo a push', err);
      showToast('No se pudo activar el aviso de retenes cerca');
      setPushButtonState('inactive');
    }
  }

  async function unsubscribeFromPush(){
    setPushButtonState('loading');
    try{
      const reg = await esperarServiceWorker();
      const sub = await reg.pushManager.getSubscription();
      if(sub){
        await callRpc('unsubscribe_push', { p_endpoint: sub.endpoint });
        await sub.unsubscribe();
      }
    }catch(err){ console.error('Error cancelando suscripción push', err); }
    localStorage.removeItem(PUSH_ENDPOINT_KEY);
    setPushButtonState('inactive');
    showToast('Avisos de retenes cerca desactivados');
  }

  let lastPushPosUpdate = null;
  async function updatePushSubscriptionPosition(latlng){
    if(pushToggleBtn.dataset.state !== 'active') return;
    if(lastPushPosUpdate){
      const elapsed = Date.now() - lastPushPosUpdate.ts;
      const moved = distanceMeters(lastPushPosUpdate.latlng[0], lastPushPosUpdate.latlng[1], latlng[0], latlng[1]);
      if(elapsed < PUSH_POS_UPDATE_MIN_MS && moved < PUSH_POS_UPDATE_MIN_METERS) return;
    }
    try{
      const reg = await esperarServiceWorker();
      const sub = await reg.pushManager.getSubscription();
      if(!sub) return;
      await callRpc('update_push_position', {
        p_endpoint: sub.endpoint, p_lat: latlng[0], p_lng: latlng[1]
      });
      lastPushPosUpdate = { latlng, ts: Date.now() };
    }catch(err){ console.error('Error actualizando posición de suscripción push', err); }
  }

  // Con una sola categoría reportable no hay nada que elegir, así que la
  // hoja quedó solo como gestión del aviso. Igual NO se puede eliminar: es
  // el único lugar desde donde se desactiva, y que la campana desuscribiera
  // de un toque (como hacía antes de v11) borraba la suscripción sin
  // ninguna confirmación.
  function openPushSheet(){
    renderSheet(`
      <h2>Avisos de retenes</h2>
      <p class="sub">Te avisamos cuando alguien reporte un retén cerca de tu ubicación, aunque tengas la app cerrada.</p>
      <div class="btn-row" style="margin-bottom:10px;">
        <button class="btn btn-primary" id="push-close" style="width:100%;">Listo</button>
      </div>
      <button class="mini-btn danger" style="width:100%;" id="push-unsubscribe">Desactivar avisos</button>
    `);
    document.getElementById('push-close').addEventListener('click', closeOverlay);
    document.getElementById('push-unsubscribe').addEventListener('click', () => {
      closeOverlay();
      unsubscribeFromPush();
    });
  }

  // OFRECER LOS AVISOS UNA VEZ, DESPUÉS DEL PRIMER REPORTE PUBLICADO.
  //
  // El push es el único mecanismo de retención del proyecto y hasta v16.4 era
  // 100% por descubrimiento: la campana es un ícono sin etiqueta, la
  // bienvenida no los mencionaba y publicar tampoco los ofrecía. O sea que el
  // motivo para volver a abrir la app existía pero nadie lo encontraba.
  //
  // Por qué acá y no al abrir: CLAUDE.md registra "onboarding discreto, sin
  // banner/modal al abrir la app la primera vez", y se respeta. Quien acaba de
  // publicar un reporte ya entendió para qué sirve todo esto — es el momento
  // de mayor intención y el opuesto de pedir el permiso a ciegas.
  //
  // Y NO dispara Notification.requestPermission() por su cuenta: eso solo pasa
  // si la persona toca "Avisarme". Un permiso rechazado por reflejo no se
  // puede volver a pedir desde la app, así que la pregunta blanda va primero.
  const PUSH_ASKED_KEY = 'amet_push_asked_v1';
  function maybeOfferPush(){
    if(!('serviceWorker' in navigator) || !('PushManager' in window) || !('Notification' in window)) return;
    if(pushToggleBtn.dataset.state === 'active') return;
    if(Notification.permission !== 'default') return; // ya decidió, en un sentido o en otro
    try{
      if(localStorage.getItem(PUSH_ASKED_KEY)) return;
      localStorage.setItem(PUSH_ASKED_KEY, '1');
    }catch(e){ return; }
    const ov = document.getElementById('flow-overlay');
    if(ov && !ov.hidden) return; // no encimarle una hoja a otra
    renderSheet(`
      <h2>¿Te avisamos?</h2>
      <p class="sub">Gracias por reportar. Podemos avisarte cuando alguien reporte un retén cerca de ti, aunque tengas la app cerrada.</p>
      <div class="btn-row">
        <button class="btn btn-ghost" id="push-later">Ahora no</button>
        <button class="btn btn-primary" id="push-yes">Avisarme</button>
      </div>
    `);
    document.getElementById('push-later').addEventListener('click', closeOverlay);
    document.getElementById('push-yes').addEventListener('click', () => {
      closeOverlay();
      subscribeToPush();
    });
  }

  // Si el service worker se activó. `null` mientras no se sabe.
  let pushDisponible = null;

  async function initPushUI(){
    if(!('serviceWorker' in navigator) || !('PushManager' in window) || !('Notification' in window)) return;
    pushToggleBtn.hidden = false;
    // Todavía no se sabe si este dispositivo ya está suscripto, así que no se
    // afirma "apagada": el estado por defecto del HTML mostraba la campana
    // gris sobre alguien que SÍ tenía los avisos activos, hasta que
    // `getSubscription()` contestara.
    setPushButtonState('checking');

    // EL LISTENER VA ANTES DE CUALQUIER `await`, Y NO ES UN DETALLE DE ESTILO.
    // Estaba después de esperar a `serviceWorker.ready`, que no resuelve nunca
    // si el service worker no se activa: la campana quedaba visible, con
    // aspecto normal, y al tocarla NO PASABA NADA — sin toast, sin hoja y sin
    // error en consola. Verificado reproduciéndolo.
    pushToggleBtn.addEventListener('click', onPushToggleClick);

    try{
      const reg = await esperarServiceWorker();
      const sub = await reg.pushManager.getSubscription();
      pushDisponible = true;
      setPushButtonState(sub ? 'active' : 'inactive');
    }catch(err){
      // Se deja apagada (es lo que corresponde ofrecer), pero se recuerda que
      // no está disponible para poder explicarlo al tocarla en vez de fallar
      // en silencio.
      console.warn('Avisos push no disponibles', err);
      pushDisponible = false;
      setPushButtonState('inactive');
    }
  }

  function onPushToggleClick(){
    const estado = pushToggleBtn.dataset.state;
    if(estado === 'loading') return;              // hay una operación en vuelo
    if(estado === 'checking'){
      showToast('Estamos preparando los avisos, probá de nuevo en un momento');
      return;
    }
    if(pushDisponible === false){
      showToast('Los avisos no están listos todavía. Recargá la app e intentá de nuevo');
      return;
    }
    if(estado === 'active') openPushSheet();
    else subscribeToPush();
  }
  initPushUI();

  if('serviceWorker' in navigator){
    navigator.serviceWorker.addEventListener('message', event => {
      if(event.data && event.data.type === 'open-report' && event.data.id){
        openReportById(event.data.id);
      }
    });
  }

  // ---- Votos, compartir y borrado (delegación de eventos) ----
  document.addEventListener('click', async (e) => {
    const btn = e.target.closest('[data-action]');
    if(!btn) return;
    const action = btn.dataset.action;
    const id = btn.dataset.id;
    if(!id) return;

    if(action === 'cancel-pending'){
      dequeuePending(id);
      dropToken(id);
      const mine = getMine(); mine.delete(id); saveMine(mine);
      removeMarker(id);
      updateCount();
      closeDetail();
      showToast('Reporte pendiente cancelado');
      return;
    }

    const r = reportsCache[id];
    if(!r) return;

    if(action === 'add-photo'){
      // Se guarda a quién adjuntarle la foto y se abre la cámara. El
      // `change` del input decide qué hacer según esta variable: es el mismo
      // input que usa el flujo con foto de siempre.
      attachTargetId = id;
      cameraInput.click();
      return;
    }

    if(action === 'flag-photo'){
      const flagged = getFlagged();
      if(flagged.has(id)){ showToast('Ya denunciaste esta foto'); return; }
      // Igual que los votos, el freno de "una por persona" es local: sin
      // cuentas de usuario no hay nada mejor, y el servidor solo cuenta.
      flagged.add(id); saveFlagged(flagged);
      try{
        const res = await callRpc('flag_photo', { p_id: id });
        if(res && res.hidden){
          r.photo = null;
          upsertMarker(id, r);
          refreshDetail(id);
          showToast('Gracias. La foto se quitó.');
        } else {
          refreshDetail(id);
          showToast('Gracias, la revisaremos.');
        }
      }catch(err){
        flagged.delete(id); saveFlagged(flagged);
        showToast('No se pudo enviar la denuncia.', true);
      }
      return;
    }

    if(action === 'confirm' || action === 'deny'){
      const voted = getVoted();
      if(voted.has(id)){ showToast('Ya votaste en este reporte'); return; }
      if(votando.has(id)) return; // doble toque mientras la llamada está en vuelo
      votando.add(id);
      // Se deshabilitan los dos botones apenas se toca: es lo que le dice al
      // usuario que su toque entró, sin tener que mentirle sobre el resultado
      // antes de saberlo.
      detailPanel.querySelectorAll('.vote-btn').forEach(b => { b.disabled = true; });

      // El retiro comunitario lo decide el servidor (vote_report mira
      // deny_threshold de app_config y borra la fila): el cliente ya no
      // puede borrar reportes ajenos, así que solo obedece la respuesta.
      const out = await voteReport(id, action);
      votando.delete(id);

      // EL VOTO YA NO SE DA POR BUENO ANTES DE TIEMPO. Hasta v16.4 se guardaba
      // en localStorage ANTES de llamar al servidor, y como voteReport se traga
      // la excepción y devuelve null, un voto que nunca llegó terminaba igual
      // en "Gracias por confirmar" — con los botones deshabilitados para
      // siempre en ese dispositivo. O sea: se perdía el voto Y se perdía la
      // posibilidad de reintentarlo, sin que nadie se enterara.
      if(!out){
        refreshDetail(id); // re-dibuja desde getVoted(): vuelve a habilitarlos
        showToast('No se pudo registrar tu voto. Intenta de nuevo.', true);
        return;
      }
      voted.add(id); saveVoted(voted); saveVoteDir(id, action);

      if(out.removed){
        removeMarker(id);
        closeDetail();
        updateCount();
        showToast('Reporte retirado por la comunidad');
        return;
      }
      refreshDetail(id);
      showToast(action === 'confirm' ? 'Gracias por confirmar' : 'Gracias por avisar');
    }

    if(action === 'share'){
      const cat = CATEGORIES[r.category] || CATEGORIES.reten_fijo;
      compartir(`${cat.emoji} ${cat.label} reportado en AMET Radar`,
                `${urlBase()}?r=${encodeURIComponent(id)}`);
    }

    if(action === 'delete'){
      const mine = getMine();
      if(!mine.has(id)){ showToast('Solo puedes eliminar tus propios reportes'); return; }
      const ok = await deleteReportRemote(id);
      if(!ok){
        // Los reportes publicados antes de la migración de seguridad no
        // tienen owner_hash, así que su autor ya no puede borrarlos: se van
        // solos al vencer. Vale para cualquier otro rechazo del servidor.
        showToast('No se pudo eliminar este reporte. Se retirará solo al vencer.', true);
        return;
      }
      mine.delete(id); saveMine(mine);
      removeMarker(id);
      updateCount();
      closeDetail();
      showToast('Reporte eliminado');
    }
  });

  // ---- Geolocalización continua ("mi ubicación") ----
  const mapLoader = document.getElementById('map-loader');
  const locateBtn = document.getElementById('locate-btn');
  let meMarker = null;
  // firstFix: solo pasa a false con un fix exitoso. Un timeout de GPS no lo
  // toca, porque watchPosition sigue corriendo y puede resolver segundos
  // después — cuando eso pase, igual queremos centrar el mapa en el
  // usuario, no dejarlo silenciosamente en La Vega.
  let firstFix = true;
  let deniedShown = false; // evita repetir el aviso de permiso denegado en cada reintento
  // hashHandled evita abrir el deep link de un reporte compartido dos
  // veces (una vez al mostrar el error de "no ubicación" y otra al llegar
  // el fix tardío).
  let hashHandled = false;
  let lastKnownLatLng = null;
  // following: modo "seguir mi ubicación" (como Waze/Google Maps),
  // activado a mano con el botón de ubicación. Mientras está activo, cada
  // fix nuevo de watchPosition hace panTo (no setView, para no resetear el
  // zoom) y se autodesactiva si el usuario arrastra el mapa a mano.
  let following = false;
  // userMoved: el usuario ya arrastró el mapa a mano. Existe porque desde
  // v17.0 el mapa se ve antes de que conteste el GPS, así que el recentrado
  // del primer fix puede llegar cuando la persona ya está mirando otra cosa.
  let userMoved = false;
  // Techo para soltar el loader cuando el estilo del mapa nunca carga (CDN o
  // tiles bloqueados): 'load' no dispara y sin esto la pantalla queda opaca
  // para siempre. 3,5 s es más de lo que tarda un arranque normal.
  const LOADER_MAX_MS = 3500;

  function createMeMarker(latlng){
    const el = document.createElement('div');
    el.className = 'me-marker';
    el.innerHTML = `<div class="me-dot"></div>`;
    el.style.zIndex = '10'; // encima de los pines de reportes
    return new maplibregl.Marker({ element: el })
      .setLngLat([latlng[1], latlng[0]])
      .addTo(map);
  }

  function hideLoader(){ mapLoader.hidden = true; }

  // EL ARRANQUE NO DEPENDE DEL GPS. Hasta v16.4 hideLoader() se llamaba solo
  // desde los caminos de geolocalización, así que con un GPS frío el usuario
  // miraba hasta 20 segundos (el timeout de watchPosition) una pantalla opaca
  // — con el mapa ya dibujado detrás, invisible. Es la primera pérdida del
  // embudo y no tenía ninguna razón de ser.
  map.on('load', hideLoader);
  // El tope NO es paranoia: 'load' no dispara si el estilo falla (OpenFreeMap
  // caído o bloqueado). Sin esto cambiaríamos "20 s de pantalla opaca" por
  // "pantalla opaca para siempre".
  setTimeout(hideLoader, LOADER_MAX_MS);

  function tryOpenHashOnce(){
    if(hashHandled) return;
    hashHandled = true;
    openSharedReportFromUrl();
  }

  function startLocationWatch(){
    if(!('geolocation' in navigator)){
      hideLoader();
      showToast('Este navegador no soporta geolocalización');
      return;
    }
    navigator.geolocation.watchPosition(
      pos => {
        const latlng = [pos.coords.latitude, pos.coords.longitude];
        lastKnownLatLng = latlng;
        updatePushSubscriptionPosition(latlng);
        if(!meMarker){
          meMarker = createMeMarker(latlng);
        } else {
          meMarker.setLngLat([latlng[1], latlng[0]]);
        }
        if(firstFix){
          // Con el loader ya fuera del camino (ver map.on('load') arriba), el
          // mapa está a la vista desde el primer segundo. Recentrar a ciegas
          // cuando por fin llega el GPS le haría saltar el mapa bajo el dedo
          // a quien ya empezó a mirar otra zona: si paneó, se respeta. El
          // botón de ubicación sigue estando para volver a un toque.
          if(!userMoved){
            map.jumpTo({ center: [latlng[1], latlng[0]], zoom: zoomFromLeaflet(15) });
          }
          firstFix = false;
          hideLoader();
          tryOpenHashOnce();
        } else if(following){
          map.panTo([latlng[1], latlng[0]]);
        }
      },
      err => {
        // PERMISSION_DENIED (código 1) es distinto a los otros dos: no es
        // que "está tardando", es que no va a llegar nunca hasta que el
        // usuario cambie el permiso a mano (en iOS/Safari en particular,
        // el navegador no vuelve a preguntar solo). Mostrarle el mensaje
        // genérico de "tardando" acá es engañoso — lo dejamos esperando
        // algo que no va a pasar. Mostramos un aviso accionable una sola
        // vez (deniedShown) para no repetirlo en cada reintento de
        // watchPosition.
        if(err.code === err.PERMISSION_DENIED){
          hideLoader();
          if(!deniedShown){
            deniedShown = true;
            showToast('Activa el permiso de ubicación para este sitio en los Ajustes de tu navegador.', true);
          }
          tryOpenHashOnce();
          return;
        }
        // POSITION_UNAVAILABLE o TIMEOUT: no marcamos firstFix = false acá,
        // porque el fix puede llegar igual unos segundos después (GPS frío
        // al abrir la PWA) y sí queremos centrar el mapa en ese momento en
        // vez de dejarlo trabado en La Vega.
        if(!mapLoader.hidden){
          hideLoader();
          showToast('Tu ubicación está tardando en llegar. Se centrará el mapa apenas la tengamos.', true);
        }
        tryOpenHashOnce();
      },
      { enableHighAccuracy:true, timeout:20000, maximumAge:5000 }
    );
    // Tope de seguridad: no dejar el loader visible más de 20s.
    setTimeout(() => {
      if(!mapLoader.hidden) hideLoader();
      tryOpenHashOnce();
    }, 20500);
  }

  locateBtn.addEventListener('click', () => {
    if(!lastKnownLatLng){
      showToast('Aún buscando tu ubicación…');
      return;
    }
    if(following){
      following = false;
      locateBtn.removeAttribute('data-state');
      return;
    }
    following = true;
    locateBtn.dataset.state = 'active';
    map.easeTo({
      center: [lastKnownLatLng[1], lastKnownLatLng[0]],
      zoom: Math.max(map.getZoom(), zoomFromLeaflet(16))
    });
  });

  // Arrastrar el mapa a mano desactiva el seguimiento — panTo/setView
  // programáticos no disparan dragstart, así que esto no se autocancela.
  map.on('dragstart', () => {
    // Marca que el usuario tomó el control del mapa. Lo lee el primer fix del
    // GPS para no recentrar encima de lo que la persona está mirando.
    userMoved = true;
    if(following){
      following = false;
      locateBtn.removeAttribute('data-state');
    }
  });

  startLocationWatch();

  // ---- Flujo de reporte ----
  // Reportar es UN toque: el botón publica un retén fijo en la ubicación del
  // GPS, sin pantallas intermedias. La red de seguridad es showUndoToast()
  // (6s con botón Deshacer), no una pantalla de confirmación — ver CLAUDE.md.
  //
  // Poner FLUJO_CON_FOTO en true devuelve el selector de modo
  // ("¿Cómo quieres reportar?") y con él todo el flujo detallado, que sigue
  // completo en el código: askForPhoto -> startManualPick -> askForCategory
  // -> publishReport. No se borró nada, solo se le sacó la entrada.
  //
  // El override por `window` es el enganche de las suites de Playwright, que
  // siguen cubriendo ese flujo aunque hoy no tenga entrada en la interfaz.
  // En producción ese global no existe, así que esto vale false y no cambia
  // nada; para reactivar el flujo de verdad hay que editar esta línea.
  //
  // ⚠️ LAS FOTOS YA VOLVIERON, PERO POR OTRA PUERTA (v15.0). No hace falta
  // reactivar esto para tenerlas: son opcionales y se adjuntan DESPUÉS de
  // publicar, con `attachPhotoRemote()` -> Edge Function `attach-photo`. Ese
  // camino no necesita que el bucket tenga políticas ni que `create_report`
  // acepte fotos, y por eso no reabrió nada de lo que se cerró en v14.1.
  //
  // Este flag sigue siendo lo que era: el flujo con la foto ANTES de
  // publicar, que exige sacarla en el lugar y en el momento. Se dejó
  // apagado a propósito — la gente reporta manejando, y ese orden retrasa el
  // aviso a los demás además de empujar a fotografiar en movimiento.
  //
  // Si aun así se quisiera reactivar, sigue sin alcanzar con esta línea:
  //   1. `create_report` sigue rechazando `p_photo` (v14.1), así que hay que
  //      sacarle ese rechazo y restaurar la validación de longitud y prefijo;
  //   2. `uploadPhoto()` sube directo al bucket, que NO tiene políticas: o se
  //      reabre (desaconsejado, era el agujero de v14.1) o se lo reescribe
  //      para pasar por `attach-photo`, que es lo que ya hace el camino nuevo.
  // La moderación ya no es un pendiente: existe desde v15.0 (denuncias con
  // `flag_photo`, ver más abajo).
  // OJO: las suites mockean la red, así que van a seguir en verde aunque el
  // servidor rechace. Esto se prueba contra la base real (tests/README.md).
  const FLUJO_CON_FOTO = window.__ametFlujoConFoto === true;
  // Única categoría reportable. CATEGORIES conserva las cuatro a propósito:
  // hacen falta para dibujar reportes viejos, para la etiqueta del detalle y
  // para el texto de las notificaciones push.
  const CATEGORIA_UNICA = 'reten_fijo';

  const overlay = document.getElementById('flow-overlay');
  const reportBtn = document.getElementById('report-btn');
  const cameraInput = document.getElementById('camera-input');

  function showToast(msg, warn){
    const t = document.createElement('div');
    const detailEl2 = document.getElementById('detail');
    const overlayEl2 = document.getElementById('flow-overlay');
    const hojaAbierta = (detailEl2 && !detailEl2.hidden) || (overlayEl2 && !overlayEl2.hidden);
    t.className = 'toast' + (warn ? ' warn' : '') + (hojaAbierta ? ' top' : '');
    t.setAttribute('role', 'status'); // que un lector de pantalla lo anuncie
    t.textContent = msg;
    document.getElementById('app').appendChild(t);
    setTimeout(()=> t.remove(), 2600);
  }

  // dismissible:false para las hojas que están procesando algo (publicando,
  // comprimiendo la foto): ahí no hay nada que cancelar y cerrarlas dejaría
  // la operación corriendo por detrás con la UI ya cerrada.
  function renderSheet(html, opts){
    // Con una hoja abierta el cartel de estado vacío estorba: en el modo
    // "Marca el lugar" (donde el overlay deja pasar los toques al mapa) la
    // tarjeta se comía el toque justo en el centro de la pantalla, que es
    // donde uno naturalmente marca. En el resto de las hojas quedaría
    // tapado por el scrim igual.
    hideEmptyState();
    const dismissible = !opts || opts.dismissible !== false;
    overlay.innerHTML = `<div class="sheet">${html}</div>`;
    overlay.dataset.dismissible = dismissible ? 'true' : 'false';
    overlay.hidden = false;
  }

  // Tocar fuera de la hoja (sobre el mapa oscurecido) la cierra, igual que
  // el botón Cancelar. e.target === overlay significa que el toque cayó en
  // el fondo y no dentro de la hoja. En modo "Marca el lugar" el overlay
  // tiene pointer-events:none, así que el toque va al mapa y no llega acá
  // — que es justo lo que se quiere ahí.
  overlay.addEventListener('click', (e) => {
    if(e.target !== overlay) return;
    if(overlay.dataset.dismissible === 'false') return;
    closeOverlay();
  });
  function closeOverlay(){
    overlay.hidden = true;
    overlay.innerHTML = '';
    overlay.style.pointerEvents = '';
    overlay.classList.remove('picking');
    pendingLocation = null;
    pendingPhoto = null;
    pendingCategory = null;
    reportBtn.disabled = false;
    removePickMarker();
    // Reevaluar el estado vacío ahora que no hay una hoja tapando: mientras
    // el overlay está abierto se difiere (ver maybeShowEmptyState), y sin
    // esto habría que esperar hasta 8s al próximo sondeo para verlo.
    updateCount();
  }

  // Estado del pin fijo del modo "marca el lugar". Ya no hay ningún marcador
  // de MapLibre acá: el pin es un elemento de la pantalla y el punto sale de
  // map.getCenter() (ver startManualPick).
  let pickEl = null;
  let pickMoveOn = null, pickMoveOff = null;
  function removePickMarker(){
    if(pickMoveOn){ map.off('movestart', pickMoveOn); pickMoveOn = null; }
    if(pickMoveOff){ map.off('moveend', pickMoveOff); pickMoveOff = null; }
    if(pickEl){ pickEl.remove(); pickEl = null; }
  }

  // Escape cierra lo que un toque afuera también cerraría: primero el
  // detalle si está abierto, si no la hoja del flujo — pero NUNCA una hoja
  // marcada dismissible:false ("Publicando…"), por la misma razón que esas
  // tampoco se cierran tocando afuera. En un teléfono no cambia nada; en
  // desktop (donde también se usa, p. ej. el que modera) es lo esperado.
  document.addEventListener('keydown', (e) => {
    if(e.key !== 'Escape') return;
    if(!detailEl.hidden){ closeDetail(); return; }
    if(!overlay.hidden && overlay.dataset.dismissible !== 'false') closeOverlay();
  });

  reportBtn.addEventListener('click', () => {
    if(!canReport()){
      showToast('Límite de reportes por hora alcanzado. Intenta más tarde.', true);
      return;
    }
    reportBtn.disabled = true;
    // Flujo simplificado (v13.0): un toque publica. Sin elegir modo y sin
    // elegir categoría — ver FLUJO_CON_FOTO arriba y CLAUDE.md.
    if(FLUJO_CON_FOTO){ askReportMode(); return; }
    startQuickReport();
  });

  function askReportMode(){
    renderSheet(`
      <h2>¿Cómo quieres reportar?</h2>
      <p class="sub">Elige la opción que mejor se ajuste al momento.</p>
      <div style="display:flex;flex-direction:column;gap:10px;margin-bottom:14px;">
        <button class="btn btn-primary" id="quick-btn" style="width:100%;">${ico('rayo')} Reporte rápido — voy manejando</button>
        <button class="btn btn-ghost" id="detailed-btn" style="width:100%;">${ico('camara')} Foto + marcar en el mapa</button>
      </div>
      <div class="btn-row">
        <button class="btn btn-ghost" id="cancel-btn">Cancelar</button>
      </div>
    `);
    document.getElementById('cancel-btn').addEventListener('click', closeOverlay);
    document.getElementById('quick-btn').addEventListener('click', startQuickReport);
    // La foto va PRIMERO: es lo urgente (el retén está ahí en ese momento y
    // hay que capturarlo ya). Marcar el lugar y elegir la categoría se
    // pueden hacer después, con el vehículo detenido y sin apuro.
    document.getElementById('detailed-btn').addEventListener('click', askForPhoto);
  }

  // ---- Reporte rápido: sin foto, ubicación aproximada a partir del GPS ----
  function startQuickReport(){
    pendingCategory = CATEGORIA_UNICA;
    // SIN GPS YA NO ES UN CALLEJÓN SIN SALIDA. Hasta v16.4 esto mostraba un
    // toast y volvía: con el permiso de ubicación denegado, el botón principal
    // de la app no funcionaba NUNCA MÁS — no degradado, inutilizable. Ahora
    // cae al pin arrastrable, que ya existía completo y probado pero solo se
    // alcanzaba desde FLUJO_CON_FOTO (o sea, código muerto en producción).
    //
    // Esto NO le agrega un toque al camino normal: con GPS se publica igual
    // que siempre, de un toque. La rama nueva solo corre cuando hoy el costo
    // de reportar es infinito, así que pasa de "imposible" a "dos toques".
    // Es el mismo patrón que ya usa el flujo con foto para este caso.
    if(!lastKnownLatLng){
      startManualPick(publicarPunteado);
      return;
    }
    pendingLocation = jitterLocation(lastKnownLatLng[0], lastKnownLatLng[1], 0, 30);
    publishQuickReport();
  }

  // Un punto puesto a mano es una afirmación deliberada, no una lectura del
  // GPS jitterada: se publica como pin exacto (approx:false), igual que ya
  // hace el flujo con foto cuando no hay GPS, y no como círculo de zona.
  function publicarPunteado(){
    pendingCategory = CATEGORIA_UNICA;
    publishQuickReport({ approx: false });
  }

  async function publishQuickReport(opts){
    renderSheet(`
      <h2>Publicando…</h2>
      <div class="row-center"><div class="radar-sweep small"></div><span style="font-size:13px;color:var(--muted)">Enviando reporte rápido…</span></div>
    `, { dismissible: false });
    const id = `report_${Date.now()}_${Math.random().toString(36).slice(2,8)}`;
    const record = {
      lat: pendingLocation.lat, lng: pendingLocation.lng,
      photo: null, note: '', ts: Date.now(),
      category: pendingCategory || 'reten_fijo',
      confirms: 0, denies: 0, approx: !opts || opts.approx !== false
    };
    await stampOwnership(id, record);
    try{
      await insertReport(id, record);
      const mine = getMine(); mine.add(id); saveMine(mine);
      upsertMarker(id, record);
      updateCount();
      closeOverlay();
      registerReportTime();
      // Mismo toast con Deshacer que el flujo con foto: al publicarse de un
      // solo toque, esta es la única oportunidad de arrepentirse.
      showUndoToast(id);
    }catch(err){
      if(err instanceof NetworkError){
        enqueuePending(id, record);
        const mine = getMine(); mine.add(id); saveMine(mine);
        upsertMarker(id, record);
        updateCount();
        closeOverlay();
        registerReportTime();
        showToast('Sin conexión: se publicará cuando vuelvas a tener internet.', true);
        return;
      }
      if(err instanceof ReportRejected){
        // Lo rechazó una regla del servidor (duplicado, tope por IP): no se
        // encola ni se ofrece reintentar, porque volver a mandarlo daría lo
        // mismo. Se cierra la hoja y se explica el motivo.
        dropToken(id);
        closeOverlay();
        showToast(RECHAZO_MENSAJE[err.reason] || RECHAZO_MENSAJE.invalid, true);
        return;
      }
      // El reintento genera un id (y un token) nuevo, así que este queda
      // huérfano en localStorage si no se lo saca acá.
      dropToken(id);
      renderSheet(`
        <h2>No se pudo publicar</h2>
        <div class="error-box">Hubo un problema guardando el reporte. Intenta de nuevo.</div>
        <div class="btn-row">
          <button class="btn btn-ghost" id="cancel-btn">Cerrar</button>
          <button class="btn btn-primary" id="retry-btn">Reintentar</button>
        </div>
      `);
      document.getElementById('cancel-btn').addEventListener('click', closeOverlay);
      document.getElementById('retry-btn').addEventListener('click', publishQuickReport);
    }
  }

  const PICK_ZOOM = 18;

  // alConfirmar: qué hacer con el punto elegido. Por defecto sigue siendo la
  // hoja de categoría (el flujo con foto), pero el reporte rápido sin GPS le
  // pasa publicarPunteado para publicar directo — con una sola categoría
  // reportable, preguntarla sería elegir entre una opción.
  // EL PIN NO SE ARRASTRA: SE QUEDA FIJO EN EL CENTRO Y SE MUEVE EL MAPA.
  //
  // Es el patrón de Uber/Google Maps y reemplaza al pin arrastrable de v10.9.
  // Aquel ya había resuelto el problema de "acertá de un toque" (el dedo tapa
  // justo el lugar que querés marcar), pero arrastrando el dedo sigue estando
  // sobre el pin en el momento de soltar. Con el pin clavado al centro el
  // dedo nunca toca el punto: se mueve el mapa por debajo y se mira el
  // objetivo todo el tiempo. Además no hay nada que "agarrar", que es lo que
  // había que descubrir en el modelo anterior.
  //
  // El pin es un elemento fijo de la pantalla, NO un marcador de MapLibre: no
  // tiene coordenadas propias. El punto elegido se lee de map.getCenter() al
  // confirmar. Eso funciona porque #map ocupa la pantalla entera, así que el
  // centro del contenedor del mapa es el centro del viewport — si algún día
  // el mapa deja de ser pantalla completa, hay que recalcular esto.
  function startManualPick(alConfirmar){
    // Dónde arranca el MAPA (ya no "dónde arranca el pin"): en el punto ya
    // elegido si lo hay, si no en la ubicación del usuario, si no donde esté.
    // Casi siempre el retén está cerca, así que se ahorra el paneo inicial.
    const inicio = pendingLocation
      ? { lng: pendingLocation.lng, lat: pendingLocation.lat }
      : (lastKnownLatLng
          ? { lng: lastKnownLatLng[1], lat: lastKnownLatLng[0] }
          : map.getCenter());

    renderSheet(`
      <h2>Marca el lugar</h2>
      <p class="sub">Mueve el mapa hasta que el pin quede sobre el punto exacto.</p>
      <div class="btn-row">
        <button class="btn btn-ghost" id="cancel-btn">Cancelar</button>
        <button class="btn btn-primary" id="pick-confirm">Confirmar lugar</button>
      </div>
    `);
    document.getElementById('cancel-btn').addEventListener('click', closeOverlay);
    overlay.style.pointerEvents = 'none';
    overlay.classList.add('picking');
    overlay.querySelector('.sheet').style.pointerEvents = 'auto';
    // Ojo: la duración de flyTo en MapLibre va en milisegundos, en Leaflet
    // iba en segundos.
    map.flyTo({
      center: [inicio.lng, inicio.lat],
      zoom: Math.max(map.getZoom(), zoomFromLeaflet(PICK_ZOOM)),
      duration: 500
    });

    removePickMarker();
    pickEl = document.createElement('div');
    pickEl.className = 'pick-fijo';
    pickEl.setAttribute('aria-hidden', 'true');
    pickEl.innerHTML =
      `<div class="pick-inner"><svg viewBox="0 0 24 34"><path d="M12 0C5.37 0 0 5.37 0 12c0 9 12 22 12 22s12-13 12-22c0-6.63-5.37-12-12-12z" fill="currentColor"/><circle cx="12" cy="12" r="4.6" fill="#fff"/></svg></div>` +
      `<div class="pick-sombra"></div>`;
    document.getElementById('app').appendChild(pickEl);
    // Mientras se arrastra se levanta un poco, como si el pin flotara: es la
    // señal de que el mapa se está moviendo debajo y no el pin.
    pickMoveOn = () => pickEl && pickEl.classList.add('moviendo');
    pickMoveOff = () => pickEl && pickEl.classList.remove('moviendo');
    map.on('movestart', pickMoveOn);
    map.on('moveend', pickMoveOff);

    document.getElementById('pick-confirm').addEventListener('click', () => {
      // El punto es el centro del mapa, que es exactamente donde está la
      // punta del pin.
      const c = map.getCenter();
      pendingLocation = { lat: c.lat, lng: c.lng };
      removePickMarker();
      overlay.style.pointerEvents = '';
      // La clase 'picking' se saca ACÁ y no solo en askForCategory: mientras
      // vivía allá, cualquier camino que confirmara el pin sin pasar por la
      // hoja de categoría dejaba el overlay sin scrim ni desenfoque, así que
      // "Publicando…" se dibujaba flotando sobre el mapa a la vista.
      overlay.classList.remove('picking');
      (alConfirmar || askForCategory)();
    });
  }

  function askForCategory(){
    overlay.classList.remove('picking');
    const options = Object.entries(CATEGORIES).map(([key, cat]) => `
      <button class="cat-option" data-cat="${key}" style="--cat-color:${cat.hex};--cat-tint:${hexTint(cat.hex, 0.14)}">
        <span class="emoji">${ico(cat.icon)}</span>
        <span>${cat.label}</span>
      </button>
    `).join('');
    renderSheet(`
      <h2>¿Qué estás reportando?</h2>
      <p class="sub">Elige la categoría que mejor describe la situación.</p>
      <div class="cat-grid">${options}</div>
      <button type="button" class="link-btn" id="adjust-loc">${ico('pin')} Ajustar ubicación en el mapa</button>
      <div class="btn-row">
        <button class="btn btn-ghost" id="cancel-btn">Cancelar</button>
      </div>
    `);
    document.getElementById('cancel-btn').addEventListener('click', closeOverlay);
    // Escape hatch del atajo por GPS: si el punto automático no es exacto,
    // desde acá se abre el pin arrastrable. Al confirmarlo se vuelve a esta
    // misma hoja. Va solo en el flujo detallado: el rápido usa zona
    // aproximada a propósito (ver "Reporte rápido"), ahí no aplica.
    // Envuelto en una flecha a propósito: pasarlo pelado le entregaría el
    // MouseEvent como `alConfirmar` y al confirmar el pin intentaría llamar
    // a un evento como si fuera una función.
    document.getElementById('adjust-loc').addEventListener('click', () => startManualPick());
    overlay.querySelectorAll('.cat-option').forEach(btn => {
      btn.addEventListener('click', () => {
        pendingCategory = btn.dataset.cat;
        // Último paso del flujo detallado: publica de una, sin pantalla de
        // confirmación (ver el historial de decisiones). La red de
        // seguridad si algo salió mal es el "Deshacer" del toast.
        publishReport();
      });
    });
  }

  // Adjuntar a un reporte ya publicado. NO usa renderSheet: el reporte ya
  // está en el mapa y el usuario acaba de volver de la cámara, así que
  // abrirle una hoja modal encima sería ruido. Un toast alcanza.
  async function adjuntarFotoA(id, file){
    showToast('Subiendo foto…');
    let dataUrl;
    try{
      dataUrl = await compressImage(file);
    }catch(err){
      showToast('No se pudo procesar la imagen.', true);
      return;
    }
    const res = await attachPhotoRemote(id, dataUrl);
    if(res.ok){
      const r = reportsCache[id];
      if(r){
        r.photo = res.photo;
        upsertMarker(id, r);
        refreshDetail(id);
      }
      showToast('Foto agregada');
      return;
    }
    const MOTIVO = {
      no_token: 'Solo puedes agregarle foto a un reporte tuyo.',
      not_owner: 'Solo puedes agregarle foto a un reporte tuyo.',
      network: 'Sin conexión. Intenta de nuevo cuando tengas señal.'
    };
    showToast(MOTIVO[res.reason] || 'No se pudo agregar la foto.', true);
  }

  function askForPhoto(){
    renderSheet(`
      <h2>Primero la foto</h2>
      <p class="sub">Sácala ahora que estás en el lugar. Después marcas el punto en el mapa y eliges la categoría.</p>
      <div class="btn-row">
        <button class="btn btn-ghost" id="cancel-btn">Cancelar</button>
        <button class="btn btn-primary" id="open-camera-btn">Abrir cámara</button>
      </div>
    `);
    document.getElementById('cancel-btn').addEventListener('click', closeOverlay);
    document.getElementById('open-camera-btn').addEventListener('click', () => cameraInput.click());
  }

  // Cuando no es null, la próxima foto se ADJUNTA a ese reporte en vez de
  // arrancar el flujo de publicar. Un solo input para los dos caminos.
  let attachTargetId = null;

  cameraInput.addEventListener('change', async (e) => {
    const file = e.target.files[0];
    cameraInput.value = '';
    if(!file) return;
    if(attachTargetId){
      const id = attachTargetId;
      attachTargetId = null;
      await adjuntarFotoA(id, file);
      return;
    }
    renderSheet(`
      <h2>Procesando foto</h2>
      <div class="row-center"><div class="radar-sweep small"></div><span style="font-size:13px;color:var(--muted)">Comprimiendo imagen…</span></div>
    `, { dismissible: false });
    try{
      pendingPhoto = await compressImage(file);
      // Con GPS disponible se usa esa ubicación y se salta el paso de
      // marcar: es lo rápido por defecto. El ajuste fino sigue disponible
      // desde el enlace "Ajustar ubicación" de la hoja de categoría.
      // Sin GPS no hay alternativa: hay que marcarlo a mano.
      if(lastKnownLatLng){
        pendingLocation = { lat: lastKnownLatLng[0], lng: lastKnownLatLng[1] };
        askForCategory();
      } else {
        startManualPick();
      }
    }catch(err){
      renderSheet(`
        <h2>Error con la foto</h2>
        <div class="error-box">No se pudo procesar la imagen. Intenta de nuevo.</div>
        <div class="btn-row"><button class="btn btn-ghost" id="cancel-btn">Cerrar</button></div>
      `);
      document.getElementById('cancel-btn').addEventListener('click', closeOverlay);
    }
  });

  function compressImage(file){
    return new Promise((resolve, reject) => {
      const img = new Image();
      const reader = new FileReader();
      reader.onload = e => { img.src = e.target.result; };
      reader.onerror = reject;
      img.onload = () => {
        const maxW = 480;
        const scale = Math.min(1, maxW / img.width);
        const w = Math.round(img.width * scale);
        const h = Math.round(img.height * scale);
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.6));
      };
      img.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  // Toast con acción "Deshacer". Como el reporte se publica apenas se saca
  // la foto, sin pantalla de confirmación, esta es la única oportunidad de
  // arrepentirse si la foto salió movida o del piso. Dura más que un toast
  // normal (2.6s) porque acá hay que darle tiempo real a reaccionar.
  const UNDO_MS = 6000;
  function showUndoToast(id){
    const t = document.createElement('div');
    t.className = 'toast toast-action';
    t.setAttribute('role', 'status'); // que un lector de pantalla lo anuncie
    // La foto también se ofrece acá, no solo en la hoja de detalle. Es la
    // puerta rápida para quien va de acompañante o ya está detenido; la que
    // no tiene reloj en contra es la del detalle, porque este toast dura 6s
    // y nadie debería apurarse por una foto que es opcional.
    t.innerHTML = `<span>Reporte publicado</span>` +
      `<button type="button" class="toast-btn con-icono" data-toast="foto">` +
        `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">` +
        `<path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>` +
        `<circle cx="12" cy="13" r="4"/></svg>Foto</button>` +
      `<button type="button" class="toast-btn" data-toast="undo">Deshacer</button>`;
    document.getElementById('app').appendChild(t);
    const quitar = () => t.remove();
    // Se espera a que venza la ventana de Deshacer antes de ofrecer los
    // avisos: preguntar mientras todavía se puede deshacer taparía el botón
    // que sirve para arrepentirse, y encima le preguntaría a alguien que
    // quizá está por cancelar lo que acaba de publicar.
    const timer = setTimeout(() => { quitar(); maybeOfferPush(); }, UNDO_MS);
    t.querySelector('[data-toast="foto"]').addEventListener('click', () => {
      clearTimeout(timer);
      quitar();
      attachTargetId = id;
      cameraInput.click();
    });
    t.querySelector('[data-toast="undo"]').addEventListener('click', async () => {
      clearTimeout(timer);
      quitar();
      removeMarker(id);
      delete reportsCache[id];
      const mine = getMine(); mine.delete(id); saveMine(mine);
      // El intento no debería gastarle un cupo del anti-spam a alguien que
      // solo quiere repetir la foto.
      unregisterLastReportTime();
      updateCount();
      const ok = await deleteReportRemote(id);
      showToast(ok ? 'Reporte deshecho' : 'No se pudo deshacer el reporte.', !ok);
    });
  }

  async function publishReport(){
    renderSheet(`
      <h2>Publicando…</h2>
      <div class="row-center"><div class="radar-sweep small"></div><span style="font-size:13px;color:var(--muted)">Enviando reporte…</span></div>
    `, { dismissible: false });
    // Sin pantalla de confirmación ya no hay dónde escribir una nota: el
    // reporte detallado se apoya en la foto, que es lo que de verdad
    // comunica el retén.
    const note = '';
    const id = `report_${Date.now()}_${Math.random().toString(36).slice(2,8)}`;
    const record = {
      lat: pendingLocation.lat, lng: pendingLocation.lng,
      photo: pendingPhoto, note, ts: Date.now(),
      category: pendingCategory || 'reten_fijo',
      confirms: 0, denies: 0
    };
    // Sella la propiedad ANTES de cualquier envío: si se cae la red y el
    // record se va a la cola offline, el owner_hash tiene que viajar con él.
    await stampOwnership(id, record);
    try{
      record.photo = await uploadPhoto(id, record.photo);
      await insertReport(id, record);
      const mine = getMine(); mine.add(id); saveMine(mine);
      upsertMarker(id, record);
      updateCount();
      map.easeTo({ center: [record.lng, record.lat], zoom: zoomFromLeaflet(15), duration: 400 });
      closeOverlay();
      registerReportTime();
      showUndoToast(id);
    }catch(err){
      if(err instanceof NetworkError){
        // Si uploadPhoto falló antes de terminar, record.photo sigue
        // siendo el data: URL original — flushPendingQueue lo sube
        // recién cuando vuelva la red (ver ahí el chequeo por prefijo).
        enqueuePending(id, record); // antes de upsertMarker, para que ya se vea "pending"
        const mine = getMine(); mine.add(id); saveMine(mine);
        upsertMarker(id, record);
        updateCount();
        map.easeTo({ center: [record.lng, record.lat], zoom: zoomFromLeaflet(15), duration: 400 });
        closeOverlay();
        registerReportTime();
        showToast('Sin conexión: el reporte se publicará solo cuando vuelvas a tener internet.', true);
        return;
      }
      if(err instanceof ReportRejected){
        // Ver el comentario equivalente en publishQuickReport. La foto ya
        // subió a Storage y queda huérfana en el bucket: mismo caso ya
        // asumido en "Subir fotos" (CLAUDE.md), no hay forma de borrarla
        // desde el cliente desde v12.0.
        dropToken(id);
        closeOverlay();
        showToast(RECHAZO_MENSAJE[err.reason] || RECHAZO_MENSAJE.invalid, true);
        return;
      }
      // El reintento genera un id (y un token) nuevo, así que este queda
      // huérfano en localStorage si no se lo saca acá.
      dropToken(id);
      renderSheet(`
        <h2>No se pudo publicar</h2>
        <div class="error-box">Hubo un problema guardando el reporte. Intenta de nuevo.</div>
        <div class="btn-row">
          <button class="btn btn-ghost" id="cancel-btn">Cerrar</button>
          <button class="btn btn-primary" id="retry-btn">Reintentar</button>
        </div>
      `);
      document.getElementById('cancel-btn').addEventListener('click', closeOverlay);
      document.getElementById('retry-btn').addEventListener('click', publishReport);
    }
  }

  // ---- Hoja "Acerca de" ----
  // Hasta v17.8 la app no tenía NINGÚN canal de contacto: alguien que
  // encontrara un problema el día 1 no tenía a dónde escribir. Esta hoja
  // resuelve eso y dos cosas más que hacían falta igual:
  //
  //  1. Privacidad. La app pide GPS y notificaciones, y guarda lat/lng en
  //     push_subscriptions. Pedir esos dos permisos sin decir qué se hace con
  //     ellos es justo lo que empuja a rechazarlos. Y acá hay algo real que
  //     contar: no hay cuentas, los reportes se autoexpiran y la IP se guarda
  //     hasheada y SIN vínculo con el reporte (ver "Anti-spam del lado del
  //     servidor" en CLAUDE.md) — o sea que ni con la base entera se puede
  //     saber quién reportó qué.
  //  2. Encuadre. Que quede por escrito que los reportes los publica la
  //     comunidad y no están verificados, y que no se use el teléfono
  //     manejando. Dos líneas, y es lo honesto.
  //
  // El correo NO va escrito entero en ningún lado del archivo: se arma en
  // tiempo de ejecución desde dos constantes. Una página pública indexada se
  // scrapea, y un mailto en texto plano en el fuente es spam garantizado.
  const CONTACTO_USUARIO = 'manuelbis1996';
  const CONTACTO_DOMINIO = 'gmail.com';
  const CONTACTO_GITHUB  = 'manuelbis1996';
  const correoContacto = () => CONTACTO_USUARIO + String.fromCharCode(64) + CONTACTO_DOMINIO;

  function openAboutSheet(){
    const correo = correoContacto();
    renderSheet(`
      <h2>Acerca de AMET Radar</h2>
      <p class="sub">Reportes de retenes de tránsito en La Vega, hechos por la comunidad.</p>

      <div class="about-sec">
        <h3 class="about-h">${ico('ojo')} Cómo funciona</h3>
        <p>Cuando alguien ve un retén lo marca en el mapa, y el resto puede confirmar si sigue ahí o si ya no está. Los reportes <b>se borran solos</b> a las pocas horas, así que lo que ves es lo que está pasando ahora.</p>
        <div class="about-nota" style="margin-top:10px;">
          <p><b>Ojo:</b> los reportes los publica la gente, no están verificados y pueden estar equivocados o desactualizados. <b>No uses el teléfono mientras manejas.</b></p>
        </div>
      </div>

      <div class="about-sec">
        <h3 class="about-h">${ico('escudoOk')} Tu privacidad</h3>
        <p>La app funciona <b>sin cuentas y sin registro</b>: nunca te pedimos tu nombre, tu teléfono ni tu correo.</p>
        <ul class="about-list">
          <li>Tu ubicación se usa para mostrarte el mapa y para avisarte si hay un retén cerca. <b>No se guarda tu recorrido.</b></li>
          <li>Al publicar un reporte se guarda solo el punto, la hora y la categoría. <b>No queda registrado quién lo publicó.</b></li>
          <li>Para frenar el spam se guarda una huella de tu conexión, <b>cifrada y sin ningún vínculo con tu reporte</b>.</li>
          <li>Si activas los avisos guardamos la última zona donde estuviste, para saber a quién avisarle. Puedes desactivarlos cuando quieras desde la campana.</li>
        </ul>
      </div>

      <div class="about-sec">
        <h3 class="about-h">${ico('codigo')} Quién la hizo</h3>
        <p>La hizo <b>Manuelbis</b>, ingeniero en software. Es un proyecto propio, gratis y sin publicidad, hecho para La Vega.</p>
        <p>¿Encontraste un error, tienes una idea, o quieres que trabajemos juntos en un proyecto? Escríbeme:</p>
        <div class="about-contacto">
          <a id="about-mail" href="mailto:${correo}?subject=AMET%20Radar">${ico('correo')}<span>${correo}</span></a>
          <a href="https://github.com/${CONTACTO_GITHUB}" target="_blank" rel="noopener">${ico('codigo')}<span>github.com/${CONTACTO_GITHUB}</span></a>
        </div>
      </div>

      <div class="btn-row" style="margin-top:18px;">
        <button class="btn btn-primary" id="about-ok" style="width:100%;">Cerrar</button>
      </div>
      <p class="about-ver">Versión ${APP_VERSION}</p>
    `);
    document.getElementById('about-ok').addEventListener('click', closeOverlay);
  }
  document.getElementById('about-btn').addEventListener('click', openAboutSheet);

  // ---- Bienvenida, una sola vez ----
  // Al abrir la app por primera vez no había nada que explicara para qué
  // sirve: solo un mapa y dos botones. Va acá abajo del todo a propósito,
  // porque necesita `overlay`/`renderSheet`/`closeOverlay` ya definidos.
  const ONBOARDED_KEY = 'amet_onboarded_v1';
  function maybeShowWelcome(){
    let seen = false;
    try{ seen = !!localStorage.getItem(ONBOARDED_KEY); }catch(e){}
    if(seen) return;
    try{ localStorage.setItem(ONBOARDED_KEY, '1'); }catch(e){}
    renderSheet(`
      <h2>Bienvenido a AMET Radar</h2>
      <p class="sub">Reportes de retenes de tránsito en La Vega, hechos por la comunidad.</p>
      <ul class="welcome-list">
        <li><b>${ico('ojo')} Mira el mapa</b> — cada punto es un reporte activo de otra persona.</li>
        <li><b>${ico('megafono')} Reporta</b> — si ves un retén, toca "Reportar aquí" y se publica al instante. Un solo toque. Con el pin de al lado podés marcar otro punto del mapa.</li>
        <li><b>${ico('pulgarArriba')} Confirma</b> — toca un reporte para decir si sigue ahí o si ya no está.</li>
        <li><b>${ico('campana')} Activa los avisos</b> — con la campana de arriba te avisamos si hay un retén cerca, aunque tengas la app cerrada.</li>
      </ul>
      <div class="btn-row" style="margin-bottom:10px;">
        <button class="btn btn-primary" id="welcome-ok" style="width:100%;">Entendido</button>
      </div>
      <button class="mini-btn primary" style="width:100%;" id="welcome-share">Compartir con mis contactos</button>
      <button class="sheet-link" id="welcome-about">Quién hizo esta app y qué datos usa</button>
    `);
    document.getElementById('welcome-ok').addEventListener('click', closeOverlay);
    // El botón ⓘ de la topbar es la vía permanente, pero acá está la única
    // atención garantizada que tiene la app: quien llega nuevo se entera de
    // que hay alguien detrás y de qué se guarda, sin tener que buscarlo.
    document.getElementById('welcome-about').addEventListener('click', openAboutSheet);
    // La app se hace conocida por boca a boca; este es el único momento
    // garantizado de atención que tiene, y sin reportes en el mapa el botón
    // de compartir de la ficha no existe todavía.
    document.getElementById('welcome-share').addEventListener('click', () => {
      closeOverlay();
      compartirApp();
    });
  }
  // Quien llega por un link compartido (?r=) TAMBIÉN tiene que ver la
  // bienvenida: es el vector por el que entra la gente nueva y hasta v16.4 era
  // el único que se quedaba sin ninguna explicación de qué es la app. Lo que
  // sigue valiendo —y por eso no alcanza con borrar el `return`— es no tapar
  // el reporte compartido, que es su contexto. Así que se difiere hasta que
  // cierre esa ficha, en vez de saltearse.
  //
  // El camino normal (sin ?r=) sigue siendo síncrono y en el mismo lugar de
  // antes, a propósito: la bienvenida tiene que abrirse ANTES de que el
  // primer sondeo intente mostrar la píldora de "Todo tranquilo", si no la
  // píldora se muestra, renderSheet la tapa, y ya no vuelve a aparecer.
  function programarBienvenida(){
    const deepLink = new URLSearchParams(location.search).get('r')
      || (location.hash.match(/r=([^&]+)/) || [])[1];
    if(!deepLink){ maybeShowWelcome(); return; }
    reportsReady.then(() => setTimeout(() => {
      // La ficha puede no haberse abierto nunca (reporte ya vencido): ahí no
      // hay nada que esperar y la bienvenida va igual.
      if(detailEl.hidden){ maybeShowWelcome(); return; }
      detailEl.addEventListener('click', function alCerrar(e){
        if(!e.target.closest('.detail-backdrop, .detail-close')) return;
        detailEl.removeEventListener('click', alCerrar);
        setTimeout(maybeShowWelcome, 350);
      });
    }, 600));
  }
  programarBienvenida();

  // ---- Instalar la app en la pantalla de inicio ----
  //
  // POR QUÉ IMPORTA. La app es instalable desde siempre (manifest + service
  // worker) pero nunca lo sugería, así que se quedaba en pestaña del
  // navegador. Instalada cambia dos cosas concretas: queda un ícono en la
  // pantalla de inicio (deja de depender de que se acuerden de la URL) y las
  // notificaciones push funcionan de verdad — que es el único mecanismo de
  // retención que tiene el proyecto.
  //
  // CUÁNDO SE OFRECE. En la SEGUNDA apertura, no en la primera. Quien vuelve
  // ya mostró interés, y así no se encima con la bienvenida ni con la oferta
  // de avisos (que llega después del primer reporte). Sigue respetando
  // "onboarding discreto, sin banner/modal al abrir": no hay nada al abrir la
  // primera vez, y esto se muestra UNA sola vez y se puede ignorar.
  const INSTALL_KEY = 'amet_install_asked_v1';
  const APERTURAS_KEY = 'amet_aperturas_v1';
  let promptInstalar = null;

  function yaInstalada(){
    return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)
      || window.navigator.standalone === true;
  }
  // iOS no tiene beforeinstallprompt NI forma de disparar la instalación desde
  // la página: la única vía es explicarle al usuario dónde está la opción.
  function esIOS(){
    return /iphone|ipad|ipod/i.test(navigator.userAgent)
      && !/crios|fxios/i.test(navigator.userAgent);
  }
  function aperturas(){
    try{
      const n = (parseInt(localStorage.getItem(APERTURAS_KEY), 10) || 0) + 1;
      localStorage.setItem(APERTURAS_KEY, String(n));
      return n;
    }catch(e){ return 1; }
  }
  const APERTURAS = aperturas();

  function marcarInstalarPreguntado(){
    try{ localStorage.setItem(INSTALL_KEY, '1'); }catch(e){}
  }

  function quizasOfrecerInstalar(){
    if(yaInstalada()) return;
    if(APERTURAS < 2) return;              // recién en la segunda vuelta
    if(!promptInstalar && !esIOS()) return; // el navegador no la puede instalar
    try{ if(localStorage.getItem(INSTALL_KEY)) return; }catch(e){ return; }
    const ov = document.getElementById('flow-overlay');
    if(ov && !ov.hidden) return;            // no encimarle una hoja a otra
    if(!detailEl.hidden) return;            // ni tapar un reporte compartido
    marcarInstalarPreguntado();

    if(promptInstalar){
      renderSheet(`
        <h2>Tenla a mano</h2>
        <p class="sub">Instálala en tu pantalla de inicio: se abre de un toque, arranca aun sin señal, y los avisos de retenes te llegan con la app cerrada.</p>
        <div class="btn-row">
          <button class="btn btn-ghost" id="inst-no">Ahora no</button>
          <button class="btn btn-primary" id="inst-si">Instalar</button>
        </div>
      `);
      document.getElementById('inst-no').addEventListener('click', closeOverlay);
      document.getElementById('inst-si').addEventListener('click', async () => {
        closeOverlay();
        const p = promptInstalar;
        promptInstalar = null; // el evento se puede usar UNA sola vez
        try{ await p.prompt(); }catch(e){}
      });
      return;
    }

    // iOS: no hay API, solo se puede señalar dónde está.
    renderSheet(`
      <h2>Tenla a mano</h2>
      <p class="sub">En iPhone se agrega desde el navegador: toca <b>Compartir</b> abajo y después <b>Añadir a pantalla de inicio</b>.</p>
      <div class="btn-row">
        <button class="btn btn-primary" id="inst-ok" style="width:100%;">Entendido</button>
      </div>
    `);
    document.getElementById('inst-ok').addEventListener('click', closeOverlay);
  }

  window.addEventListener('beforeinstallprompt', (e) => {
    // Sin preventDefault, Chrome muestra su propia barra de instalación y
    // perdemos el control de cuándo se pregunta.
    e.preventDefault();
    promptInstalar = e;
    quizasOfrecerInstalar();
  });
  window.addEventListener('appinstalled', () => {
    promptInstalar = null;
    marcarInstalarPreguntado();
  });
  // En iOS el evento no existe, así que hay que intentarlo por tiempo. Se
  // espera a que la bienvenida y el primer sondeo hayan pasado.
  if(esIOS()) setTimeout(quizasOfrecerInstalar, 2500);

  // ---- PWA: service worker (requiere servir por http/https, no file://) ----
  if('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')){
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
})();
</script>
