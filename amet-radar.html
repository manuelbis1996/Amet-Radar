<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1014" media="(prefers-color-scheme: dark)">
<meta name="description" content="Reportes comunitarios de retenes de tránsito en tiempo real en Santo Domingo.">
<meta property="og:type" content="website">
<meta property="og:title" content="AMET Radar">
<meta property="og:description" content="Reportes comunitarios de retenes de tránsito en tiempo real en Santo Domingo.">
<meta property="og:url" content="https://amet-radar.manuelbis1996.workers.dev/">
<meta property="og:image" content="https://amet-radar.manuelbis1996.workers.dev/icon-512.png">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="AMET Radar">
<meta name="twitter:description" content="Reportes comunitarios de retenes de tránsito en tiempo real en Santo Domingo.">
<meta name="twitter:image" content="https://amet-radar.manuelbis1996.workers.dev/icon-512.png">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>AMET Radar</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /*
    Diseño: el mapa ES la app. Todo lo demás flota encima en superficies
    limpias, para no robarle alto a la pantalla en un teléfono — que es
    donde se va a usar casi siempre, muchas veces con una sola mano y de
    reojo mientras se maneja.

    Tema automático (prefers-color-scheme): claro de día, para que se lea
    con sol; oscuro de noche, para no encandilar. El mapa en sí es la
    excepción: siempre usa tiles claros (a pedido), de día y de noche.

    Reglas que se respetan en todo el archivo:
    - Ningún control primario mide menos de var(--tap) = 44px de alto.
    - Todo lo que flota respeta las safe areas (muesca y barra de gestos).
    - Un solo acento (--brand) para la acción principal; el resto del
      color lo aportan las categorías de reporte, nunca la decoración.
  */
  :root{
    --brand:#f59e0b;   --on-brand:#1b1206;
    --bg:#e9ecef;
    --surface:#ffffff;
    --surface-2:#f2f4f7;
    --text:#15171c;
    --muted:#6b7280;
    --line:#e3e6ea;
    --danger:#d92d20;
    --info:#2563eb;
    --scrim:rgba(15,17,22,.45);
    --shadow-1:0 1px 2px rgba(16,18,25,.07), 0 4px 14px rgba(16,18,25,.11);
    --shadow-2:0 10px 34px rgba(16,18,25,.20);
    --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    --r-md:14px; --r-lg:20px; --r-xl:26px;
    --tap:44px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --brand:#ffb020; --on-brand:#14161a;
      --bg:#0e1014;
      --surface:#171a21;
      --surface-2:#212630;
      --text:#f2f3f5;
      --muted:#9aa2ae;
      --line:#2a2f3a;
      --danger:#ff6b5e;
      --info:#5b9cff;
      --scrim:rgba(0,0,0,.58);
      --shadow-1:0 1px 2px rgba(0,0,0,.42), 0 4px 16px rgba(0,0,0,.48);
      --shadow-2:0 12px 36px rgba(0,0,0,.62);
    }
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{
    margin:0; padding:0; height:100%; background:var(--bg);
    font-family:var(--font); color:var(--text); overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  #app{ position:fixed; inset:0; }
  ::selection{ background:var(--brand); color:var(--on-brand); }
  button{ font-family:inherit; }

  /* ---- Mapa: capa base, ocupa todo ---- */
  #map{ position:absolute; inset:0; z-index:0; background:var(--bg); }
  .leaflet-container{ background:var(--bg); font-family:var(--font); }

  #map-loader{
    position:absolute; inset:0; z-index:450; background:var(--bg);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px;
    font-size:13.5px; font-weight:500; color:var(--muted);
  }
  #map-loader[hidden]{ display:none; }

  .radar-sweep{
    width:40px; height:40px; border-radius:50%; flex-shrink:0;
    border:3px solid var(--line); border-top-color:var(--brand);
    animation: spin .9s linear infinite;
  }
  .radar-sweep.small{ width:22px; height:22px; border-width:2.5px; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* ---- Barra superior flotante ----
     El contenedor no intercepta toques (pointer-events:none) para que se
     pueda arrastrar el mapa por los huecos entre las píldoras; solo los
     controles reales reciben el toque. */
  #top{
    position:absolute; top:0; left:0; right:0; z-index:500;
    padding: calc(env(safe-area-inset-top, 0px) + 10px) 12px 0;
    display:flex; flex-direction:column; gap:9px;
    pointer-events:none;
  }
  .topbar{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .brand{
    pointer-events:auto;
    display:flex; align-items:center; gap:9px; min-height:var(--tap);
    background:var(--surface); border-radius:999px; padding:0 15px 0 11px;
    box-shadow:var(--shadow-1);
  }
  .brand-dot{
    width:9px; height:9px; border-radius:50%; background:var(--brand); flex-shrink:0;
    box-shadow:0 0 0 4px rgba(245,158,11,.18);
  }
  .brand-name{ font-size:15px; font-weight:700; letter-spacing:-.2px; white-space:nowrap; }
  .version-tag{ font-size:10px; font-weight:500; color:var(--muted); margin-left:1px; }
  .brand-count{
    display:inline-flex; align-items:center; gap:4px; margin-left:2px;
    padding-left:10px; border-left:1px solid var(--line);
    font-size:12px; color:var(--muted); white-space:nowrap;
  }
  .brand-count b{ font-size:14px; font-weight:700; color:var(--text); font-variant-numeric:tabular-nums; }

  #push-toggle-btn{
    pointer-events:auto; flex-shrink:0;
    width:var(--tap); height:var(--tap); border-radius:50%;
    background:var(--surface); border:none; color:var(--muted);
    box-shadow:var(--shadow-1);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; transition:transform .14s ease, color .14s ease;
  }
  #push-toggle-btn svg{ width:19px; height:19px; }
  #push-toggle-btn:active{ transform:scale(.9); }
  #push-toggle-btn[data-state="active"]{ color:var(--brand); }
  #push-toggle-btn[data-state="loading"]{ opacity:.5; cursor:default; }
  #locate-btn[data-state="active"]{ color:var(--brand); }
  #push-toggle-btn[hidden]{ display:none; }

  /* ---- Chips de filtro ---- */
  #filters{
    display:flex; gap:8px; overflow-x:auto; padding:1px 0 5px;
    -webkit-overflow-scrolling:touch; scrollbar-width:none;
  }
  #filters::-webkit-scrollbar{ display:none; }
  .chip{
    pointer-events:auto; flex-shrink:0;
    display:inline-flex; align-items:center; gap:6px; min-height:40px;
    padding:0 15px; border-radius:999px; border:none;
    background:var(--surface); color:var(--text); box-shadow:var(--shadow-1);
    font-size:13px; font-weight:600; white-space:nowrap; cursor:pointer;
    transition:transform .12s ease, opacity .15s ease;
  }
  .chip:active{ transform:scale(.95); }
  /* Activo = tinte suave del color de la categoría + anillo de ese color.
     Rellenarlos a full saturación se veía como una pared de color, porque
     las 4 categorías arrancan activas. El tinte lo calcula el JS a partir
     del hex (--chip-tint) porque en CSS haría falta color-mix(). */
  .chip[aria-pressed="true"]{
    background-image:linear-gradient(var(--chip-tint, transparent), var(--chip-tint, transparent));
    box-shadow:var(--shadow-1), inset 0 0 0 1.5px var(--chip-color, var(--brand));
  }
  .chip[aria-pressed="false"]{ opacity:.5; }

  /* ---- Marcadores ---- */
  .amet-pin{
    width:38px; height:38px; display:flex; align-items:center; justify-content:center;
    filter: drop-shadow(0 3px 6px rgba(0,0,0,.32));
  }
  .amet-pin .badge{
    width:36px; height:36px; border-radius:50%;
    border:3px solid var(--surface);
    display:flex; align-items:center; justify-content:center; font-size:16px;
  }
  .amet-pin.stale .badge{ filter:grayscale(1); opacity:.7; }
  .amet-pin.pending .badge{ opacity:.6; border-style:dashed; }

  .me-marker{ width:22px; height:22px; }
  .me-dot{
    width:16px; height:16px; border-radius:50%; background:var(--info);
    border:3px solid #fff; box-shadow:0 0 0 4px rgba(37,99,235,.30);
    animation: me-pulse 2s ease-out infinite;
  }
  @keyframes me-pulse{
    0%{ box-shadow:0 0 0 4px rgba(37,99,235,.30); }
    70%{ box-shadow:0 0 0 13px rgba(37,99,235,0); }
    100%{ box-shadow:0 0 0 4px rgba(37,99,235,0); }
  }

  /* ---- Botones flotantes inferiores ---- */
  #fab-row{
    position:absolute; left:0; right:0; z-index:400;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 18px);
    display:flex; align-items:center; justify-content:center; gap:12px; padding:0 16px;
  }
  #locate-btn{
    width:52px; height:52px; border-radius:50%; flex-shrink:0; border:none;
    background:var(--surface); color:var(--text); box-shadow:var(--shadow-1);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; transition:transform .14s ease;
  }
  #locate-btn svg{ width:21px; height:21px; }
  #locate-btn:active{ transform:scale(.92); }
  #report-btn{
    min-height:56px; padding:0 26px; border:none; border-radius:999px;
    background:var(--brand); color:var(--on-brand);
    font-size:15.5px; font-weight:700; letter-spacing:-.1px;
    display:flex; align-items:center; gap:9px;
    box-shadow:var(--shadow-2); cursor:pointer;
    transition:transform .14s ease;
  }
  #report-btn svg{ width:19px; height:19px; flex-shrink:0; }
  #report-btn:active{ transform:scale(.96); }
  #report-btn:disabled{ background:var(--surface-2); color:var(--muted); box-shadow:none; cursor:default; }

  /* ---- Hojas inferiores (detalle de reporte y flujo de publicación) ---- */
  #detail, #flow-overlay{
    position:absolute; inset:0; z-index:1000;
    display:flex; align-items:flex-end; justify-content:center;
    background:var(--scrim);
    -webkit-backdrop-filter:blur(2px); backdrop-filter:blur(2px);
  }
  #detail[hidden], #flow-overlay[hidden]{ display:none; }
  /* Mientras se elige el punto en el mapa ("Marca el lugar") el overlay
     tiene que dejar ver Y tocar el mapa: sin scrim ni desenfoque, solo la
     hoja de instrucciones abajo. */
  #flow-overlay.picking{ background:transparent; -webkit-backdrop-filter:none; backdrop-filter:none; }
  .detail-backdrop{ position:absolute; inset:0; }

  .sheet, .detail-panel{
    position:relative; background:var(--surface);
    width:100%; max-width:520px;
    border-radius:var(--r-xl) var(--r-xl) 0 0;
    padding:9px 18px calc(env(safe-area-inset-bottom, 0px) + 18px);
    max-height:86dvh; overflow-y:auto; -webkit-overflow-scrolling:touch;
    box-shadow:var(--shadow-2);
    animation: sheet-up .24s cubic-bezier(.22,1,.36,1);
  }
  @keyframes sheet-up{ from{ transform:translateY(18px); opacity:.5; } to{ transform:none; opacity:1; } }
  .grabber{ width:38px; height:4px; border-radius:999px; background:var(--line); margin:2px auto 14px; }

  .sheet h2{ font-size:19px; font-weight:700; letter-spacing:-.3px; margin:0 0 5px; }
  .sheet p.sub{ margin:0 0 16px; font-size:14px; color:var(--muted); line-height:1.45; }
  .row-center{ display:flex; align-items:center; gap:12px; }

  /* ---- Detalle del reporte ---- */
  .detail-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px; }
  .cat-label{
    display:inline-flex; align-items:center; gap:6px;
    padding:7px 13px; border-radius:999px;
    font-size:13px; font-weight:700; letter-spacing:-.1px;
  }
  .detail-close{
    width:36px; height:36px; flex-shrink:0; border:none; border-radius:50%;
    background:var(--surface-2); color:var(--muted);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .detail-close svg{ width:17px; height:17px; }
  .detail-photo{
    width:100%; display:block; margin-bottom:13px;
    border-radius:var(--r-md); aspect-ratio:4/3; object-fit:cover; background:var(--surface-2);
  }
  .detail-meta{ font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .detail-note{ font-size:15.5px; line-height:1.45; margin-top:7px; }

  .votes{ display:flex; gap:10px; margin-top:17px; }
  .vote-btn{
    flex:1; min-height:56px; border-radius:var(--r-md);
    border:1px solid var(--line); background:var(--surface-2); color:var(--text);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;
    font-size:12.5px; font-weight:600; cursor:pointer; transition:transform .12s ease;
  }
  .vote-btn b{ font-size:16px; font-weight:700; font-variant-numeric:tabular-nums; }
  .vote-btn:active{ transform:scale(.96); }
  .mini-actions{ display:flex; gap:10px; margin-top:10px; }
  .mini-btn{
    flex:1; min-height:var(--tap); border-radius:var(--r-md);
    border:1px solid var(--line); background:transparent; color:var(--muted);
    font-size:13.5px; font-weight:600; cursor:pointer; transition:transform .12s ease;
  }
  .mini-btn:active{ transform:scale(.97); }
  .mini-btn.danger{ color:var(--danger); border-color:rgba(217,45,32,.32); }

  /* ---- Flujo de publicación ---- */
  .cat-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px; }
  .cat-option{
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:7px;
    min-height:96px; background:var(--surface-2); border:1px solid var(--line);
    border-radius:var(--r-lg); padding:14px 8px; cursor:pointer;
    color:var(--text); font-size:13.5px; font-weight:600; text-align:center;
    transition:transform .12s ease;
  }
  .cat-option span.emoji{ font-size:26px; }
  .cat-option:active{ transform:scale(.96); }

  .preview-photo{
    width:100%; border-radius:var(--r-md); margin-bottom:13px;
    aspect-ratio:4/3; object-fit:cover; background:var(--surface-2);
  }
  textarea{
    width:100%; background:var(--surface-2); border:1px solid var(--line);
    border-radius:var(--r-md); color:var(--text); padding:13px;
    font-family:var(--font); font-size:15px; resize:none; margin-bottom:14px;
  }
  textarea::placeholder{ color:var(--muted); }
  textarea:focus{ outline:2px solid var(--brand); outline-offset:-1px; }

  .btn-row{ display:flex; gap:10px; }
  .btn{
    flex:1; min-height:52px; border:none; border-radius:var(--r-md);
    font-family:var(--font); font-size:15px; font-weight:700; letter-spacing:-.1px;
    cursor:pointer; transition:transform .14s ease;
  }
  .btn-primary{ background:var(--brand); color:var(--on-brand); }
  .btn-ghost{ background:var(--surface-2); color:var(--text); border:1px solid var(--line); }
  .btn:active{ transform:scale(.97); }
  .btn:disabled{ opacity:.45; cursor:default; }

  .error-box{
    background:rgba(217,45,32,.10); border:1px solid rgba(217,45,32,.35); color:var(--danger);
    padding:12px 13px; border-radius:var(--r-md); font-size:13.5px; margin-bottom:14px; line-height:1.4;
  }

  /* ---- Toast: abajo, cerca del pulgar ---- */
  .toast{
    position:absolute; left:50%; transform:translateX(-50%);
    bottom: calc(env(safe-area-inset-bottom, 0px) + 88px);
    background:var(--text); color:var(--surface);
    padding:12px 20px; border-radius:999px;
    font-size:13.5px; font-weight:600; text-align:center; max-width:86%;
    box-shadow:var(--shadow-2); z-index:1100;
    animation: toast-in .22s ease;
  }
  .toast.warn{ background:var(--danger); color:#fff; }
  @keyframes toast-in{ from{ opacity:0; transform:translate(-50%, 8px); } to{ opacity:1; transform:translate(-50%, 0); } }

  #camera-input{ display:none; }

  /* Pantallas muy angostas: que el botón principal no empuje al de ubicación */
  @media (max-width: 359px){
    #report-btn{ padding:0 18px; font-size:14.5px; }
    .brand-count{ display:none; }
  }

  @media (prefers-reduced-motion: reduce){
    .me-dot, .toast, .radar-sweep, .sheet, .detail-panel{ animation:none; }
    *{ transition:none !important; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="map">
    <div id="map-loader"><div class="radar-sweep"></div><span>Buscando tu ubicación…</span></div>
  </div>

  <div id="top">
    <div class="topbar">
      <div class="brand">
        <span class="brand-dot"></span>
        <span class="brand-name">AMET Radar<span class="version-tag" id="app-version"></span></span>
        <span class="brand-count"><b id="stat-count">0</b>en vista</span>
      </div>
      <button id="push-toggle-btn" data-state="inactive" aria-label="Avisarme de retenes cerca" title="Avisarme de retenes cerca" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      </button>
    </div>
    <div id="filters" role="group" aria-label="Filtrar por categoría"></div>
  </div>

  <div id="fab-row">
    <button id="locate-btn" aria-label="Centrar mapa en mi ubicación" title="Centrar en mi ubicación">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>
    </button>
    <button id="report-btn" aria-label="Reportar ubicación de un retén">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M12 3 2 20h20L12 3z"/><path d="M12 10v4"/><circle cx="12" cy="17" r="0.6" fill="currentColor" stroke="none"/></svg>
      <span>Reportar ubicación</span>
    </button>
  </div>

  <input type="file" id="camera-input" accept="image/*" capture="environment">

  <!-- Detalle de un reporte: hoja inferior en vez del popup de Leaflet.
       En un teléfono un globito de ~216px es incómodo (foto chica, botones
       apretados); la hoja da lugar real y queda al alcance del pulgar. -->
  <div id="detail" hidden>
    <div class="detail-backdrop"></div>
    <div class="detail-panel"></div>
  </div>

  <div id="flow-overlay" hidden></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(function(){
  // Debe coincidir a mano con el sufijo de CACHE_NAME en sw.js (ver
  // CLAUDE.md): al subir uno, subir el otro. Se muestra en el header para
  // poder confirmar a simple vista que una PWA instalada ya tomó la
  // versión nueva del service worker, sin tener que abrir devtools.
  const APP_VERSION = 'v9.5';
  const DEFAULT_CENTER = [18.4861, -69.9312]; // Santo Domingo
  const APPROX_RADIUS_METERS = 150; // radio del círculo de zona aproximada (reporte rápido)

  // Parámetros del sistema: valores por defecto, sobreescritos al arrancar
  // por la fila única de public.app_config en Supabase (editable desde el
  // panel admin en admin.html). Se leen en tiempo de ejecución, no se
  // capturan, así que ajustar CONFIG acá adentro alcanza para que todo el
  // código de abajo los use.
  const CONFIG = {
    staleMinutes: 180,    // a partir de aqui se consideran "viejos"
    maxAgeMinutes: 360,   // se ocultan/borran pasado este tiempo
    denyThreshold: 2,     // (negaciones - confirmaciones) para retirar antes
    reportLimit: 3,       // reportes máximos por ventana
    reportWindowMin: 60
  };

  // hex: color plano de la categoría — se usa igual en tema claro y oscuro
  // (los círculos SVG de Leaflet necesitan un color literal, no var()).
  // ink: color de texto legible ENCIMA de ese hex, para los chips activos
  // y la etiqueta de categoría; elegido para que el contraste aguante en
  // ambos temas sin tener dos paletas de categorías.
  const CATEGORIES = {
    reten_fijo:  { label:'Retén fijo',      emoji:'👮', hex:'#f59e0b', ink:'#1b1206' },
    reten_movil: { label:'Retén móvil',     emoji:'🚓', hex:'#0f766e', ink:'#ffffff' },
    accidente:   { label:'Accidente',       emoji:'⚠️', hex:'#d92d20', ink:'#ffffff' },
    control:     { label:'Control tránsito',emoji:'🚦', hex:'#2563eb', ink:'#ffffff' }
  };
  const activeCategories = new Set(Object.keys(CATEGORIES));

  document.getElementById('app-version').textContent = APP_VERSION;

  // ---- Backend compartido (Supabase) ----
  // Los reportes viven en la tabla `reports` de un proyecto Supabase (no en
  // localStorage ni en un archivo del servidor), así que cualquier
  // dispositivo que entre a esta app ve los mismos reportes sin depender de
  // que una PC en particular esté prendida. La SUPABASE_ANON_KEY es una
  // publishable key: está pensada para vivir en el cliente, el control de
  // acceso real lo hacen las políticas RLS de la tabla. reportsCache es la
  // copia en memoria del cliente, refrescada al cargar y luego por sondeo
  // periódico (ver refreshReports).
  const SUPABASE_URL = 'https://nikexwjxxcxzhsuypsjn.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_p8U6gvvBwPVHdfmspjyCXA_g6clP58v';

  // ---- Preferencias de este dispositivo (siguen siendo locales) ----

  // reload; pendingIds es un derivado en memoria para lookups O(1).
  const PENDING_KEY = 'amet_pending_queue_v1';
  function getPendingQueue(){ try{ return JSON.parse(localStorage.getItem(PENDING_KEY)||'[]'); }catch(e){ return []; } }
  function savePendingQueue(list){ localStorage.setItem(PENDING_KEY, JSON.stringify(list)); }

  let pendingQueue = getPendingQueue();
  let pendingIds = new Set(pendingQueue.map(p => p.id));

  // Sin zoomControl: en un teléfono los botones +/- sobran (se hace pinch)
  // y ocupan una esquina que preferimos dejar al mapa.

  const markersById = {};

  let pendingPhoto = null;

  function timeAgo(ts){
    const min = Math.floor((Date.now()-ts)/60000);
    if(min < 1) return 'justo ahora';
    if(min < 60) return `hace ${min} min`;
    const h = Math.floor(min/60);
    if(h < 24) return `hace ${h} h`;
    return `hace ${Math.floor(h/24)} d`;
  }

  // Desplaza un punto una distancia aleatoria (entre minMeters y maxMeters)
  // en una dirección aleatoria. El reporte rápido la usa solo para variar
  // el centro del círculo de zona; la imprecisión real la da el radio
  // (APPROX_RADIUS_METERS) que se dibuja alrededor, no este desplazamiento.
  // Distancia real entre dos puntos (Haversine) — usada para decidir si
  // vale la pena reportar la nueva posición de la suscripción push, no
  // para nada relacionado al jitter de abajo.
  function distanceMeters(lat1, lng1, lat2, lng2){
    const R = 6371000;
    const toRad = d => d * Math.PI / 180;
    const dLat = toRad(lat2 - lat1);
    const dLng = toRad(lng2 - lng1);
    const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng/2)**2;
    return 2 * R * Math.asin(Math.sqrt(a));
  }

  function jitterLocation(lat, lng, minMeters, maxMeters){
    const angle = Math.random() * Math.PI * 2;
    const dist = minMeters + Math.random() * (maxMeters - minMeters);
    const dLat = (dist * Math.cos(angle)) / 111320;
    const dLng = (dist * Math.sin(angle)) / (111320 * Math.cos(lat * Math.PI / 180));
    return { lat: lat + dLat, lng: lng + dLng };
  }

  function makeIcon(ageMinutes, category, pending){

  function upsertApproxCircle(id, r){
    const ageMinutes = (Date.now()-r.ts)/60000;
    const pending = pendingIds.has(id);
    const cat = CATEGORIES[r.category] || CATEGORIES.reten_fijo;

    if(r.approx) return upsertApproxCircle(id, r);
    const ageMinutes = (Date.now()-r.ts)/60000;

  // ---- Renderizado por zona visible + limpieza de vencidos ----
  function renderVisibleMarkers(){
    const bounds = map.getBounds().pad(0.25);
    const now = Date.now();

    for(const id in reportsCache){
      const r = reportsCache[id];
      const ageMinutes = (now - r.ts) / 60000;
      if(ageMinutes > CONFIG.maxAgeMinutes){

        if(detailId === id) closeDetail();

      const inView = bounds.contains(L.latLng(r.lat, r.lng));
      const catOn = activeCategories.has(r.category);

  // ---- Publicación diferida de reportes pendientes (offline) ----
  function restorePendingMarkers(){
    pendingQueue.forEach(item => upsertMarker(item.id, item.record));

  let flushInFlight = false;
  async function flushPendingQueue(){
    if(flushInFlight || pendingQueue.length === 0) return;
    if(navigator.onLine === false) return;
    flushInFlight = true;
    let synced = 0;
    try{
      for(const item of [...pendingQueue]){
        if(!pendingIds.has(item.id)) continue; // se canceló mientras esperábamos
        const ageMinutes = (Date.now() - item.record.ts) / 60000;
        if(ageMinutes > CONFIG.maxAgeMinutes){
          dequeuePending(item.id);
          removeMarker(item.id);
          updateCount();
          continue;
        }
        try{
          // record.photo sigue en base64 si uploadPhoto no llegó a correr
          // (offline desde el momento de publicar); si ya se subió en un
          // intento previo, ya es una URL de Storage y no hace falta
          // volver a subirla.
          if(item.record.photo && item.record.photo.startsWith('data:')){
            item.record.photo = await uploadPhoto(item.id, item.record.photo);
            savePendingQueue(pendingQueue);
          }
          await insertReport(item.id, item.record);
          dequeuePending(item.id);
          upsertMarker(item.id, item.record);
          updateCount();
          synced++;
        }catch(err){
          if(err instanceof NetworkError) break; // seguimos offline, se reintenta después
          dequeuePending(item.id);
          removeMarker(item.id);
          updateCount();
          showToast('No se pudo sincronizar un reporte pendiente.', true);
        }
      }
    } finally {
      flushInFlight = false;
    }
    if(synced > 0) showToast(synced === 1 ? 'Reporte pendiente publicado.' : `${synced} reportes pendientes publicados.`);
  }

  // desde otro dispositivo, no solo los que crea este navegador. Se
  // reutiliza el mismo intervalo como respaldo para reintentar la cola.
  async function refreshReports(){
    await fetchAllReports();
    renderVisibleMarkers();
    await flushPendingQueue();
  }

  loadConfig();
  restorePendingMarkers();
  map.on('moveend zoomend', renderVisibleMarkers);
  const reportsReady = refreshReports();
  setInterval(refreshReports, 8000);
  window.addEventListener('online', flushPendingQueue);

  // ---- Deep link: abrir un reporte compartido ----
  // openReportById es la parte reutilizable (centrar mapa + abrir popup);
  // la usan tanto el link compartido como el click en una notificación
  // push mientras la app ya está abierta (ver listener de 'message' más abajo).
  function openReportById(id){
    const r = reportsCache[id];
    if(!r) return;
    map.setView([r.lat, r.lng], 16);
    setTimeout(() => {
      upsertMarker(id, r);
      openDetail(id);
    }, 300);
  }

  // Los links nuevos usan ?r= (query param, visible al servidor — lo
  // necesita netlify/edge-functions/report-preview.ts para armar el
  // preview de WhatsApp/Twitter, algo que un #hash nunca podría lograr
  // porque el fragmento no se manda en la request). Se sigue leyendo
  // #r= también por si queda algún link viejo compartido con el esquema
  // anterior — no cuesta nada mantenerlo.
  async function openSharedReportFromUrl(){
    const id = new URLSearchParams(location.search).get('r')
      || (location.hash.match(/r=([^&]+)/) || [])[1];
    if(!id) return;
    await reportsReady;
    openReportById(decodeURIComponent(id));
  }

  // ---- Notificaciones push: suscripción y estado del botón ----
  function urlBase64ToUint8Array(base64String){
    const padding = '='.repeat((4 - base64String.length % 4) % 4);
    const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
    const raw = atob(base64);
    return Uint8Array.from([...raw].map(c => c.charCodeAt(0)));
  }

  const pushToggleBtn = document.getElementById('push-toggle-btn');
  function setPushButtonState(state){ pushToggleBtn.dataset.state = state; }

  async function subscribeToPush(){
    setPushButtonState('loading');
    try{
      const permission = await Notification.requestPermission();
      if(permission !== 'granted'){
        showToast('Necesitamos permiso de notificaciones para poder avisarte');
        setPushButtonState('inactive');
        return;
      }
      const reg = await navigator.serviceWorker.ready;
      const sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
      });
      const json = sub.toJSON();
      const latlng = lastKnownLatLng || [DEFAULT_CENTER[0], DEFAULT_CENTER[1]];
      // Sin política de SELECT en push_subscriptions a propósito (ver
      // CLAUDE.md), así que un upsert con on_conflict/return=representation
      // falla: PostgREST necesita "leer de vuelta" la fila para resolverlo,
      // y esa lectura choca con la ausencia deliberada de esa política.
      // Se resuelve con DELETE (no-op si no existía) + POST simple, ambos
      // con return=minimal, en vez de un upsert.
      await fetch(`${PUSH_SUBS_URL}?endpoint=eq.${encodeURIComponent(json.endpoint)}`, {
        method: 'DELETE', headers: SUPABASE_HEADERS
      });
      const res = await fetch(PUSH_SUBS_URL, {
        method: 'POST',
        headers: { ...SUPABASE_HEADERS, 'Prefer': 'return=minimal' },
        body: JSON.stringify({
          endpoint: json.endpoint,
          p256dh: json.keys.p256dh,
          auth: json.keys.auth,
          lat: latlng[0], lng: latlng[1],
          updated_at: new Date().toISOString()
        })
      });
      if(!res.ok) throw new Error('No se pudo guardar la suscripción');
      localStorage.setItem(PUSH_ENDPOINT_KEY, json.endpoint);
      lastPushPosUpdate = { latlng, ts: Date.now() };
      setPushButtonState('active');
      showToast('Listo, te vamos a avisar de retenes cerca');
      // subscribeToPush() borra y vuelve a crear la fila (DELETE+POST, no
      // upsert), así que un re-suscribe pierde las categorías que el
      // dispositivo ya tenía elegidas del lado del servidor — hay que
      // restaurarlas, no solo decidir "primera vez sí/no".
      const savedCategories = getPushCategories();
      if(savedCategories === null){
        openPushCategoriesSheet();
      } else if(savedCategories.length < Object.keys(CATEGORIES).length){
        updatePushCategories(savedCategories);
      }
    }catch(err){
      console.error('Error suscribiendo a push', err);
      showToast('No se pudo activar el aviso de retenes cerca');
      setPushButtonState('inactive');
    }
  }

  async function unsubscribeFromPush(){
    setPushButtonState('loading');
    try{
      const reg = await navigator.serviceWorker.ready;
      const sub = await reg.pushManager.getSubscription();
      if(sub){
        await fetch(`${PUSH_SUBS_URL}?endpoint=eq.${encodeURIComponent(sub.endpoint)}`, {
          method: 'DELETE', headers: SUPABASE_HEADERS
        });
        await sub.unsubscribe();
      }
    }catch(err){ console.error('Error cancelando suscripción push', err); }
    localStorage.removeItem(PUSH_ENDPOINT_KEY);
    setPushButtonState('inactive');
    showToast('Avisos de retenes cerca desactivados');
  }

  let lastPushPosUpdate = null;
  async function updatePushSubscriptionPosition(latlng){
    if(pushToggleBtn.dataset.state !== 'active') return;
    if(lastPushPosUpdate){
      const elapsed = Date.now() - lastPushPosUpdate.ts;
      const moved = distanceMeters(lastPushPosUpdate.latlng[0], lastPushPosUpdate.latlng[1], latlng[0], latlng[1]);
      if(elapsed < PUSH_POS_UPDATE_MIN_MS && moved < PUSH_POS_UPDATE_MIN_METERS) return;
    }
    try{
      const reg = await navigator.serviceWorker.ready;
      const sub = await reg.pushManager.getSubscription();
      if(!sub) return;
      await fetch(`${PUSH_SUBS_URL}?endpoint=eq.${encodeURIComponent(sub.endpoint)}`, {
        method: 'PATCH',
        headers: { ...SUPABASE_HEADERS, 'Prefer': 'return=minimal' },
        body: JSON.stringify({ lat: latlng[0], lng: latlng[1], updated_at: new Date().toISOString() })
      });
      lastPushPosUpdate = { latlng, ts: Date.now() };
    }catch(err){ console.error('Error actualizando posición de suscripción push', err); }
  }

      await fetch(`${PUSH_SUBS_URL}?endpoint=eq.${encodeURIComponent(sub.endpoint)}`, {
        method: 'PATCH',
        headers: { ...SUPABASE_HEADERS, 'Prefer': 'return=minimal' },
        body: JSON.stringify({ categories: allSelected ? null : categories, updated_at: new Date().toISOString() })

  // ---- Geolocalización continua ("mi ubicación") ----
  const mapLoader = document.getElementById('map-loader');
  const locateBtn = document.getElementById('locate-btn');
  let meMarker = null;
  // firstFix: solo pasa a false con un fix exitoso. Un timeout de GPS no lo
  // toca, porque watchPosition sigue corriendo y puede resolver segundos
  // después — cuando eso pase, igual queremos centrar el mapa en el
  // usuario, no dejarlo silenciosamente en Santo Domingo.
  let firstFix = true;
  let deniedShown = false; // evita repetir el aviso de permiso denegado en cada reintento
  // hashHandled evita abrir el deep link de un reporte compartido dos
  // veces (una vez al mostrar el error de "no ubicación" y otra al llegar
  // el fix tardío).
  let hashHandled = false;
  let lastKnownLatLng = null;
  // following: modo "seguir mi ubicación" (como Waze/Google Maps),
  // activado a mano con el botón de ubicación. Mientras está activo, cada
  // fix nuevo de watchPosition hace panTo (no setView, para no resetear el
  // zoom) y se autodesactiva si el usuario arrastra el mapa a mano.
  let following = false;

  const meIcon = L.divIcon({
    className: '',
    html: `<div class="me-marker"><div class="me-dot"></div></div>`,
    iconSize:[22,22], iconAnchor:[11,11]
  });

  function hideLoader(){ mapLoader.hidden = true; }
  function tryOpenHashOnce(){
    if(hashHandled) return;
    hashHandled = true;
    openSharedReportFromUrl();
  }

  function startLocationWatch(){
    if(!('geolocation' in navigator)){
      hideLoader();
      showToast('Este navegador no soporta geolocalización');
      return;
    }
    navigator.geolocation.watchPosition(
      pos => {
        const latlng = [pos.coords.latitude, pos.coords.longitude];
        lastKnownLatLng = latlng;
        updatePushSubscriptionPosition(latlng);
        if(!meMarker){
          meMarker = L.marker(latlng, { icon: meIcon, zIndexOffset: 1000, keyboard:false }).addTo(map);
        } else {
          meMarker.setLatLng(latlng);
        }
        if(firstFix){
          map.setView(latlng, 15);
          firstFix = false;
          hideLoader();
          tryOpenHashOnce();
        } else if(following){
          map.panTo(latlng);
        }
      },
      err => {
        // PERMISSION_DENIED (código 1) es distinto a los otros dos: no es
        // que "está tardando", es que no va a llegar nunca hasta que el
        // usuario cambie el permiso a mano (en iOS/Safari en particular,
        // el navegador no vuelve a preguntar solo). Mostrarle el mensaje
        // genérico de "tardando" acá es engañoso — lo dejamos esperando
        // algo que no va a pasar. Mostramos un aviso accionable una sola
        // vez (deniedShown) para no repetirlo en cada reintento de
        // watchPosition.
        if(err.code === err.PERMISSION_DENIED){
          hideLoader();
          if(!deniedShown){
            deniedShown = true;
            showToast('Activa el permiso de ubicación para este sitio en los Ajustes de tu navegador.', true);
          }
          tryOpenHashOnce();
          return;
        }
        // POSITION_UNAVAILABLE o TIMEOUT: no marcamos firstFix = false acá,
        // porque el fix puede llegar igual unos segundos después (GPS frío
        // al abrir la PWA) y sí queremos centrar el mapa en ese momento en
        // vez de dejarlo trabado en Santo Domingo.
        if(!mapLoader.hidden){
          hideLoader();
          showToast('Tu ubicación está tardando en llegar. Se centrará el mapa apenas la tengamos.', true);
        }
        tryOpenHashOnce();
      },
      { enableHighAccuracy:true, timeout:20000, maximumAge:5000 }
    );
    // Tope de seguridad: no dejar el loader visible más de 20s.
    setTimeout(() => {
      if(!mapLoader.hidden) hideLoader();
      tryOpenHashOnce();
    }, 20500);
  }

  map.on('dragstart', () => {

  function compressImage(file){
    return new Promise((resolve, reject) => {
      const img = new Image();
      const reader = new FileReader();
      reader.onload = e => { img.src = e.target.result; };
      reader.onerror = reject;
      img.onload = () => {
        const maxW = 480;
        const scale = Math.min(1, maxW / img.width);
        const w = Math.round(img.width * scale);
        const h = Math.round(img.height * scale);
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.6));
      };
      img.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

    try{
      record.photo = await uploadPhoto(id, record.photo);
      await insertReport(id, record);
      const mine = getMine(); mine.add(id); saveMine(mine);
      upsertMarker(id, record);
      updateCount();
      map.setView([record.lat, record.lng], 15);
      closeOverlay();
      registerReportTime();
      showToast('Reporte publicado. Gracias por avisar.');
    }catch(err){
      if(err instanceof NetworkError){
        // Si uploadPhoto falló antes de terminar, record.photo sigue
        // siendo el data: URL original — flushPendingQueue lo sube
        // recién cuando vuelva la red (ver ahí el chequeo por prefijo).
        enqueuePending(id, record); // antes de upsertMarker, para que ya se vea "pending"
        const mine = getMine(); mine.add(id); saveMine(mine);
        upsertMarker(id, record);
        updateCount();
        map.setView([record.lat, record.lng], 15);
        closeOverlay();
        registerReportTime();
        showToast('Sin conexión: el reporte se publicará solo cuando vuelvas a tener internet.', true);
        return;
      }
      renderSheet(`
        <h2>No se pudo publicar</h2>
        <div class="error-box">Hubo un problema guardando el reporte. Intenta de nuevo.</div>
        <div class="btn-row">
          <button class="btn btn-ghost" id="cancel-btn">Cerrar</button>
          <button class="btn btn-primary" id="retry-btn">Reintentar</button>
        </div>
      `);
      document.getElementById('cancel-btn').addEventListener('click', closeOverlay);
      document.getElementById('retry-btn').addEventListener('click', publishReport);
    }
  }

  // ---- PWA: service worker (requiere servir por http/https, no file://) ----
  if('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')){
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
})();
</script>
</body>
</html>
