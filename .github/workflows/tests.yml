name: Tests

# Corre las 13 suites de Playwright en cada push y en cada PR.
#
# CÓMO ENCAJA ESTO CON EL DESPLIEGUE (importante, es contraintuitivo):
# este workflow NO despliega. El Worker de Cloudflare está conectado al repo y
# despliega solo al recibir un push a `main`. Lo que hace que a producción
# llegue solo código probado NO es un paso de este archivo, sino la regla de
# protección de `main`: exige que el check `playwright` esté en verde antes de
# poder mergear un PR, y no deja pushear directo. O sea que `main` solo recibe
# código que ya pasó por acá, y Cloudflare despliega desde `main` tranquilo.
#
# Hubo una versión de este archivo con un job `deploy` que corría
# `wrangler deploy` con un CLOUDFLARE_API_TOKEN, para lo mismo. Se sacó: con
# `main` protegido es redundante, y tener dos mecanismos de despliegue confunde
# sobre cuál manda. Está en el historial de git si alguna vez hace falta (ver
# "Cómo llega el código a producción" en CLAUDE.md).

on:
  push:
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  # En ramas, un push nuevo cancela la corrida anterior: no tiene sentido
  # gastar minutos en un commit que ya quedó viejo. En `main` NO se cancela:
  # esa corrida es el registro de que lo que está desplegado pasó los tests, y
  # cancelarla deja el commit sin veredicto.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # RED DE SEGURIDAD, no es paranoia: las suites mockean la red con
      # page.route, pero si alguna vez queda un endpoint sin mockear, la
      # petición saldría a la instancia REAL de Supabase — y algunas de esas
      # llamadas escriben (create_report, purge_expired_reports). Mandando el
      # dominio a 127.0.0.1, cualquier hueco de mocking falla rápido y ruidoso
      # en vez de tocar producción desde CI.
      - name: Blindar producción contra huecos de mocking
        run: echo "127.0.0.1 nikexwjxxcxzhsuypsjn.supabase.co" | sudo tee -a /etc/hosts

      # Playwright NO es dependencia del proyecto (no hay package.json, a
      # propósito): se instala acá, igual que se hace a mano en local. La
      # versión va pineada para que una release nueva no rompa el CI de un día
      # para el otro; para subirla, cambiar el número acá.
      - name: Instalar Playwright
        run: |
          npm install -g playwright@1.56.1
          npx playwright install --with-deps chromium

      # tests/_setup.js hace require('playwright') y prueba unas rutas fijas
      # que no incluyen la del runner de GitHub. Con NODE_PATH apuntando al
      # root global de npm, la primera opción resuelve y no hay que tocar el
      # código de los tests.
      - name: Exponer el Playwright global a los tests
        run: echo "NODE_PATH=$(npm root -g)" >> "$GITHUB_ENV"

      - name: Correr las suites
        run: node tests/run.js

      # NO necesita credenciales, y por eso corre siempre (también en PRs):
      # valida wrangler.jsonc, _worker.js y la lista de assets. Si alguien
      # rompe la config de despliegue, se entera acá y no al desplegar.
      # También es la guarda de .assetsignore: si dejara de excluir algo, la
      # lista de archivos subidos cambiaría.
      - name: Validar la configuración de despliegue
        run: npx --yes wrangler@4.118.0 deploy --dry-run

      # check-publicar.js deja capturas de pantalla; cuando algo falla son lo
      # más rápido para entender qué se rompió sin reproducir en local.
      - name: Guardar capturas si algo falló
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: capturas
          path: tests/*.png
          if-no-files-found: ignore
          retention-days: 7
